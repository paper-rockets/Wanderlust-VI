<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single Floating Crystal - Editor & Settings</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #050508;
            font-family: sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #crystal-editor {
            position: fixed;
            right: 16px;
            top: 16px;
            width: 240px;
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-family: sans-serif;
            z-index: 20;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        #crystal-editor label {
            display: block;
            margin-top: 6px;
        }
        #crystal-editor input[type="range"] {
            width: 100%;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- Crystal Editor Settings UI Panel -->
    <div id="crystal-editor">
        <h3 style="margin-top:0; margin-bottom:10px; font-size:16px;">Crystal & Env Editor</h3>
        
        <div style="margin-bottom: 10px; padding-bottom: 5px; border-bottom: 1px solid #444;">
            <strong style="font-size:13px; display:block; margin-bottom:5px; color:#aaa;">Flying Crystal Colors</strong>
            <div style="display:flex; flex-wrap:wrap; gap:5px; margin-bottom: 5px;">
                <input type="color" id="c-f-col0" value="#6a00ff" style="width:25px;height:25px;padding:0;border:none;">
                <input type="color" id="c-f-col1" value="#ff0066" style="width:25px;height:25px;padding:0;border:none;">
                <input type="color" id="c-f-col2" value="#ff6600" style="width:25px;height:25px;padding:0;border:none;">
                <input type="color" id="c-f-col3" value="#ffcc00" style="width:25px;height:25px;padding:0;border:none;">
                <input type="color" id="c-f-col4" value="#00ffaa" style="width:25px;height:25px;padding:0;border:none;">
                <input type="color" id="c-f-col5" value="#00aaff" style="width:25px;height:25px;padding:0;border:none;">
            </div>
            <label style="font-size:12px">Opacity <input type="range" id="c-fly-opacity" min="0" max="1" step="0.05" value="0.7" style="width:100%"></label><br>
            <label style="font-size:12px">Contrast <input type="range" id="c-fly-contrast" min="0.1" max="3" step="0.1" value="1.0" style="width:100%"></label><br>
            <label style="font-size:12px">Hue Shift <input type="range" id="c-fly-hue" min="0" max="1" step="0.01" value="0.0" style="width:100%"></label><br>
            <label style="font-size:12px">Base Glow <input type="range" id="c-baseGlow" min="0" max="3" step="0.1" value="1.2" style="width:100%"></label><br>
            <label style="font-size:12px">Night Glow <input type="range" id="c-nightGlow" min="0" max="5" step="0.1" value="1.5" style="width:100%"></label><br>
            <label style="font-size:12px">Roughness <input type="range" id="c-roughness" min="0" max="1" step="0.05" value="0.08" style="width:100%"></label><br>
            <label style="font-size:12px">Metalness <input type="range" id="c-metalness" min="0" max="1" step="0.05" value="0.15" style="width:100%"></label><br>
        </div>
    </div>

    <script>
        // Setup Scene, Camera, Renderer
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x080810);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(10, 20, 15);
        scene.add(dirLight);

        // 1 Single Floating Crystal Geometry & Material
        const geoCrystal = new THREE.OctahedronGeometry(1, 1).toNonIndexed();
        geoCrystal.scale(1, 3, 1);
        geoCrystal.computeVertexNormals();

        const matCrystal = new THREE.MeshPhysicalMaterial({
            roughness: 0.08,
            metalness: 0.15,
            transparent: true,
            opacity: 0.82,
            transmission: 0.3,
            thickness: 2.0,
            ior: 2.2,
            clearcoat: 1.0,
            clearcoatRoughness: 0.05,
            sheen: 1.0,
            sheenRoughness: 0.3,
            sheenColor: new THREE.Color(0xffffff),
            envMapIntensity: 1.5,
            depthWrite: true,
            depthTest: true,
            side: THREE.DoubleSide
        });

        matCrystal.onBeforeCompile = (shader) => {
            shader.uniforms.crystalGlow = { value: 0.0 };
            shader.uniforms.baseGlow = { value: 1.2 };
            shader.uniforms.nightGlowMult = { value: 1.5 };
            shader.uniforms.uCustomColors = { value: [
                new THREE.Color('#6a00ff'), new THREE.Color('#ff0066'),
                new THREE.Color('#ff6600'), new THREE.Color('#ffcc00'),
                new THREE.Color('#00ffaa'), new THREE.Color('#00aaff')
            ]};
            shader.uniforms.flyHue = { value: 0.0 };
            shader.uniforms.flyContrast = { value: 1.0 };
            shader.uniforms.uTime = { value: 0.0 };
            matCrystal.userData.shader = shader;

            shader.vertexShader = shader.vertexShader.replace(
                '#include <common>',
                `#include <common>
                 varying vec3 vPositionC;
                 varying vec3 vWorldNormalC;
                 varying vec3 vWorldPosC;`
            ).replace(
                '#include <begin_vertex>',
                `#include <begin_vertex>
                 vPositionC = position;`
            ).replace(
                '#include <worldpos_vertex>',
                `#include <worldpos_vertex>
                 vWorldPosC = (modelMatrix * vec4(transformed, 1.0)).xyz;
                 vWorldNormalC = normalize((modelMatrix * vec4(normal, 0.0)).xyz);`
            );

            shader.fragmentShader = `
                uniform float crystalGlow;
                uniform float baseGlow;
                uniform float nightGlowMult;
                uniform float flyHue;
                uniform float flyContrast;
                uniform float uTime;
                uniform vec3 uCustomColors[6];
                ${shader.fragmentShader}
            `.replace(
                '#include <common>',
                `#include <common>
                 varying vec3 vPositionC;
                 varying vec3 vWorldNormalC;
                 varying vec3 vWorldPosC;
                 vec3 rgb2hsv(vec3 c) {
                     vec4 K = vec4(0.0, -1.0 / 3.0, 2.0 / 3.0, -1.0);
                     vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g));
                     vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r));
                     float d = q.x - min(q.w, q.y);
                     float e = 1.0e-10;
                     return vec3(abs(q.z + (q.w - q.y) / (6.0 * d + e)), d / (q.x + e), q.x);
                 }
                 vec3 hsv2rgb(vec3 c) {
                     vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
                     vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
                     return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
                 }`
            ).replace(
                '#include <color_fragment>',
                `#include <color_fragment>
                 float tC = clamp((vPositionC.y + 3.0) / 6.0, 0.0, 1.0);

                 // Smooth cubic interpolation through 6 color stops
                 float segment = tC * 5.0;
                 int idx = int(floor(segment));
                 float frac = fract(segment);
                 float t = frac * frac * (3.0 - 2.0 * frac); // smoothstep

                 vec3 gradientColor;
                 if (idx == 0) gradientColor = mix(uCustomColors[0], uCustomColors[1], t);
                 else if (idx == 1) gradientColor = mix(uCustomColors[1], uCustomColors[2], t);
                 else if (idx == 2) gradientColor = mix(uCustomColors[2], uCustomColors[3], t);
                 else if (idx == 3) gradientColor = mix(uCustomColors[3], uCustomColors[4], t);
                 else gradientColor = mix(uCustomColors[4], uCustomColors[5], t);

                 // Hue Shift
                 if (flyHue > 0.0) {
                     vec3 hsv = rgb2hsv(gradientColor);
                     hsv.x = fract(hsv.x + flyHue);
                     gradientColor = hsv2rgb(hsv);
                 }

                 // Contrast
                 if (flyContrast != 1.0) {
                     gradientColor = pow(gradientColor, vec3(1.0 / flyContrast));
                 }

                 // Fresnel rim glow — bright edge light for that glassy crystal look
                 vec3 viewDir = normalize(cameraPosition - vWorldPosC);
                 float fresnel = 1.0 - abs(dot(viewDir, vWorldNormalC));
                 fresnel = pow(fresnel, 3.0);
                 vec3 rimColor = mix(gradientColor, vec3(1.0), 0.6);
                 gradientColor = mix(gradientColor, rimColor, fresnel * 0.7);

                 // Vibrance boost — push saturation without clipping
                 vec3 hsvFinal = rgb2hsv(gradientColor);
                 hsvFinal.y = min(hsvFinal.y * 1.4, 1.0);
                 hsvFinal.z = min(hsvFinal.z * 1.15, 1.0);
                 gradientColor = hsv2rgb(hsvFinal);

                 diffuseColor.rgb = gradientColor;
                `
            ).replace(
                '#include <emissivemap_fragment>',
                `#include <emissivemap_fragment>
                 // Inner glow that follows the gradient — brighter at edges
                 float innerGlow = fresnel * 0.4 + 0.15;
                 totalEmissiveRadiance += diffuseColor.rgb * (baseGlow * innerGlow + crystalGlow * nightGlowMult);
                `
            );
        };

        const crystalMesh = new THREE.Mesh(geoCrystal, matCrystal);
        crystalMesh.scale.set(1.8, 3.0, 1.8);
        scene.add(crystalMesh);

        // Editor Settings UI Event Listeners
        document.getElementById('c-roughness').addEventListener('input', (e) => matCrystal.roughness = parseFloat(e.target.value));
        document.getElementById('c-metalness').addEventListener('input', (e) => matCrystal.metalness = parseFloat(e.target.value));
        document.getElementById('c-fly-opacity').addEventListener('input', (e) => matCrystal.opacity = parseFloat(e.target.value));

        document.getElementById('c-fly-hue').addEventListener('input', (e) => {
            if(matCrystal.userData.shader) matCrystal.userData.shader.uniforms.flyHue.value = parseFloat(e.target.value);
        });
        document.getElementById('c-fly-contrast').addEventListener('input', (e) => {
            if(matCrystal.userData.shader) matCrystal.userData.shader.uniforms.flyContrast.value = parseFloat(e.target.value);
        });
        document.getElementById('c-baseGlow').addEventListener('input', (e) => {
            if(matCrystal.userData.shader) matCrystal.userData.shader.uniforms.baseGlow.value = parseFloat(e.target.value);
        });
        document.getElementById('c-nightGlow').addEventListener('input', (e) => {
            if(matCrystal.userData.shader) matCrystal.userData.shader.uniforms.nightGlowMult.value = parseFloat(e.target.value);
        });

        function updateCrystalColors() {
            if (matCrystal.userData.shader && matCrystal.userData.shader.uniforms.uCustomColors) {
                const flyColors = [
                    document.getElementById('c-f-col0').value, document.getElementById('c-f-col1').value,
                    document.getElementById('c-f-col2').value, document.getElementById('c-f-col3').value,
                    document.getElementById('c-f-col4').value, document.getElementById('c-f-col5').value
                ];
                for(let i=0; i<6; i++) {
                    matCrystal.userData.shader.uniforms.uCustomColors.value[i].set(flyColors[i]);
                }
            }
        }

        for(let i=0; i<6; i++) {
            document.getElementById('c-f-col'+i).addEventListener('input', updateCrystalColors);
        }

        // Animation Loop
        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Gentle Floating levitation & rotation
            crystalMesh.position.y = Math.sin(time * 1.5) * 0.4;
            crystalMesh.rotation.y = time * 0.3;

            if (matCrystal.userData.shader) {
                matCrystal.userData.shader.uniforms.uTime.value = time;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
