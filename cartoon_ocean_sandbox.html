<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cartoon Ocean Sandbox - ShaderFrog Clone</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      background: #1e293b;
      font-family: monospace;
      color: #111;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #f8fafc;
      border: 2px solid #0f172a;
      padding: 12px;
      font-size: 11px;
      z-index: 100;
      width: 290px;
      max-height: 94vh;
      overflow-y: auto;
    }
    #controls h2 {
      margin: 0 0 10px 0;
      font-size: 13px;
      border-bottom: 1px solid #ccc;
      padding-bottom: 4px;
      text-transform: uppercase;
    }
    .group-title {
      font-weight: bold;
      margin: 8px 0 4px 0;
      color: #333;
      border-bottom: 1px dashed #bbb;
      padding-bottom: 2px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }
    .row label {
      font-size: 11px;
      flex: 1;
    }
    .row input[type="range"] {
      width: 110px;
    }
    .row span {
      width: 38px;
      text-align: right;
      font-size: 10px;
      color: #555;
    }
    .row input[type="color"] {
      width: 45px;
      height: 22px;
      border: 1px solid #888;
      padding: 0;
      cursor: pointer;
    }
    select, button {
      width: 100%;
      padding: 6px;
      margin-top: 6px;
      font-family: monospace;
      font-size: 11px;
      cursor: pointer;
      background: #fff;
      border: 1px solid #444;
    }
    button:hover {
      background: #e2e2e2;
    }
    #status {
      margin-top: 8px;
      padding: 4px;
      background: #eef;
      border: 1px solid #99c;
      font-size: 10px;
      word-break: break-all;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <div id="controls">
    <h2>Cartoon Ocean (ShaderFrog)</h2>
    
    <div class="row">
      <label>Mesh Type:</label>
      <select id="mesh-type">
        <option value="cube" selected>Water Block (Cube / Diorama)</option>
        <option value="plane">Ocean Plane (Flat)</option>
      </select>
    </div>

    <div class="group-title">Wave Shape & Physics</div>
    <div class="row">
      <label>Wave Height:</label>
      <input id="p-waveHeight" type="range" min="0" max="3" step="0.01" value="0.848">
      <span id="v-waveHeight">0.85</span>
    </div>
    <div class="row">
      <label>Wave Speed:</label>
      <input id="p-waveSpeed" type="range" min="0" max="2" step="0.01" value="0.408">
      <span id="v-waveSpeed">0.41</span>
    </div>
    <div class="row">
      <label>Wave Frequency:</label>
      <input id="p-waveFrequency" type="range" min="0.05" max="2" step="0.01" value="0.625">
      <span id="v-waveFrequency">0.63</span>
    </div>
    <div class="row">
      <label>Wave Sharpness:</label>
      <input id="p-waveSharpness" type="range" min="0" max="2" step="0.01" value="0.744">
      <span id="v-waveSharpness">0.74</span>
    </div>

    <div class="group-title">Color & Crests</div>
    <div class="row">
      <label>Deep Color:</label>
      <input id="p-waterColor" type="color" value="#00aaff">
    </div>
    <div class="row">
      <label>Highlight Crest:</label>
      <input id="p-waterHighlight" type="color" value="#ffffff">
    </div>
    <div class="row">
      <label>Crest Contrast:</label>
      <input id="p-contrast" type="range" min="0" max="40" step="0.5" value="21.739">
      <span id="v-contrast">21.7</span>
    </div>
    <div class="row">
      <label>Brightness:</label>
      <input id="p-brightness" type="range" min="0.2" max="3" step="0.05" value="1.535">
      <span id="v-brightness">1.54</span>
    </div>
    <div class="row">
      <label>Foam Offset:</label>
      <input id="p-offset" type="range" min="-0.1" max="0.2" step="0.005" value="0.042">
      <span id="v-offset">0.04</span>
    </div>

    <div class="group-title">Surface Caustics & Sparkles</div>
    <div class="row">
      <label>Sparkle Pop:</label>
      <input id="p-specularPop" type="range" min="0" max="2" step="0.02" value="0.782">
      <span id="v-specularPop">0.78</span>
    </div>
    <div class="row">
      <label>Sparkle Brightness:</label>
      <input id="p-specularBrightness" type="range" min="0" max="5" step="0.1" value="2.0">
      <span id="v-specularBrightness">2.0</span>
    </div>
    <div class="row">
      <label>Disp Height:</label>
      <input id="p-dispHeight" type="range" min="0" max="1" step="0.01" value="0.21">
      <span id="v-dispHeight">0.21</span>
    </div>

    <div class="group-title">PBR Surface</div>
    <div class="row">
      <label>Roughness:</label>
      <input id="p-roughness" type="range" min="0" max="1" step="0.02" value="0.0">
      <span id="v-roughness">0.0</span>
    </div>
    <div class="row">
      <label>Metalness:</label>
      <input id="p-metalness" type="range" min="0" max="1" step="0.02" value="0.24">
      <span id="v-metalness">0.24</span>
    </div>
    <div class="row">
      <label>Wireframe:</label>
      <input id="p-wireframe" type="checkbox" style="width: auto;">
    </div>

    <button id="btn-reset">Reset Defaults</button>
    <div id="status">Compiling shaders...</div>
  </div>

  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    window.lastErrors = [];
    const origError = console.error;
    console.error = function(...args) {
      window.lastErrors.push(args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' '));
      origError.apply(console, args);
    };

    window.shaderLogs = [];
    const statusEl = document.getElementById('status');

    // -------------------------------------------------------------
    // 1. Setup Scene, Camera, Renderer
    // -------------------------------------------------------------
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1e293b);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(2.8, 2.4, 3.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    renderer.debug.checkShaderErrors = true;
    container.appendChild(renderer.domElement);
    window.renderer = renderer;

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0, 0);

    // Lights
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
    keyLight.position.set(5, 8, 4);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x7ec8e3, 1.2);
    fillLight.position.set(-5, 4, -4);
    scene.add(fillLight);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);

    // -------------------------------------------------------------
    // 2. Texture Loading
    // -------------------------------------------------------------
    const texLoader = new THREE.TextureLoader();

    const waterTex = texLoader.load('./assets/water-tex-cartoon.jpg', () => {
      statusEl.textContent = 'Ready. Running live.';
    }, undefined, (err) => {
      statusEl.textContent = 'Texture warning: ' + err.message;
    });
    waterTex.wrapS = waterTex.wrapT = THREE.RepeatWrapping;

    const noiseTex = texLoader.load('./assets/smooth_monochrome_noise.jpg');
    noiseTex.wrapS = noiseTex.wrapT = THREE.RepeatWrapping;

    // -------------------------------------------------------------
    // 3. ShaderFrog Cartoon Ocean Uniforms
    // -------------------------------------------------------------
    const oceanUniforms = {
      time: { value: 0.0 },
      uIsCube: { value: 1.0 },

      // Vertex waves & noise parameters
      normalOffset: { value: 0.1 },
      fbmHeight: { value: 0.009 },
      fbmScale: { value: 2.371 },
      pScale: { value: new THREE.Vector3(3.0, 0.5, 3.0) },
      waveHeight: { value: 0.848 },
      waveSpeed: { value: 0.408 },
      waveFrequency: { value: 0.625 },
      waveSharpness: { value: 0.744 },

      // Color / Crests
      waveColor: { value: new THREE.Color(0, 0.666667, 1.0) },
      waterHighlight: { value: new THREE.Color(1.0, 1.0, 1.0) },
      contrast: { value: 21.739 },
      brightness: { value: 1.535 },
      offset: { value: 0.042 },

      // Cartoon Water Surface textures & sparkles
      waterImage: { value: waterTex },
      waterScale: { value: new THREE.Vector2(2.0, 2.0) },
      waterSpeed: { value: new THREE.Vector2(-0.166195, -0.170226) },
      waterColorTint: { value: new THREE.Color(0, 0.666667, 1.0) },
      waterAmt: { value: 0.469 },

      displacement: { value: noiseTex },
      displacementSpeed: { value: new THREE.Vector2(-0.070788, 0.068336) },
      waterDisplacementScale: { value: new THREE.Vector2(1.0, 1.0) },
      displacementHeight: { value: 0.21 },

      specularMap: { value: noiseTex },
      specularScale: { value: 0.706 },
      specularBrightness: { value: 2.0 },
      specularPop: { value: 0.782 },
      specularMax: { value: 0.303 },
      specularSpeed: { value: new THREE.Vector2(0.037474, 0.046698) }
    };

    // -------------------------------------------------------------
    // 4. MeshPhysicalMaterial with Custom Shader Injections
    // -------------------------------------------------------------
    const oceanMaterial = new THREE.MeshPhysicalMaterial({
      roughness: 0.0,
      metalness: 0.239,
      iridescence: 0.224,
      clearcoat: 0.1,
      clearcoatRoughness: 0.1
    });

    oceanMaterial.onBeforeCompile = (shader) => {
      // Connect uniforms
      Object.assign(shader.uniforms, oceanUniforms);
      shader.defines.USE_UV = '';

      // --- VERTEX SHADER INJECTION ---
      shader.vertexShader = shader.vertexShader.replace(
        '#include <common>',
        `#include <common>
        varying float vOceanHeight;

        uniform float time;
        uniform float uIsCube;
        uniform float normalOffset;
        uniform float fbmHeight;
        uniform float fbmScale;
        uniform vec3 pScale;
        uniform float waveHeight;
        uniform float waveSpeed;
        uniform float waveFrequency;
        uniform float waveSharpness;

        // Simplex 4D Noise & FBM
        vec4 mod289_ocean(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        float mod289_ocean(float x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 permute_ocean(vec4 x) { return mod289_ocean(((x * 34.0) + 1.0) * x); }
        float permute_ocean(float x) { return mod289_ocean(((x * 34.0) + 1.0) * x); }
        vec4 taylorInvSqrt_ocean(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
        float taylorInvSqrt_ocean(float r) { return 1.79284291400159 - 0.85373472095314 * r; }

        vec4 grad4_ocean(float j, vec4 ip) {
          const vec4 ones = vec4(1.0, 1.0, 1.0, -1.0);
          vec4 p, s;
          p.xyz = floor(fract(vec3(j) * ip.xyz) * 7.0) * ip.z - 1.0;
          p.w = 1.5 - dot(abs(p.xyz), ones.xyz);
          s = vec4(lessThan(p, vec4(0.0)));
          p.xyz = p.xyz + (s.xyz * 2.0 - 1.0) * s.www;
          return p;
        }

        float snoise_ocean(vec4 v, float t) {
          const vec4 C = vec4(0.138196601125011, 0.276393202250021, 0.414589803375032, -0.447213595499958);
          vec4 i  = floor(v + dot(v, vec4(0.309016994374947451)));
          vec4 x0 = v - i + dot(i, C.xxxx);

          vec4 i0;
          vec3 isX = step(x0.yzw, x0.xxx);
          vec3 isYZ = step(x0.zww, x0.yyz);
          i0.x = isX.x + isX.y + isX.z;
          i0.yzw = 1.0 - isX;
          i0.y += isYZ.x + isYZ.y;
          i0.zw += 1.0 - isYZ.xy;
          i0.z += isYZ.z;
          i0.w += 1.0 - isYZ.z;

          vec4 i3 = clamp(i0, 0.0, 1.0);
          vec4 i2 = clamp(i0 - 1.0, 0.0, 1.0);
          vec4 i1 = clamp(i0 - 2.0, 0.0, 1.0);

          vec4 x1 = x0 - i1 + C.xxxx;
          vec4 x2 = x0 - i2 + C.yyyy;
          vec4 x3 = x0 - i3 + C.zzzz;
          vec4 x4 = x0 + C.wwww;

          i = mod289_ocean(i);
          float j0 = permute_ocean(permute_ocean(permute_ocean(permute_ocean(i.w) + i.z) + i.y) + i.x);
          vec4 j1 = permute_ocean(permute_ocean(permute_ocean(permute_ocean(
            i.w + vec4(i1.w, i2.w, i3.w, 1.0))
            + i.z + vec4(i1.z, i2.z, i3.z, 1.0))
            + i.y + vec4(i1.y, i2.y, i3.y, 1.0))
            + i.x + vec4(i1.x, i2.x, i3.x, 1.0));

          vec4 ip = vec4(1.0/294.0, 1.0/49.0, 1.0/7.0, 0.0);
          vec4 p0 = grad4_ocean(j0, ip);
          vec4 p1 = grad4_ocean(j1.x, ip);
          vec4 p2 = grad4_ocean(j1.y, ip);
          vec4 p3 = grad4_ocean(j1.z, ip);
          vec4 p4 = grad4_ocean(j1.w, ip);

          vec4 norm = taylorInvSqrt_ocean(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
          p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
          p4 *= 1.79284291400159 - 0.85373472095314 * dot(p4,p4);

          vec3 m0 = max(0.6 - vec3(dot(x0,x0), dot(x1,x1), dot(x2,x2)), 0.0);
          vec2 m1 = max(0.6 - vec2(dot(x3,x3), dot(x4,x4)), 0.0);
          m0 = m0 * m0;
          m1 = m1 * m1;
          return 49.0 * (dot(m0 * m0, vec3(dot(p0, x0), dot(p1, x1), dot(p2, x2)))
                       + dot(m1 * m1, vec2(dot(p3, x3), dot(p4, x4))));
        }

        float ocean_surface(vec4 coord, float t) {
          float n = 0.0;
          n += 0.250 * abs(snoise_ocean(coord * 4.0, t));
          n += 0.500 * abs(snoise_ocean(coord * 8.0, t));
          n += 0.250 * abs(snoise_ocean(coord * 16.0, t));
          n += 0.125 * abs(snoise_ocean(coord * 32.0, t));
          n += 0.125 * abs(snoise_ocean(coord * 64.0, t));
          return n;
        }

        vec3 ocean_GerstnerWave(vec4 wave, vec3 p, inout vec3 tangent, inout vec3 binormal, float t) {
          float steepness = wave.z;
          float wavelength = wave.w;
          float k = 2.0 * 3.14159265 / wavelength;
          float c = sqrt(9.8 / k);
          vec2 d = normalize(wave.xy);
          float f = k * (dot(d, p.xz) - c * t);
          float a = steepness / k;

          tangent += vec3(
            -d.x * d.x * (steepness * sin(f)),
            d.x * (steepness * cos(f)),
            -d.x * d.y * (steepness * sin(f))
          );
          binormal += vec3(
            -d.x * d.y * (steepness * sin(f)),
            d.y * (steepness * cos(f)),
            -d.y * d.y * (steepness * sin(f))
          );
          return vec3(
            d.x * (a * cos(f)),
            a * sin(f),
            d.y * (a * cos(f))
          );
        }

        vec3 ocean_displace(vec3 pt, float t, float ySc) {
          vec3 tan = vec3(0.0, 0.0, 1.0);
          vec3 bit = vec3(0.0, 0.0, 1.0);

          float reset = (1.0 / pScale.y);
          pt.y += ocean_surface(
            vec4((pt + t * 0.1) * fbmScale, 1.0), t
          ) * fbmHeight * reset;

          vec3 wave1 = ocean_GerstnerWave(vec4(vec2(-1.0, 0.0), waveSharpness, pScale.x * 0.5 * waveFrequency), pt, tan, bit, t);
          vec3 wave2 = ocean_GerstnerWave(vec4(vec2(1.0, 0.0), 0.25, 4.0 * waveFrequency), pt, tan, bit, t);
          vec3 wave3 = ocean_GerstnerWave(vec4(vec2(1.0, 1.0), 0.15, 6.0 * waveFrequency), pt, tan, bit, t);
          vec3 wave4 = ocean_GerstnerWave(vec4(vec2(1.0, 1.0), 0.40, 2.0 * waveFrequency), pt, tan, bit, t);

          vec3 newPos = pt;
          float scale = waveHeight * ySc * reset;
          newPos += wave1 * scale;
          newPos += wave2 * scale * 0.5;
          newPos += wave3 * scale * 0.5;
          newPos += wave4 * scale * 0.2;

          return newPos;
        }

        vec3 ocean_orthogonal(vec3 v) {
          return normalize(abs(v.x) > abs(v.z) ? vec3(-v.y, v.x, 0.0) : vec3(0.0, -v.z, v.y));
        }
        `
      );

      shader.vertexShader = shader.vertexShader.replace(
        '#include <begin_vertex>',
        `#include <begin_vertex>

        // Calculate dynamic wave displacement and normal
        float yWeight = (uIsCube > 0.5) ? clamp(position.y * 2.0, 0.0, 1.0) : 1.0;
        vec3 pScaled = position * pScale;
        float sTime = time * waveSpeed;

        vec3 dispPos = ocean_displace(pScaled, sTime, yWeight);

        vec3 t1 = ocean_orthogonal(normal);
        vec3 b1 = normalize(cross(normal, t1));
        vec3 n1 = pScaled + t1 * normalOffset;
        vec3 n2 = pScaled + b1 * normalOffset;
        vec3 dispN1 = ocean_displace(n1, sTime, yWeight);
        vec3 dispN2 = ocean_displace(n2, sTime, yWeight);

        vec3 dispTan = dispN1 - dispPos;
        vec3 dispBitan = dispN2 - dispPos;
        vec3 dispNorm = normalize(cross(dispTan, dispBitan));

        // Assign displaced normal & final position
        objectNormal = dispNorm;
        transformed = mix(position, dispPos, yWeight);
        vOceanHeight = transformed.y;
        `
      );

      // --- FRAGMENT SHADER INJECTION ---
      shader.fragmentShader = shader.fragmentShader.replace(
        '#include <common>',
        `#include <common>
        varying float vOceanHeight;

        uniform float time;
        uniform vec3 waveColor;
        uniform vec3 waterHighlight;
        uniform float contrast;
        uniform float brightness;
        uniform float offset;

        uniform sampler2D waterImage;
        uniform vec2 waterScale;
        uniform vec2 waterSpeed;
        uniform vec3 waterColorTint;
        uniform float waterAmt;

        uniform sampler2D displacement;
        uniform vec2 displacementSpeed;
        uniform vec2 waterDisplacementScale;
        uniform float displacementHeight;

        uniform sampler2D specularMap;
        uniform float specularScale;
        uniform float specularBrightness;
        uniform float specularPop;
        uniform float specularMax;
        uniform vec2 specularSpeed;

        vec4 getCartoonWater(vec2 uvCoord) {
          vec4 disp = texture2D(
            displacement,
            uvCoord * waterDisplacementScale + time * displacementSpeed
          );

          vec4 wColor = mix(
            texture2D(
              waterImage,
              (uvCoord * waterScale + (length(disp.rgb) / 1.732) * displacementHeight) + time * waterSpeed
            ),
            vec4(waterColorTint, 1.0),
            waterAmt
          );

          vec4 specBase = (
            texture2D(specularMap, uvCoord * specularScale + time * specularSpeed) *
            texture2D(specularMap, uvCoord * specularScale - time * specularSpeed)
          );

          vec4 spec = specBase;
          float len = length(specBase.rgb);
          if (len > specularMax && len < specularPop) {
            spec *= 0.0;
          }

          float specNoiseDarken = (length(
            texture2D(specularMap, uvCoord * 0.25 - time * specularSpeed * 0.5).rgb
          ) / 1.732) * 3.0 - 1.0;
          specNoiseDarken = clamp(specNoiseDarken, 0.0, 1.0);

          spec *= specularBrightness;

          return vec4(wColor.rgb + spec.rgb * specNoiseDarken, 1.0);
        }

        vec3 getOceanWaveColor(float h) {
          float mask = (pow(h, 2.0) - offset) * contrast;
          vec3 diff = mix(waveColor, waterHighlight, mask);
          diff *= brightness;
          return diff;
        }

        vec4 getCartoonOceanComposite(vec2 uvCoord, float h) {
          vec4 tex = getCartoonWater(uvCoord);
          vec3 crestCol = getOceanWaveColor(h);
          return vec4(
            mix(
              crestCol * tex.rgb,
              crestCol,
              1.0 - clamp(h * 50.0, 0.0, 1.0)
            ),
            1.0
          );
        }
        `
      );

      shader.fragmentShader = shader.fragmentShader.replace(
        '#include <map_fragment>',
        `#include <map_fragment>
        vec4 oceanAlbedo = getCartoonOceanComposite(vUv, vOceanHeight);
        diffuseColor = oceanAlbedo;
        `
      );
    };

    // -------------------------------------------------------------
    // 5. Geometries (Cube Diorama & Flat Plane)
    // -------------------------------------------------------------
    const cubeGeo = new THREE.BoxGeometry(2.0, 0.8, 2.0, 128, 10, 128);
    const planeGeo = new THREE.PlaneGeometry(6.0, 6.0, 200, 200);
    planeGeo.rotateX(-Math.PI / 2);

    let oceanMesh = new THREE.Mesh(cubeGeo, oceanMaterial);
    oceanMesh.position.y = 0;
    scene.add(oceanMesh);

    const grid = new THREE.GridHelper(10, 20, 0x64748b, 0x334155);
    grid.position.y = -0.5;
    scene.add(grid);

    // -------------------------------------------------------------
    // 6. UI Binding
    // -------------------------------------------------------------
    const el = id => document.getElementById(id);
    const bindSlider = (id, targetVal, formatFn = v => v.toFixed(2)) => {
      const input = el('p-' + id);
      const span = el('v-' + id);
      input.oninput = (e) => {
        const val = parseFloat(e.target.value);
        targetVal.value = val;
        if (span) span.textContent = formatFn(val);
      };
    };

    bindSlider('waveHeight', oceanUniforms.waveHeight);
    bindSlider('waveSpeed', oceanUniforms.waveSpeed);
    bindSlider('waveFrequency', oceanUniforms.waveFrequency);
    bindSlider('waveSharpness', oceanUniforms.waveSharpness);
    bindSlider('contrast', oceanUniforms.contrast, v => v.toFixed(1));
    bindSlider('brightness', oceanUniforms.brightness);
    bindSlider('offset', oceanUniforms.offset);
    bindSlider('specularPop', oceanUniforms.specularPop);
    bindSlider('specularBrightness', oceanUniforms.specularBrightness, v => v.toFixed(1));
    bindSlider('dispHeight', oceanUniforms.displacementHeight);

    el('p-waterColor').oninput = e => {
      oceanUniforms.waveColor.value.set(e.target.value);
      oceanUniforms.waterColorTint.value.set(e.target.value);
    };
    el('p-waterHighlight').oninput = e => {
      oceanUniforms.waterHighlight.value.set(e.target.value);
    };

    el('p-roughness').oninput = e => {
      const v = parseFloat(e.target.value);
      oceanMaterial.roughness = v;
      el('v-roughness').textContent = v.toFixed(2);
    };
    el('p-metalness').oninput = e => {
      const v = parseFloat(e.target.value);
      oceanMaterial.metalness = v;
      el('v-metalness').textContent = v.toFixed(2);
    };
    el('p-wireframe').onchange = e => {
      oceanMaterial.wireframe = e.target.checked;
    };

    el('mesh-type').onchange = (e) => {
      scene.remove(oceanMesh);
      if (e.target.value === 'cube') {
        oceanMesh = new THREE.Mesh(cubeGeo, oceanMaterial);
        oceanUniforms.uIsCube.value = 1.0;
        camera.position.set(2.8, 2.4, 3.2);
        grid.position.y = -0.5;
      } else {
        oceanMesh = new THREE.Mesh(planeGeo, oceanMaterial);
        oceanUniforms.uIsCube.value = 0.0;
        camera.position.set(0, 4.0, 5.0);
        grid.position.y = -1.2;
      }
      scene.add(oceanMesh);
    };

    el('btn-reset').onclick = () => {
      oceanUniforms.waveHeight.value = 0.848;
      oceanUniforms.waveSpeed.value = 0.408;
      oceanUniforms.waveFrequency.value = 0.625;
      oceanUniforms.waveSharpness.value = 0.744;
      oceanUniforms.contrast.value = 21.739;
      oceanUniforms.brightness.value = 1.535;
      oceanUniforms.offset.value = 0.042;
      oceanUniforms.specularPop.value = 0.782;
      oceanUniforms.specularBrightness.value = 2.0;
      oceanUniforms.displacementHeight.value = 0.21;
      oceanUniforms.waveColor.value.set('#00aaff');
      oceanUniforms.waterColorTint.value.set('#00aaff');
      oceanUniforms.waterHighlight.value.set('#ffffff');
      oceanMaterial.roughness = 0.0;
      oceanMaterial.metalness = 0.24;
      oceanMaterial.wireframe = false;

      el('p-waveHeight').value = 0.848; el('v-waveHeight').textContent = '0.85';
      el('p-waveSpeed').value = 0.408; el('v-waveSpeed').textContent = '0.41';
      el('p-waveFrequency').value = 0.625; el('v-waveFrequency').textContent = '0.63';
      el('p-waveSharpness').value = 0.744; el('v-waveSharpness').textContent = '0.74';
      el('p-contrast').value = 21.739; el('v-contrast').textContent = '21.7';
      el('p-brightness').value = 1.535; el('v-brightness').textContent = '1.54';
      el('p-offset').value = 0.042; el('v-offset').textContent = '0.04';
      el('p-specularPop').value = 0.782; el('v-specularPop').textContent = '0.78';
      el('p-specularBrightness').value = 2.0; el('v-specularBrightness').textContent = '2.0';
      el('p-dispHeight').value = 0.21; el('v-dispHeight').textContent = '0.21';
      el('p-waterColor').value = '#00aaff';
      el('p-waterHighlight').value = '#ffffff';
      el('p-roughness').value = 0.0; el('v-roughness').textContent = '0.0';
      el('p-metalness').value = 0.24; el('v-metalness').textContent = '0.24';
      el('p-wireframe').checked = false;
    };

    // -------------------------------------------------------------
    // 7. Animation Loop & Resize
    // -------------------------------------------------------------
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      oceanUniforms.time.value = elapsed;
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
