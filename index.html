<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ghibli Flight</title>
  <meta name="description" content="High-performance procedural flight simulator with rich biomes, dynamic terrain, vegetation, volumetric clouds, and sun god rays." />
  <meta property="og:title" content="Ghibli Flight" />
  <meta property="og:description" content="High-performance procedural flight simulator with rich biomes, dynamic terrain, vegetation, volumetric clouds, and sun god rays." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Dancing+Script:wght@600;700&family=Satisfy&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #62b1e8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      touch-action: none;
      user-select: none;
    }
    #app { position: fixed; inset: 0; touch-action: none; }
    canvas { display: block; touch-action: none; }

    #touch-controls {
      position: fixed; inset: 0; z-index: 20; pointer-events: none;
    }

    #joystick-base {
      position: absolute; left: 40px; bottom: 40px;
      width: 100px; height: 100px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
      pointer-events: auto;
    }

    #joystick-knob {
      position: absolute; left: 50%; top: 50%;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    #boost-btn {
      position: fixed; right: 20px; bottom: 25px;
      width: 75px; height: 75px; border-radius: 50%;
      color: white; font-weight: bold; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      user-select: none; pointer-events: auto;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      background: rgba(59, 130, 246, 0.75); border: 2px solid rgba(96, 165, 250, 0.9);
      transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 20;
    }

    #world-map {
      position: fixed; left: 14px; bottom: 14px; z-index: 15;
      padding: 5px 5px 3px; border-radius: 10px;
      background: #efe4c8; box-shadow: 0 2px 8px rgba(40, 30, 10, 0.28);
      opacity: 0.82; transition: opacity 0.2s;
    }
    #world-map:hover, #world-map.map-open { opacity: 1; }
    #world-map.map-open {
      left: 50%; bottom: 50%; transform: translate(-50%, 50%);
      z-index: 40; padding: 8px 8px 5px;
      box-shadow: 0 10px 40px rgba(40, 30, 10, 0.45);
    }
    #map-frame { position: relative; }
    #map-toggle-btn {
      position: absolute; top: 4px; right: 4px; z-index: 2;
      width: 22px; height: 22px; padding: 0;
      background: rgba(0,0,0,0.38); border: none; border-radius: 5px;
      color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.15s;
    }
    #map-frame:hover #map-toggle-btn,
    #world-map.map-open #map-toggle-btn { opacity: 1; }
    #world-map.map-open #map-toggle-btn { top: 6px; right: 6px; width: 26px; height: 26px; background: rgba(0,0,0,0.5); }
    #map-canvas {
      display: block; width: 150px; height: 150px;
      border-radius: 50%; cursor: pointer;
    }
    #world-map.map-open #map-canvas {
      width: min(460px, 82vw, 76vh); height: min(460px, 82vw, 76vh);
      border-radius: 10px; cursor: crosshair;
    }
    #world-map.map-compass {
      background: none; box-shadow: none; padding: 0;
      overflow: visible;
    }
    #world-map.map-compass #map-frame { display: none; }
    #world-map.map-compass #map-place { display: none; }
    #world-map.map-compass #bottom-left-hud {
      pointer-events: auto; cursor: pointer;
    }
    #world-map.map-compass #bottom-location {
      color: #fffef7; text-shadow: 0 2px 5px rgba(0,0,0,0.8), 0 0 12px rgba(0,0,0,0.5);
    }
    #world-map.map-compass #fps-counter {
      color: rgba(255,255,255,0.9); text-shadow: 0 1px 4px rgba(0,0,0,0.8), 0 0 8px rgba(0,0,0,0.4);
    }
    #map-place {
      font: italic 600 11px Georgia, 'Times New Roman', serif; color: #5b4a30;
      text-align: center; margin-top: 2px; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; max-width: 150px;
    }
    #world-map.map-open #map-place { display: block; max-width: none; font-size: 13px; }
    #map-tooltip {
      position: absolute; display: none; pointer-events: none;
      transform: translate(-50%, -135%); white-space: nowrap;
      background: #fbf6e8; color: #4a3b24; border-radius: 5px; padding: 3px 7px;
      font: 600 12px Georgia, 'Times New Roman', serif;
      box-shadow: 0 2px 6px rgba(40, 30, 10, 0.3);
    }
    @media (max-width: 768px) {
      #map-canvas { width: 110px; height: 110px; }
      #map-place { display: none; }
    }

    #ui-stack {
      position: fixed; right: 16px; top: 16px;
      z-index: 10; pointer-events: auto;
      display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
    }
    #ui-stack button {
      color: rgba(60, 50, 70, 0.9); background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(8px); padding: 8px 14px;
      border-radius: 8px; font-size: 13px; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.4); font-weight: bold; width: fit-content;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    #ui-stack button:hover {
      background: rgba(255, 255, 255, 0.85);
    }


    @media (hover: hover) and (pointer: fine) {
      #touch-controls { display: none; }
    }

    /* ── Wanderlust-II top-bar ──────────────────────────────────────────── */
    #top-bar {
      position: fixed; top: 14px; left: 16px; right: 16px;
      display: flex; align-items: center; justify-content: space-between;
      z-index: 10; pointer-events: none;
      gap: 10px;
    }
    #top-bar > * { pointer-events: auto; }
    .top-bar-left {
      display: flex; align-items: center; gap: 10px; pointer-events: none; flex-shrink: 0;
    }
    .top-bar-left > * { pointer-events: auto; }
    .top-bar-right {
      display: flex; align-items: center; gap: 10px; pointer-events: none;
    }
    .top-bar-right > * { pointer-events: auto; }
    .top-action-buttons {
      display: flex; align-items: center; gap: 4px; pointer-events: auto;
      background: rgba(15, 20, 28, 0.55); backdrop-filter: blur(6px);
      border-radius: 10px; padding: 3px 6px;
    }
    /* ── Bottom-Left HUD (inside compass widget) ───────── */
    #bottom-left-hud {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      user-select: none;
      margin-top: 2px;
    }
    #bottom-left-hud-text {
      display: flex; flex-direction: column; align-items: flex-start;
    }
    #hud-map-icon {
      width: 28px; height: 28px; pointer-events: auto; cursor: pointer;
      opacity: 0.85; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.5));
      transition: opacity 0.2s;
    }
    #hud-map-icon:hover { opacity: 1; }
    #bottom-location {
      font-family: 'Dancing Script', 'Satisfy', 'Caveat', 'Brush Script MT', 'Segoe Script', cursive, Georgia, serif;
      font-size: 18px;
      font-weight: 700;
      color: #5b4a30;
      letter-spacing: 0.4px;
      line-height: 1.15;
      pointer-events: none;
      white-space: nowrap;
    }
    #fps-counter {
      color: #8a7a5e;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.3px;
      user-select: none;
      pointer-events: none;
      white-space: nowrap;
    }
    #world-map.map-open #bottom-left-hud { display: none; }
    #world-map.map-no-compass { background: none; box-shadow: none; padding: 0; }
    #world-map.map-no-compass #bottom-location {
      color: #fffef7; text-shadow: 0 2px 5px rgba(0,0,0,0.8), 0 0 12px rgba(0,0,0,0.5);
    }
    #world-map.map-no-compass #fps-counter {
      color: rgba(255,255,255,0.9); text-shadow: 0 1px 4px rgba(0,0,0,0.8), 0 0 8px rgba(0,0,0,0.4);
    }
    #top-model-select, #top-biome-select {
      background: transparent; border: none;
      padding: 2px 4px; color: rgba(255,255,255,0.92);
      font-family: -apple-system, BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      font-size: 12px; font-weight: 600; box-shadow: none;
      cursor: pointer; outline: none; transition: color 0.2s ease; max-width: 140px;
      -webkit-appearance: none; appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='rgba(255,255,255,0.5)' fill='none' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat; background-position: right 2px center; padding-right: 16px;
    }
    #top-model-select:hover, #top-biome-select:hover { color: #38bdf8; }
    #top-model-select option, #top-biome-select option { background: #0f141c; color: #fff; font-size: 12px; }
    .top-bar-divider {
      width: 1px; height: 18px; background: rgba(255,255,255,0.15); flex-shrink: 0;
    }
    .top-save-container {
      display: flex; align-items: center; gap: 6px; pointer-events: auto;
    }
    #top-bar #top-save-setting-btn,
    #top-bar #top-save-all-btn {
      display: inline-flex; align-items: center; justify-content: center;
      background: rgba(15, 20, 28, 0.94); border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px; padding: 4px 10px; color: rgba(255, 255, 255, 0.92);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px; font-weight: 600; letter-spacing: 0.4px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35); cursor: pointer; pointer-events: auto;
      user-select: none; transition: all 0.2s ease; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      line-height: 1; white-space: nowrap;
    }
    #top-bar #top-save-setting-btn:hover,
    #top-bar #top-save-all-btn:hover {
      background: rgba(30, 41, 59, 0.95); border-color: rgba(56, 189, 248, 0.5);
      color: #38bdf8; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    }
    #top-bar #top-save-setting-btn:active,
    #top-bar #top-save-all-btn:active {
      transform: translateY(0px) scale(0.96); background: rgba(15, 20, 28, 0.98);
    }
    .save-gui-menu.lil-gui.root {
      position: fixed !important; top: 58px !important; left: 16px !important; right: auto !important;
      max-width: min(280px, 92vw) !important; width: 250px !important;
      max-height: calc(100vh - 78px) !important; overflow-y: auto !important;
      border-radius: 12px !important; background: rgba(15, 20, 28, 0.96) !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6) !important;
      z-index: 95 !important; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
    }
    #top-bar button {
      background: none; border: none; color: rgba(255,255,255,0.95); cursor: pointer;
      font-size: 19px; padding: 4px; line-height: 1;
      display: inline-flex; align-items: center; justify-content: center;
      text-shadow: 0 1px 3px rgba(0,0,0,0.35); transition: transform 0.15s ease, opacity 0.15s ease, color 0.15s ease;
      user-select: none; outline: none; -webkit-tap-highlight-color: transparent;
    }
    #top-bar button:hover { opacity: 1; transform: scale(1.08); }
    #top-bar button:active { transform: scale(0.88); opacity: 0.7; }
    .lil-gui.root {
      position: fixed !important; top: 58px !important; right: 20px !important; left: auto !important;
      max-width: min(360px, 92vw) !important; max-height: calc(100vh - 78px) !important; overflow-y: auto !important;
      border-radius: 12px !important; background: rgba(15,20,28,0.96) !important;
      border: 1px solid rgba(255,255,255,0.15) !important; box-shadow: 0 16px 40px rgba(0,0,0,0.6) !important;
      z-index: 95 !important; font-family: -apple-system, BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif !important;
      /* Larger, touch-friendlier controls */
      --font-size: 14px;
      --input-font-size: 14px;
      --widget-height: 28px;
      --title-height: 36px;
      --padding: 5px;
      --spacing: 5px;
      --folder-indent: 10px;
      width: 320px !important;
    }
    /* Mobile */
    @media (max-width: 768px), (orientation: portrait) {
      #top-bar { left:10px; right:10px; top:10px; flex-direction:column; align-items:stretch; gap:6px; }
      .top-bar-left { display:flex; align-items:center; }
      .top-bar-right { width:100%; display:flex; justify-content:space-between; align-items:center; }
      .top-action-buttons { gap:4px; }
      #top-bar #top-save-setting-btn,
      #top-bar #top-save-all-btn { font-size:10px !important; padding:3px 5px !important; }
      #bottom-left-hud { left: 88px; bottom: 12px; gap: 1px; }
      #bottom-location { font-size: 22px !important; }
      #fps-counter { font-size: 11px !important; }
      #top-model-select, #top-biome-select { font-size:10px !important; padding:2px 14px 2px 2px !important; max-width:90px; }
      #top-bar button { padding:2px !important; }
    }
  </style>
</head>
<body>
<div id="debug-overlay" style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; background: #b91c1c; color: #ffffff; padding: 16px 24px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-width: 90%; display: none;"></div>
<script>
function showError(msg) {
    var overlay = document.getElementById('debug-overlay');
    overlay.style.display = 'block';
    overlay.innerHTML += msg + '<br><br>';
}
window.onerror = function(msg, url, line, col, error) {
    showError('Error: ' + msg + ' at line ' + line);
};
window.addEventListener("unhandledrejection", function(event) {
    showError('Unhandled Promise Rejection: ' + (event.reason ? event.reason.message || event.reason : "unknown"));
});
const origConsoleError = console.error;
console.error = function(...args) {
    showError('Console Error: ' + args.join(' '));
    origConsoleError.apply(console, args);
};
</script>

  <script type="module">
import terrainArch from './terrain-archipelago.js';
import terrainGhibli from './terrain-ghibli.js';
import terrainMtn from './terrain-mountains.js';
import terrainCrystal from './terrain-crystal.js';
import terrainMtn2 from './terrain-mountains2.js';
import { WorldLayout, BIOME_CATALOG } from './world-layout.js';

    import * as THREE from 'three';

    // ===== QUALITY TIER =====
    // 'low' targets weak devices (e.g. Galaxy Tab S6 Lite for a young kid).
    // Auto-defaults to low on ≤4GB devices; user choice (saved) always wins.
    // Regular is the untouched full-quality path.
    const _savedGfx = localStorage.getItem('gfxQuality');
    const LOW_GFX = _savedGfx === 'low'
        || (_savedGfx == null && typeof navigator.deviceMemory === 'number' && navigator.deviceMemory <= 4);

    let isWindOn = false;
    let isRainOn = false;
    let isWindTrailsOn = true;
    let isPhotoMode = false;
    let isFlightPaused = false;
    let isShadowsOn = !LOW_GFX;
    let isTreeShadowsOn = false;
    let shadowDistMode = LOW_GFX ? 'Close' : 'Med';
    let isBloomOn = !LOW_GFX;
    let isHD = !LOW_GFX;
    let photoControls = null;
    let cameraZoomDist = 12.0;
    let currentFrame = 0;
    let logicTimer = 0;
    let terrainRes = LOW_GFX ? 128 : 256;
    const TERRAIN_SIZE = 3200; // ground patch that follows the player (12.5m vertex spacing at 256)
let isInitializingGui = true;

            // PROCEDURAL NOISE & MULTI-BIOMES SETUP
    // ==========================================
    // Simplex needs the table twice in a row (perm[i + 256] === perm[i]); independent values in the
    // second half made the noise jump at lattice wraps — the source of cliff walls and saw-tooth edges.
    const perm = new Uint8Array(512);
    for (let i = 0; i < 256; i++) perm[i] = Math.floor(Math.random() * 256);
    for (let i = 0; i < 256; i++) perm[i + 256] = perm[i];

    function snoise(x, z) {
        let n0, n1, n2;
        const F2 = 0.5 * (Math.sqrt(3.0) - 1.0);
        const G2 = (3.0 - Math.sqrt(3.0)) / 6.0;
        let s = (x + z) * F2;
        let i = Math.floor(x + s), j = Math.floor(z + s);
        let t = (i + j) * G2;
        let X0 = i - t, Z0 = j - t;
        let x0 = x - X0, z0 = z - Z0;
        let i1, j1;
        if (x0 > z0) { i1 = 1; j1 = 0; } else { i1 = 0; j1 = 1; }
        let x1 = x0 - i1 + G2, z1 = z0 - j1 + G2;
        let x2 = x0 - 1.0 + 2.0 * G2, z2 = z0 - 1.0 + 2.0 * G2;
        let ii = i & 255, jj = j & 255;
        let gi0 = perm[ii + perm[jj]] % 12;
        let gi1 = perm[ii + i1 + perm[jj + j1]] % 12;
        let gi2 = perm[ii + 1 + perm[jj + 1]] % 12;
        let t0 = 0.5 - x0 * x0 - z0 * z0; if (t0 < 0) n0 = 0.0; else { t0 *= t0; n0 = t0 * t0 * (x0 * (gi0 > 5 ? 1 : -1) + z0 * (gi0 % 2 === 0 ? 1 : -1)); }
        let t1 = 0.5 - x1 * x1 - z1 * z1; if (t1 < 0) n1 = 0.0; else { t1 *= t1; n1 = t1 * t1 * (x1 * (gi1 > 5 ? 1 : -1) + z1 * (gi1 % 2 === 0 ? 1 : -1)); }
        let t2 = 0.5 - x2 * x2 - z2 * z2; if (t2 < 0) n2 = 0.0; else { t2 *= t2; n2 = t2 * t2 * (x2 * (gi2 > 5 ? 1 : -1) + z2 * (gi2 % 2 === 0 ? 1 : -1)); }
        return 70.0 * (n0 + n1 + n2);
    }


    // ==========================================
    // 2. PROCEDURAL 2D WORLD LAYOUT & SPATIAL ENGINE
    // ==========================================
    let currentWorldSeed = 482731;
    let worldLayout = new WorldLayout(currentWorldSeed);
    let showDebugMapOverlay = false;

    const blendColor1 = new THREE.Color();
    const blendColor2 = new THREE.Color();

    function getWorldHeight(worldX, worldZ) {
        return worldLayout.getHeight(worldX, worldZ, snoise);
    }

    function getWorldColor(h, worldX, worldZ, targetColor) {
        worldLayout.getColor(h, worldX, worldZ, snoise, targetColor, blendColor1, blendColor2);
    }

    function getBiomeAt(worldX, worldZ) {
        return worldLayout.getBiomeAt(worldX, worldZ, snoise);
    }

    function isTreeZone(worldX, worldZ) {
        const b = getBiomeAt(worldX, worldZ);
        if (!b || !b.treesOk) return false;
        if (b.id === 'crystal_land' || b.id === 'magical_sanctuary' ||
            (b.name && (b.name.includes('Crystal') || b.name.includes('Sanctuary') || b.name.includes('Misty')))) {
            return false;
        }
        return true;
    }

    // 2D World Map Canvas & Interactive Teleportation
    let _mapEl = null;
    let _mapCanvas = null;
    let _mapCtx = null;
    let _mapTooltip = null;
    let _bgMapCanvas = null;
    let _lastMapDrawTime = 0;
    let _hoverMapPos = null;
    let _mapOpen = false;

    function _setMapOpen(open) {
        _mapOpen = open;
        if (!_mapEl) return;
        _mapEl.classList.toggle('map-open', open);
        _mapEl.classList.toggle('map-compass', !open);
        _hoverMapPos = null;
        if (_mapTooltip) _mapTooltip.style.display = 'none';
        _drawWorldMap(true);
        const icon = document.getElementById('map-toggle-icon');
        const btn  = document.getElementById('map-toggle-btn');
        if (btn) btn.title = open ? 'Minimize map' : 'Expand map';
        if (icon) icon.innerHTML = open
            ? '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>'
            : '<polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>';
    }

    function initMapUI() {
        _mapEl = document.getElementById('world-map');
        _mapCanvas = document.getElementById('map-canvas');
        _mapTooltip = document.getElementById('map-tooltip');

        if (_mapEl) _mapEl.classList.add('map-compass');

        const _mapToggleBtn = document.getElementById('map-toggle-btn');
        if (_mapToggleBtn) {
            _mapToggleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                _setMapOpen(!_mapOpen);
            });
        }

        const _bottomHud = document.getElementById('bottom-left-hud');
        if (_bottomHud) {
            _bottomHud.addEventListener('click', (e) => {
                if (!_mapOpen) { e.stopPropagation(); _setMapOpen(true); }
            });
        }
        const _hudMapIcon = document.getElementById('hud-map-icon');
        if (_hudMapIcon) {
            _hudMapIcon.addEventListener('click', (e) => {
                e.stopPropagation(); _setMapOpen(!_mapOpen);
            });
        }

        if (_mapCanvas) {
            _mapCtx = _mapCanvas.getContext('2d');

            _mapCanvas.addEventListener('mousemove', (e) => {
                if (!_mapOpen) return;
                const rect = _mapCanvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                _hoverMapPos = { x: mouseX, y: mouseY };

                const view = _mapView();
                const targetX = view.cx + ((mouseX / rect.width) - 0.5) * 2.0 * view.half;
                const targetZ = view.cz + ((mouseY / rect.height) - 0.5) * 2.0 * view.half;

                const b = getBiomeAt(targetX, targetZ);
                const isNearCapyHaven = Math.hypot(targetX - (-1200), targetZ - (-800)) < 400;
                let distKm = 0;
                if (typeof playerGrp !== 'undefined') {
                    const dx = targetX - playerGrp.position.x;
                    const dz = targetZ - playerGrp.position.z;
                    distKm = (Math.sqrt(dx * dx + dz * dz) / 1000).toFixed(1);
                }

                if (_mapTooltip) {
                    _mapTooltip.style.display = 'block';
                    _mapTooltip.style.left = `${mouseX}px`;
                    _mapTooltip.style.top = `${mouseY}px`;
                    const place = isNearCapyHaven ? 'Capybara Haven' : (b && !b.isOcean ? _mapName(b) : 'Open sea');
                    _mapTooltip.textContent = `${place} · ${distKm} km`;
                }
            });

            _mapCanvas.addEventListener('mouseleave', () => {
                _hoverMapPos = null;
                if (_mapTooltip) _mapTooltip.style.display = 'none';
            });

            _mapCanvas.addEventListener('click', (e) => {
                e.stopPropagation();
                if (!_mapOpen) { _setMapOpen(true); return; }
                const rect = _mapCanvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                const view = _mapView();
                const targetX = view.cx + ((mouseX / rect.width) - 0.5) * 2.0 * view.half;
                const targetZ = view.cz + ((mouseY / rect.height) - 0.5) * 2.0 * view.half;

                if (typeof playerGrp !== 'undefined') {
                    const targetGroundY = getWorldHeight(targetX, targetZ);
                    const targetAlt = Math.max(90, targetGroundY + 55);
                    playerGrp.position.set(targetX, targetAlt, targetZ);

                    if (typeof lastTerrainGridX !== 'undefined') lastTerrainGridX = -9999;
                    if (typeof lastTerrainGridZ !== 'undefined') lastTerrainGridZ = -9999;

                    const curB = getBiomeAt(targetX, targetZ);
                    if (typeof navParams !== 'undefined' && typeof navFolder !== 'undefined' && curB) {
                        navParams.biome = curB.name;
                        navFolder.controllersRecursive().forEach(c => c.updateDisplay());
                    }
                }
                _setMapOpen(false);
            });
        }

        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === 'm' || e.key === 'M') _setMapOpen(!_mapOpen);
            else if (e.key === 'Escape' && _mapOpen) _setMapOpen(false);
        });
        document.addEventListener('click', (e) => {
            if (_mapOpen && _mapEl && !_mapEl.contains(e.target)) _setMapOpen(false);
        });
    }
    initMapUI();

    // Procedural Island Contour Generator (evaluates noise warping along polar perimeter)
    function _getIslandContourPoints(isl, toMapX, toMapY, scaleRatio = 1.0, numPoints = 48) {
        const points = [];
        const cosR = Math.cos(isl.rotation);
        const sinR = Math.sin(isl.rotation);

        for (let i = 0; i < numPoints; i++) {
            const th = (i / numPoints) * Math.PI * 2;
            const elx = Math.cos(th) * isl.radiusX * scaleRatio;
            const elz = Math.sin(th) * isl.radiusZ * scaleRatio;

            const wx = isl.centerX + (elx * cosR - elz * sinR);
            const wz = isl.centerZ + (elx * sinR + elz * cosR);

            // Sample domain warp to match 3D coastline
            const seedOff = isl.noiseSeed;
            const warp1 = snoise(wx * 0.00045 + seedOff, wz * 0.00045 + seedOff) * 0.22;
            const warp2 = snoise(wx * 0.0012 - seedOff, wz * 0.0012 + seedOff) * 0.10;
            const coastNoise = snoise(wx * 0.0035 + seedOff * 2, wz * 0.0035 - seedOff * 2) * 0.05;
            const warpFactor = Math.max(0.60, 1.0 - (warp1 + warp2 + coastNoise));

            const warpedWx = isl.centerX + (elx * warpFactor * cosR - elz * warpFactor * sinR);
            const warpedWz = isl.centerZ + (elx * warpFactor * sinR + elz * warpFactor * cosR);

            points.push({
                x: toMapX(warpedWx),
                y: toMapY(warpedWz)
            });
        }
        return points;
    }

    function _drawPolygonPath(ctx, points) {
        if (!points || points.length === 0) return;
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
            ctx.lineTo(points[i].x, points[i].y);
        }
        ctx.closePath();
    }

    // Square map window fitted around all islands (instead of the whole mostly-empty world)
    let _mapViewCache = null, _mapViewIslands = null;
    function _mapView() {
        if (_mapViewIslands === worldLayout.islands && _mapViewCache) return _mapViewCache;
        let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
        for (const isl of worldLayout.islands) {
            const r = isl.maxRadius * 1.25;
            minX = Math.min(minX, isl.centerX - r); maxX = Math.max(maxX, isl.centerX + r);
            minZ = Math.min(minZ, isl.centerZ - r); maxZ = Math.max(maxZ, isl.centerZ + r);
        }
        _mapViewIslands = worldLayout.islands;
        _mapViewCache = { cx: (minX + maxX) / 2, cz: (minZ + maxZ) / 2, half: Math.max(maxX - minX, maxZ - minZ) / 2 * 1.05 };
        _bgMapCanvas = null; // new layout: repaint the islands
        return _mapViewCache;
    }

    const _mapName = (biome) => biome.name.replace(/^[^A-Za-z]+/, ''); // drop the emoji

    // Soft painted palette per biome: [land, highland]
    const _MAP_PAINT = {
        ghibli_land: ['#9cc57a', '#7fae5f'],
        ghibli_isles: ['#9cc57a', '#7fae5f'],
        archipelago: ['#bcd48e', '#9dbd70'],
        misty_mountains: ['#b3ae9f', '#97917f'],
        misty_mountains_2: ['#b3ae9f', '#97917f'],
        crystal_land: ['#a9cdd6', '#88b5c2'],
        magical_sanctuary: ['#c9b1cf', '#ad91b6'],
        mycelium_forest: ['#b388eb', '#805ad5'],
        sakura_realm: ['#f472b6', '#db2777'],
        lotus_grove: ['#5eead4', '#14b8a6'],
    };

    function _renderStaticMapBackground(W, H) {
        if (!_bgMapCanvas) {
            _bgMapCanvas = document.createElement('canvas');
        }
        _bgMapCanvas.width = W;
        _bgMapCanvas.height = H;
        const bgCtx = _bgMapCanvas.getContext('2d');
        if (!bgCtx) return;
        const k = W / 150; // line/label scale relative to the small map

        // Sea
        bgCtx.fillStyle = '#a9ccd3';
        bgCtx.fillRect(0, 0, W, H);

        const view = _mapView();
        const toMapX = (wx) => ((wx - view.cx) / (view.half * 2.0) + 0.5) * W;
        const toMapY = (wz) => ((wz - view.cz) / (view.half * 2.0) + 0.5) * H;

        // Islands: small ones first so the big ones sit on top
        const sortedIslands = [...worldLayout.islands].sort((a, b) => (a.isMajor ? 1 : 0) - (b.isMajor ? 1 : 0));
        sortedIslands.forEach(isl => {
            const [land, high] = _MAP_PAINT[isl.biomeId] || ['#b8cc92', '#9ab575'];
            const shorePts = _getIslandContourPoints(isl, toMapX, toMapY, 1.0, 36);
            _drawPolygonPath(bgCtx, shorePts);
            bgCtx.fillStyle = land;
            bgCtx.fill();
            bgCtx.strokeStyle = '#e6dcb8'; // pale sandy shoreline
            bgCtx.lineWidth = Math.max(0.8, 1.1 * k);
            bgCtx.stroke();

            if (isl.isMajor) {
                const ridgePts = _getIslandContourPoints(isl, toMapX, toMapY, 0.5, 28);
                _drawPolygonPath(bgCtx, ridgePts);
                bgCtx.fillStyle = high;
                bgCtx.fill();
            }
        });

        // Names only on the big map
        if (W < 300) return;
        bgCtx.textAlign = 'center';
        bgCtx.textBaseline = 'middle';
        bgCtx.font = `italic 600 ${Math.round(13 * k / 2.4)}px Georgia, 'Times New Roman', serif`;
        bgCtx.lineJoin = 'round';
        worldLayout.islands.filter(isl => isl.isMajor).forEach(isl => {
            const name = _mapName(isl.biome);
            const mx = toMapX(isl.centerX);
            const my = toMapY(isl.centerZ);
            bgCtx.strokeStyle = 'rgba(245, 238, 218, 0.85)';
            bgCtx.lineWidth = 3 * k / 2.4;
            bgCtx.strokeText(name, mx, my);
            bgCtx.fillStyle = '#4a3b24';
            bgCtx.fillText(name, mx, my);
        });
    }

    function _drawCompass() {
        if (!_mapCanvas) _mapCanvas = document.getElementById('map-canvas');
        if (_mapCanvas && !_mapCtx) _mapCtx = _mapCanvas.getContext('2d');
        if (!_mapCanvas || !_mapCtx) return;
        const rect = _mapCanvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const wantW = Math.max(1, Math.round(rect.width * dpr));
        const wantH = Math.max(1, Math.round(rect.height * dpr));
        if (_mapCanvas.width !== wantW || _mapCanvas.height !== wantH) { _mapCanvas.width = wantW; _mapCanvas.height = wantH; }
        const W = _mapCanvas.width, H = _mapCanvas.height;
        const cx = W / 2, cy = H / 2, r = Math.min(cx, cy) * 0.96;
        const yaw = typeof currentYaw !== 'undefined' ? currentYaw : 0;
        const ctx = _mapCtx;
        ctx.clearRect(0, 0, W, H);

        // Background — parchment circle matching the map panel
        ctx.save();
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
        const bg = ctx.createRadialGradient(cx, cy * 0.8, 0, cx, cy, r);
        bg.addColorStop(0, 'rgba(248, 240, 220, 0.98)');
        bg.addColorStop(1, 'rgba(220, 205, 175, 0.99)');
        ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
        ctx.restore();

        // Outer ring
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(91, 74, 48, 0.35)';
        ctx.lineWidth = 1.5 * dpr; ctx.stroke();

        // Rotating rose
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(-yaw);

        // Inner tick ring
        ctx.beginPath(); ctx.arc(0, 0, r * 0.68, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(91, 74, 48, 0.12)'; ctx.lineWidth = dpr; ctx.stroke();

        for (let i = 0; i < 32; i++) {
            const angle = (i / 32) * Math.PI * 2;
            const isCard = i % 8 === 0, isOrd = i % 4 === 0 && !isCard;
            const outerR = r * 0.93;
            const tickLen = isCard ? r * 0.22 : (isOrd ? r * 0.13 : r * 0.07);
            ctx.save();
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.moveTo(0, -outerR); ctx.lineTo(0, -(outerR - tickLen));
            ctx.strokeStyle = (isCard && i === 0) ? 'rgba(180, 40, 30, 0.9)' : (isCard ? 'rgba(91, 74, 48, 0.75)' : 'rgba(91, 74, 48, 0.28)');
            ctx.lineWidth = (isCard ? 2 : (isOrd ? 1.2 : 0.7)) * dpr;
            ctx.stroke();
            if (isCard) {
                const labels = ['N','E','S','W'];
                ctx.fillStyle = i === 0 ? '#b52020' : 'rgba(74, 58, 36, 0.9)';
                ctx.font = `bold ${Math.round(r * 0.2)}px -apple-system,BlinkMacSystemFont,sans-serif`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(labels[i / 8], 0, -(outerR - r * 0.36));
            }
            ctx.restore();
        }
        ctx.restore();

        // Fixed heading triangle at 12-o'clock (warm gold/brown)
        const triY = -(r * 0.87);
        ctx.save(); ctx.translate(cx, cy);
        ctx.beginPath();
        ctx.moveTo(0, triY - 5 * dpr);
        ctx.lineTo(5 * dpr, triY + 5 * dpr);
        ctx.lineTo(-5 * dpr, triY + 5 * dpr);
        ctx.closePath();
        ctx.fillStyle = 'rgba(180, 120, 20, 0.95)'; ctx.fill();
        ctx.restore();

        // Center cap
        ctx.save(); ctx.translate(cx, cy);
        ctx.beginPath(); ctx.arc(0, 0, 4 * dpr, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(91, 74, 48, 0.6)'; ctx.fill();
        ctx.restore();
    }

    function _drawWorldMap(force) {
        const now = performance.now();
        if (!force && now - _lastMapDrawTime < 66) return;
        _lastMapDrawTime = now;

        if (!_mapOpen) { _drawCompass(); return; }

        if (!_mapCanvas) _mapCanvas = document.getElementById('map-canvas');
        if (_mapCanvas && !_mapCtx) _mapCtx = _mapCanvas.getContext('2d');
        if (!_mapCanvas || !_mapCtx) return;

        // Match the canvas backing size to its on-screen size (sharp on HiDPI, re-renders when opened)
        const rect = _mapCanvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const wantW = Math.max(1, Math.round(rect.width * dpr));
        const wantH = Math.max(1, Math.round(rect.height * dpr));
        if (_mapCanvas.width !== wantW || _mapCanvas.height !== wantH) {
            _mapCanvas.width = wantW;
            _mapCanvas.height = wantH;
        }
        const W = _mapCanvas.width, H = _mapCanvas.height;
        const k = W / 150;

        _mapView(); // refreshes (and drops the painted background) if the island layout changed
        if (!_bgMapCanvas || _bgMapCanvas.width !== W || _bgMapCanvas.height !== H) {
            _renderStaticMapBackground(W, H);
        }

        _mapCtx.clearRect(0, 0, W, H);
        if (_bgMapCanvas) _mapCtx.drawImage(_bgMapCanvas, 0, 0);

        if (_hoverMapPos) {
            _mapCtx.strokeStyle = 'rgba(74, 59, 36, 0.6)';
            _mapCtx.lineWidth = 1.2 * dpr;
            _mapCtx.beginPath();
            _mapCtx.arc(_hoverMapPos.x * dpr, _hoverMapPos.y * dpr, 7 * dpr, 0, Math.PI * 2);
            _mapCtx.stroke();
        }

        if (typeof playerGrp !== 'undefined') {
            const view = _mapView();
            const px = ((playerGrp.position.x - view.cx) / (view.half * 2.0) + 0.5) * W;
            const pz = ((playerGrp.position.z - view.cz) / (view.half * 2.0) + 0.5) * H;
            const yaw = typeof currentYaw !== 'undefined' ? currentYaw : 0;
            const size = Math.max(4 * dpr, 3.2 * k);

            // Simple red arrow for Kiki
            _mapCtx.save();
            _mapCtx.translate(px, pz);
            _mapCtx.rotate(-yaw);
            _mapCtx.fillStyle = '#c0392b';
            _mapCtx.strokeStyle = '#fbf6e8';
            _mapCtx.lineWidth = 1.2 * dpr;
            _mapCtx.beginPath();
            _mapCtx.moveTo(0, -size * 1.4);
            _mapCtx.lineTo(size, size);
            _mapCtx.lineTo(0, size * 0.45);
            _mapCtx.lineTo(-size, size);
            _mapCtx.closePath();
            _mapCtx.stroke();
            _mapCtx.fill();
            _mapCtx.restore();

            const badgeEl = document.getElementById('map-biome-badge');
            if (badgeEl) {
                const curB = getBiomeAt(playerGrp.position.x, playerGrp.position.z);
                const text = curB && !curB.isOcean ? _mapName(curB) : 'Open sea';
                if (badgeEl.textContent !== text) badgeEl.textContent = text;
            }
        }
    }

    const gltfLoader = new GLTFLoader();

        .setTranscoderPath('https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/libs/basis/')
        .detectSupport(renderer);

    gltfLoader.setMeshoptDecoder(MeshoptDecoder);

    // ==========================================

    const FLIGHT_MODELS = [

        { id: 'mitsubishi',    name: 'B2M2',      file: 'flight_models/mitsubishi_b2m2_-_game_art_1_stylized_plane.glb',   rotY: 180, scale: 2.2, anim: 'Flying', isPlane: true },
        { id: 'sopwith',       name: 'Sopwith',   file: 'flight_models/sopwith_pup_stylized_-_cupido.glb',                 rotY: 0,   scale: 2.2, anim: 'Take 001', isPlane: true },

        { id: 'robin',         name: 'Robin',     file: 'flight_models/american_robin_-_in_flight.glb',                   rotY: 180, scale: 0.7, anim: 'Wings Flapping' },
        { id: 'pewee',         name: 'Pewee',     file: 'flight_models/eastern_wood-pewee_-_in_flight.glb',                rotY: 180, scale: 0.7, anim: 'Wings Flapping' },

        { id: 'macaw',         name: 'Macaw',     file: 'flight_models/animated_parrot.glb',                              rotY: 180, scale: 0.8, anim: '02-flying' },
        { id: 'flock',         name: 'Flock',     file: 'flight_models/birds.glb',                                        rotY: 0,   scale: 0.9, anim: 'Scene' },
        { id: 'butterfly',     name: 'Morpho',    file: 'flight_models/borboleta_azul_-_butterfly.glb',                   rotY: 270, scale: 0.5, anim: 'ArmatureAction.001' },

    let fmCurrentIndex = 0;
    let fmCurrentWrapper = null;
    let fmCurrentMixer = null;
    const fmCache = new Map(); // id → { wrapper, mixer }
    let isModelVisible = true;

    function _fmNameBtn(el) {
        if (el) el.innerText = FLIGHT_MODELS[fmCurrentIndex].name;
    }

    function _fmLoadAndActivate(index, onDone) {
        const cfg = FLIGHT_MODELS[index];
        if (fmCache.has(cfg.id)) {
            _fmActivate(index); if (onDone) onDone(); return;
        }
        gltfLoader.load(cfg.file, (gltf) => {
            const root = gltf.scene;

            // Single pass: hide flat shadow-catcher meshes AND build clean bbox from the rest
            const rawBox = new THREE.Box3();
            root.traverse(c => {
                if (!c.isMesh) return;
                const mb = new THREE.Box3().setFromObject(c);
                const ms = new THREE.Vector3(); mb.getSize(ms);
                const maxXZ = Math.max(ms.x, ms.z);
                if (maxXZ > 0.3 && ms.y < 0.03 * maxXZ) {
                    c.visible = false; // shadow-catcher ground plane — exclude from sizing
                } else {
                    rawBox.union(mb);
                    c.castShadow = true;
                    c.receiveShadow = false; // prevents low-res sun shadow map from casting dark patches on character
                    c.frustumCulled = false;
                    if (c.material) {
                        const mats = Array.isArray(c.material) ? c.material : [c.material];
                        mats.forEach(m => {
                            if (m) {
                                if (m.map && !m.emissiveMap) {
                                    m.emissiveMap = m.map;
                                    m.emissive = new THREE.Color(0xffffff);
                                    m.emissiveIntensity = 0.10;
                                }
                                m.needsUpdate = true;
                            }
                        });
                    }
                }
            });
            if (rawBox.isEmpty()) rawBox.set(new THREE.Vector3(-1,-1,-1), new THREE.Vector3(1,1,1));
            const rawSize = new THREE.Vector3(); rawBox.getSize(rawSize);
            const rawCenter = new THREE.Vector3(); rawBox.getCenter(rawCenter);
            const maxDim = Math.max(rawSize.x, rawSize.y, rawSize.z);
            const baseScale = maxDim > 0 ? (2.0 / maxDim) : 1.0;
            const finalScale = baseScale * (cfg.scale || 1.0);

            const inner = new THREE.Group();
            root.position.set(-rawCenter.x, -rawCenter.y, -rawCenter.z);
            inner.rotation.y = (cfg.rotY || 0) * Math.PI / 180;
            inner.add(root);

            const wrapper = new THREE.Group();
            wrapper.add(inner);
            wrapper.scale.setScalar(finalScale);
            wrapper.position.y = cfg.offsetY || 0;
            wrapper.visible = false;

            let mixer = null;
            if (gltf.animations && gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(root);
                const clip = cfg.anim ? (gltf.animations.find(a => a.name === cfg.anim) || gltf.animations[0]) : gltf.animations[0];
                if (clip) mixer.clipAction(clip).play();
            }

            fmCache.set(cfg.id, { wrapper, mixer });
            playerVisuals.add(wrapper);
            proxyMesh.visible = false;
            _fmActivate(index);
            if (onDone) onDone();
        }, undefined, (err) => console.warn(`[FlightModel] Failed: ${cfg.file}`, err));
    }

    function _fmActivate(index) {
        if (fmCurrentWrapper) fmCurrentWrapper.visible = false;
        fmCurrentIndex = index;
        const cfg = FLIGHT_MODELS[index];
        const { wrapper, mixer } = fmCache.get(cfg.id);
        fmCurrentWrapper = wrapper;
        fmCurrentMixer = mixer;
        fmCurrentWrapper.visible = isModelVisible;
        _fmNameBtn(document.getElementById('char-name'));
        window.dispatchEvent(new CustomEvent('flight-model-changed', { detail: { index, config: cfg } }));
    }

    function fmNext() {
        const next = (fmCurrentIndex + 1) % FLIGHT_MODELS.length;
        _fmLoadAndActivate(next);
    }
    function fmPrev() {
        const prev = (fmCurrentIndex - 1 + FLIGHT_MODELS.length) % FLIGHT_MODELS.length;
        _fmLoadAndActivate(prev);
    }

    function updateModelVisibility() {
        if (fmCurrentWrapper) fmCurrentWrapper.visible = isModelVisible;
        const btn = document.getElementById('invis-toggle');
        if (btn) btn.innerText = isModelVisible ? 'Model: VISIBLE' : 'Model: INVISIBLE';
    }

    document.getElementById('invis-toggle')?.addEventListener('click', () => {
        isModelVisible = !isModelVisible;
        updateModelVisibility();
        if (typeof params !== 'undefined') params.modelVisible = isModelVisible;
    });
    document.getElementById('char-next')?.addEventListener('click', fmNext);
    document.getElementById('char-prev')?.addEventListener('click', fmPrev);

    const GhibliSummerShader = {
        uniforms: {
            tDiffuse: { value: null }
        },
        vertexShader: `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
            }
        `,
        fragmentShader: `
            uniform sampler2D tDiffuse;
            varying vec2 vUv;

            void main() {
                vec4 texel = texture2D( tDiffuse, vUv );
                vec3 col = texel.rgb;

                float lum = dot(col, vec3(0.299, 0.587, 0.114));

                // Studio Ghibli Summer Split-Toning (Golden sunlit highlights, soft atmospheric cerulean shadows)
                vec3 warmGold = col * vec3(1.07, 1.02, 0.92);
                vec3 azureShadow = col * vec3(0.93, 0.98, 1.07);
                col = mix(azureShadow, warmGold, smoothstep(0.2, 0.75, lum));

                // Lush Saturation Boost (Chlorophyll greens & vibrant ocean)
                col = mix(vec3(lum), col, 1.18);

                // Sun-drenched warm optical shimmer on highlights
                col += max(vec3(0.0), col - 0.55) * vec3(0.12, 0.09, 0.02);

                // Subtle Hand-Painted Celluloid Vignette
                vec2 uv = (vUv - 0.5) * 2.0;
                float vign = clamp(1.0 - dot(uv, uv) * 0.14, 0.0, 1.0);
                col *= vign;

                gl_FragColor = vec4(col, texel.a);
            }
        `
    };


    // ==========================================
    // GOD RAYS POST-PROCESSING PASS
    // ==========================================
    const GodRaysShader = {
        uniforms: {
            tDiffuse: { value: null },
            uSunScreenPos: { value: new THREE.Vector2(0.5, 0.5) },
            uIntensity: { value: 0.60 },
            uDecay: { value: 0.92 },
            uDensity: { value: 0.50 },
            uWeight: { value: 0.85 },
            uLumMin: { value: 0.85 },
            uLumMax: { value: 0.98 },
            uRayColorInner: { value: new THREE.Color('#ffea9f') },
            uRayColorOuter: { value: new THREE.Color('#ff9933') },
            uEdgeFadeDist: { value: 1.5 },
            uSunVisible: { value: 1.0 }
        },
        vertexShader: `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `,
        fragmentShader: `
            uniform sampler2D tDiffuse;
            uniform vec2 uSunScreenPos;
            uniform float uIntensity;
            uniform float uDecay;
            uniform float uDensity;
            uniform float uWeight;
            uniform float uLumMin;
            uniform float uLumMax;
            uniform vec3 uRayColorInner;
            uniform vec3 uRayColorOuter;
            uniform float uEdgeFadeDist;
            uniform float uSunVisible;
            varying vec2 vUv;

            float pseudoRand(vec2 p) {
                return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453123);
            }

            void main() {
                vec4 texel = texture2D(tDiffuse, vUv);

                // Direction from this pixel toward the sun
                vec2 deltaUV = (vUv - uSunScreenPos);
                float dist = length(deltaUV);
                deltaUV *= (1.0 / 24.0) * uDensity; // 24 dithered samples for crepuscular light shafts piercing through clouds

                // Screen-space dither offsets sample points to eliminate banding
                float dither = pseudoRand(gl_FragCoord.xy);
                vec2 sampleUV = vUv - (deltaUV * dither);

                float illumination = 0.0;
                float currentWeight = uWeight;

                for(int i = 0; i < 24; i++) {
                    sampleUV -= deltaUV;
                    vec4 samp = texture2D(tDiffuse, clamp(sampleUV, 0.001, 0.999));
                    float lum = dot(samp.rgb, vec3(0.299, 0.587, 0.114));
                    // Luminance gate captures sun disk and rim highlights piercing past clouds
                    float bright = smoothstep(uLumMin, uLumMax, lum);
                    illumination += bright * currentWeight;
                    currentWeight *= uDecay;
                }

                // Intensity normalization for 24-sample step integration
                illumination *= 1.35;

                // Fade out rays near screen edges and when sun is off-screen
                float edgeFade = 1.0 - smoothstep(0.4, uEdgeFadeDist, dist);

                // Dual-tone sunset/daylight radial gradient from Wanderlust-II
                vec3 rayTint = mix(uRayColorInner, uRayColorOuter, smoothstep(0.0, uEdgeFadeDist * 0.7, dist));
                vec3 rayColor = rayTint * illumination * uIntensity * edgeFade * uSunVisible;

                gl_FragColor = vec4(texel.rgb + rayColor, texel.a);
            }
        `
    };

    const godRaysPass = new ShaderPass(GodRaysShader);
    godRaysPass.enabled = !LOW_GFX;
    composer.addPass(godRaysPass);

    const summerPass = new ShaderPass(GhibliSummerShader);
    summerPass.enabled = false;
    composer.addPass(summerPass);

    let isSummerFilterOn = false;
    const summerBtn = document.getElementById('summer-toggle');
    if (summerBtn) {
        summerBtn.addEventListener('click', () => {
            isSummerFilterOn = !isSummerFilterOn;
            summerPass.enabled = isSummerFilterOn;
            if (typeof params !== 'undefined') params.summerFilter = isSummerFilterOn;
        });
    }

    // ==========================================
    // 2. LIGHTING
    // ==========================================
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);


    // ==========================================
    // GIANT FLOATING CRYSTALS (Instanced)
    // ==========================================
    const CRYSTAL_COUNT = 48;
    const geoCrystal = new THREE.OctahedronGeometry(1, 1).toNonIndexed();
    geoCrystal.scale(1, 3, 1);
    geoCrystal.computeVertexNormals();

    const matCrystal = new THREE.MeshPhysicalMaterial({
        roughness: 0.08,
        metalness: 0.15,
        transparent: true,
        opacity: 0.82,
        transmission: 0.0,
        thickness: 10.0,
        ior: 2.2,
        clearcoat: 1.0,
        clearcoatRoughness: 0.05,
        sheen: 1.0,
        sheenRoughness: 0.3,
        sheenColor: new THREE.Color(0xffffff),
        envMapIntensity: 1.5,
        depthWrite: true,
        depthTest: true,
        fog: true,
        side: THREE.DoubleSide
    });

    matCrystal.onBeforeCompile = (shader) => {
        shader.uniforms.crystalGlow = { value: 0.0 };
        shader.uniforms.baseGlow = { value: 1.8 };
        shader.uniforms.nightGlowMult = { value: 1.5 };
        shader.uniforms.uCustomColors = { value: [
            new THREE.Color('#6a00ff'), new THREE.Color('#ff0066'),
            new THREE.Color('#ff6600'), new THREE.Color('#ffcc00'),
            new THREE.Color('#00ffaa'), new THREE.Color('#00aaff')
        ]};
        shader.uniforms.flyHue = { value: 0.0 };
        shader.uniforms.flyContrast = { value: 1.0 };
        shader.uniforms.uTime = { value: 0.0 };
        matCrystal.userData.shader = shader;

        shader.vertexShader = shader.vertexShader.replace(
            '#include <common>',
            `#include <common>
             varying vec3 vPositionC;
             varying vec3 vWorldNormalC;
             varying vec3 vWorldPosC;`
        ).replace(
            '#include <begin_vertex>',
            `#include <begin_vertex>
             vPositionC = position;`
        ).replace(
            '#include <worldpos_vertex>',
            `#include <worldpos_vertex>
             #if defined( USE_INSTANCING )
                 vWorldPosC = (modelMatrix * instanceMatrix * vec4(transformed, 1.0)).xyz;
                 vWorldNormalC = normalize((modelMatrix * instanceMatrix * vec4(normal, 0.0)).xyz);
             #else
                 vWorldPosC = (modelMatrix * vec4(transformed, 1.0)).xyz;
                 vWorldNormalC = normalize((modelMatrix * vec4(normal, 0.0)).xyz);
             #endif`
        );

        shader.fragmentShader = `
            uniform float crystalGlow;
            uniform float baseGlow;
            uniform float nightGlowMult;
            uniform float flyHue;
            uniform float flyContrast;
            uniform float uTime;
            uniform vec3 uCustomColors[6];
            ${shader.fragmentShader}
        `.replace(
            '#include <common>',
            `#include <common>
             varying vec3 vPositionC;
             varying vec3 vWorldNormalC;
             varying vec3 vWorldPosC;
             vec3 rgb2hsv(vec3 c) {
                 vec4 K = vec4(0.0, -1.0 / 3.0, 2.0 / 3.0, -1.0);
                 vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g));
                 vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r));
                 float d = q.x - min(q.w, q.y);
                 float e = 1.0e-10;
                 return vec3(abs(q.z + (q.w - q.y) / (6.0 * d + e)), d / (q.x + e), q.x);
             }
             vec3 hsv2rgb(vec3 c) {
                 vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
                 vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
                 return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
             }`
        ).replace(
            '#include <color_fragment>',
            `#include <color_fragment>
             float tC = clamp((vPositionC.y + 3.0) / 6.0, 0.0, 1.0);

             // Smooth cubic interpolation through 6 color stops
             float segment = tC * 5.0;
             int idx = int(floor(segment));
             float frac = fract(segment);
             float t = frac * frac * (3.0 - 2.0 * frac); // smoothstep

             vec3 gradientColor;
             if (idx == 0) gradientColor = mix(uCustomColors[0], uCustomColors[1], t);
             else if (idx == 1) gradientColor = mix(uCustomColors[1], uCustomColors[2], t);
             else if (idx == 2) gradientColor = mix(uCustomColors[2], uCustomColors[3], t);
             else if (idx == 3) gradientColor = mix(uCustomColors[3], uCustomColors[4], t);
             else gradientColor = mix(uCustomColors[4], uCustomColors[5], t);

             // Hue Shift
             if (flyHue > 0.0) {
                 vec3 hsv = rgb2hsv(gradientColor);
                 hsv.x = fract(hsv.x + flyHue);
                 gradientColor = hsv2rgb(hsv);
             }

             // Contrast
             if (flyContrast != 1.0) {
                 gradientColor = pow(gradientColor, vec3(1.0 / flyContrast));
             }

             // Fresnel rim glow
             vec3 viewDir = normalize(cameraPosition - vWorldPosC);
             float fresnel = 1.0 - abs(dot(viewDir, vWorldNormalC));
             fresnel = pow(fresnel, 3.0);
             vec3 rimColor = mix(gradientColor, vec3(1.0), 0.6);
             gradientColor = mix(gradientColor, rimColor, fresnel * 0.7);

             // Vibrance boost
             vec3 hsvFinal = rgb2hsv(gradientColor);
             hsvFinal.y = min(hsvFinal.y * 1.4, 1.0);
             hsvFinal.z = min(hsvFinal.z * 1.15, 1.0);
             gradientColor = hsv2rgb(hsvFinal);

             diffuseColor.rgb = gradientColor;
            `
        ).replace(
            '#include <emissivemap_fragment>',
            `#include <emissivemap_fragment>
             float innerGlow = fresnel * 0.4 + 0.15;
             totalEmissiveRadiance += diffuseColor.rgb * (baseGlow * innerGlow + crystalGlow * nightGlowMult);
            `
        );
    };

    const instCrystals = new THREE.InstancedMesh(geoCrystal, matCrystal, CRYSTAL_COUNT);
    instCrystals.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    instCrystals.frustumCulled = false; // Prevent crystals from vanishing when looking away from origin
    scene.add(instCrystals);

    // Position crystals across Crystal Land and Magical Sanctuary
    const crystalData = [];
    const crystalIslands = worldLayout.islands.filter(isl => isl.biomeId === 'crystal_land' || isl.biomeId === 'magical_sanctuary');
    const primaryCrystalIsl = crystalIslands.find(isl => isl.biomeId === 'crystal_land') || crystalIslands[0] || { centerX: 1800, centerZ: 1400, radiusX: 1800, radiusZ: 1800 };

    const dummyC = new THREE.Object3D();
    for(let i=0; i<CRYSTAL_COUNT; i++) {
        const isl = (i % 6 === 0 && crystalIslands.length > 1) ? (crystalIslands.find(isl => isl.biomeId === 'magical_sanctuary') || primaryCrystalIsl) : primaryCrystalIsl;
        const angle = (i / CRYSTAL_COUNT) * Math.PI * 2 * 3.7 + (i * 0.43);
        const radFrac = 0.08 + ((i * 17) % 42) / 100.0;
        const rX = isl.radiusX ? isl.radiusX * radFrac : 1200 * radFrac;
        const rZ = isl.radiusZ ? isl.radiusZ * radFrac : 1200 * radFrac;
        const cx = isl.centerX + Math.cos(angle) * rX;
        const cz = isl.centerZ + Math.sin(angle) * rZ;
        const groundH = Math.max(2.0, getWorldHeight(cx, cz));

        const s = 28 + (i % 7) * 10;
        const baseY = groundH + 35 + (i % 8) * 30;

        crystalData.push({
            x: cx,
            z: cz,
            baseY: baseY,
            groundH: groundH,
            scaleX: s * 0.55,
            scaleY: s * 1.7,
            scaleZ: s * 0.55,
            rotSpeedY: 0.003 + (i % 4) * 0.002,
            bobSpeed: 0.4 + (i % 5) * 0.15,

    function findFlatSpot(cx, cz, minDist, maxDist, minSep) {
        for (let attempt = 0; attempt < 25; attempt++) {
            const angle = Math.random() * Math.PI * 2;
            const r = minDist + Math.random() * (maxDist - minDist);
            const tx = cx + Math.cos(angle) * r;
            const tz = cz + Math.sin(angle) * r;
            const groundY = getWorldHeight(tx, tz);
            if (groundY < 3.2 || groundY > 38.0) continue;

            const b = getBiomeAt(tx, tz);
            // Capybaras thrive in Archipelago, Ghibli Land, and lush coastal plains
            if (b && (b.id === 'crystal_land' || b.id === 'magical_sanctuary' || b.id === 'misty_mountains' || b.id === 'misty_mountains_2')) {
                continue;
            }

            const slopeX = Math.abs(getWorldHeight(tx + 3, tz) - groundY);
            const slopeZ = Math.abs(getWorldHeight(tx, tz + 3) - groundY);
            if (slopeX > 1.2 || slopeZ > 1.2) continue;

            // Sample 8 directions at r=60 to ensure we are on open island ground
            let landCount = 0;
            for (let d = 0; d < 8; d++) {
                const a = (d / 8) * Math.PI * 2;
                if (getWorldHeight(tx + Math.cos(a) * 60, tz + Math.sin(a) * 60) > 3.0) landCount++;
            }
            if (landCount < 6) continue;

            let tooClose = false;
            for (const other of capybaraSpawns) {
                if (other.placed && Math.hypot(tx - other.mesh.position.x, tz - other.mesh.position.z) < minSep) {
                    tooClose = true; break;
                }
            }
            if (tooClose) continue;
            return { x: tx, y: groundY, z: tz };
        }
        return null;
    }

    function updateCapybaras(playerPos, dt) {
        let placedThisFrame = false;
        capybaraSpawns.forEach(capy => {
            if (!capy.placed) {
                if (placedThisFrame) return;
                const isGrouped = Math.random() < 0.75;
                let spot;
                if (isGrouped) {
                    const nearby = capybaraSpawns.find(c => c.placed &&
                        Math.hypot(playerPos.x - c.mesh.position.x, playerPos.z - c.mesh.position.z) < 500);
                    if (nearby) {
                        spot = findFlatSpot(nearby.mesh.position.x, nearby.mesh.position.z, 20, 90, 18);
                    }
                }
                if (!spot) {
                    spot = findFlatSpot(playerPos.x, playerPos.z, 70, 550, 20);
                }
                if (spot) {
                    capy.mesh.position.set(spot.x, spot.y, spot.z);
                    capy.mesh.rotation.y = Math.random() * Math.PI * 2;
                    capy.mesh.visible = true;
                    capy.placed = true;
                    placedThisFrame = true;
                    capy.state = 'idle';
                    capy.stateTimer = 3 + Math.random() * 6;
                    if (capy.actions['idle']) {
                        Object.values(capy.actions).forEach(a => a.stop());
                        capy.actions['idle'].reset().play();
                    }
                }
            } else {
                const dist = Math.hypot(
                    playerPos.x - capy.mesh.position.x,
                    playerPos.z - capy.mesh.position.z
                );
                if (dist > CAPYBARA_DESPAWN_RADIUS) {
                    capy.placed = false;
                    capy.mesh.visible = false;
                    if (capyFlyTarget === capy) capyFlyTarget = null;
                    return;
                }

                capy.stateTimer -= dt;
                if (capy.stateTimer <= 0) {
                    if (capy.state === 'idle') {
                        const walkAngle = Math.random() * Math.PI * 2;
                        const walkDist = 6 + Math.random() * 15;
                        capy.walkTarget = new THREE.Vector3(
                            capy.mesh.position.x + Math.cos(walkAngle) * walkDist, 0,
                            capy.mesh.position.z + Math.sin(walkAngle) * walkDist
                        );
                        switchCapyAction(capy, 'walk');
                        capy.stateTimer = 3 + Math.random() * 5;
                    } else {
                        capy.walkTarget = null;
                        switchCapyAction(capy, 'idle');
                        capy.stateTimer = 4 + Math.random() * 7;
                    }
                }

                if (capy.state === 'walk' && capy.walkTarget) {
                    const dx = capy.walkTarget.x - capy.mesh.position.x;
                    const dz = capy.walkTarget.z - capy.mesh.position.z;
                    const distToTarget = Math.sqrt(dx * dx + dz * dz);
                    if (distToTarget > 0.5) {
                        const speed = 2.8;
                        const nx = capy.mesh.position.x + (dx / distToTarget) * speed * dt;
                        const nz = capy.mesh.position.z + (dz / distToTarget) * speed * dt;
                        const groundY = getWorldHeight(nx, nz);
                        if (groundY > 3.0 && groundY < 40.0) {
                            capy.mesh.position.set(nx, groundY, nz);
                            capy.mesh.rotation.y = Math.atan2(dx, dz);
                        } else {
                            capy.walkTarget = null;
                            switchCapyAction(capy, 'idle');
                            capy.stateTimer = 3 + Math.random() * 5;
                        }
                    } else {
                        capy.walkTarget = null;
                        switchCapyAction(capy, 'idle');
                        capy.stateTimer = 4 + Math.random() * 6;
                    }
                }

                if (dist < CAPYBARA_ANIM_RADIUS) {
                    capy.mixer.update(dt);
                }
            }
        });

    function smoothstep(edge0, edge1, x) {
        const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
        return t * t * (3 - 2 * t);
    }

    function distToSegment(px, pz, ax, az, bx, bz) {
        const l2 = (ax - bx)**2 + (az - bz)**2;
        if (l2 === 0) return Math.hypot(px - ax, pz - az);
        let t = ((px - ax) * (bx - ax) + (pz - az) * (bz - az)) / l2;
        t = Math.max(0, Math.min(1, t));
        return Math.hypot(px - (ax + t * (bx - ax)), pz - (az + t * (bz - az)));
    }

    function getPathStrength(x, z) {
        const scale = 0.002;
        const n1 = snoise(x * scale, z * scale);
        const n2 = snoise(x * scale * 2 + 1000, z * scale * 2 + 1000) * 0.3;
        let path = Math.abs(n1 + n2);
        let mask = smoothstep(0.15, 0.0, path); // wider, softer path
        return mask;
    }

    let terrainHeightBuffer = new Float32Array((256 + 1) * (256 + 1));
    let terrainPrevHeights = new Float32Array(0);
    let terrainPrevColors = new Float32Array(0);
    let lastTerrainRes = -1;

    // Height of the *drawn* ground at (x, z). Terrain vertices always sit on a fixed world lattice,
    // so interpolating the same two triangles PlaneGeometry uses gives the exact visible surface.
    // Also returns the surface slope in _meshSlope.
    let _meshSlope = 0;
    function getMeshHeight(x, z) {
        const sp = TERRAIN_SIZE / terrainRes;
        const x0 = Math.floor(x / sp) * sp, z0 = Math.floor(z / sp) * sp;
        const fx = (x - x0) / sp, fz = (z - z0) / sp;
        const ha = getWorldHeight(x0, z0);           // (x0, z0)
        const hb = getWorldHeight(x0, z0 + sp);      // (x0, z1)
        const hc = getWorldHeight(x0 + sp, z0 + sp); // (x1, z1)
        const hd = getWorldHeight(x0 + sp, z0);      // (x1, z0)
        const sx = Math.max(Math.abs(hd - ha), Math.abs(hc - hb)) / sp;
        const sz = Math.max(Math.abs(hb - ha), Math.abs(hc - hd)) / sp;
        _meshSlope = Math.sqrt(sx * sx + sz * sz);
        if (fx + fz <= 1.0) return ha + (hd - ha) * fx + (hb - ha) * fz;
        return hc + (hb - hc) * (1.0 - fx) + (hd - hc) * (1.0 - fz);
    }

    function updateTerrainGeometry(playerX, playerZ) {
        const vertexSpacing = TERRAIN_SIZE / terrainRes;
        const gridX = Math.floor(playerX / vertexSpacing) * vertexSpacing;
        const gridZ = Math.floor(playerZ / vertexSpacing) * vertexSpacing;

        if (gridX === lastTerrainGridX && gridZ === lastTerrainGridZ) return;

        terrain.position.set(gridX, 0, gridZ);

        const pos = terrainGeo.attributes.position;
        if (!terrainGeo.attributes.color) {
            terrainGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(pos.count * 3), 3));
        }
        const colors = terrainGeo.attributes.color;
        const normals = terrainGeo.attributes.normal;
        const count = pos.count;
        const stride = terrainRes + 1;

        if (terrainHeightBuffer.length < count) {
            terrainHeightBuffer = new Float32Array(count);
        }

        // Grid moved by (dc, dr) cells: vertex (r, c) now shows what (r + dr, c + dc) showed before
        const dc = Math.round((gridX - lastTerrainGridX) / vertexSpacing);
        const dr = Math.round((gridZ - lastTerrainGridZ) / vertexSpacing);
        const canShift = lastTerrainGridX !== -9999 && lastTerrainRes === terrainRes &&
                         Math.abs(dc) < stride && Math.abs(dr) < stride;
        if (canShift) {
            if (terrainPrevHeights.length !== count) terrainPrevHeights = new Float32Array(count);
            if (terrainPrevColors.length !== count * 3) terrainPrevColors = new Float32Array(count * 3);
            terrainPrevHeights.set(terrainHeightBuffer.subarray(0, count));
            terrainPrevColors.set(colors.array);
        }

        for (let i = 0; i < count; i++) {
            if (canShift) {
                const oc = (i % stride) + dc;
                const or = ((i / stride) | 0) + dr;
                if (oc >= 0 && oc < stride && or >= 0 && or < stride) {
                    const oi = or * stride + oc;
                    const h = terrainPrevHeights[oi];
                    pos.setY(i, h);
                    terrainHeightBuffer[i] = h;
                    colors.setXYZ(i, terrainPrevColors[oi * 3], terrainPrevColors[oi * 3 + 1], terrainPrevColors[oi * 3 + 2]);
                    continue;
                }
            }
            const worldX = pos.getX(i) + gridX;
            const worldZ = pos.getZ(i) + gridZ;
            const h = getWorldHeight(worldX, worldZ);
            pos.setY(i, h);
            terrainHeightBuffer[i] = h;

            getWorldColor(h, worldX, worldZ, tempColor);

            // Add dirt path
            const pathMask = getPathStrength(worldX, worldZ);
            if (pathMask > 0 && h > 2.0 && h < 25.0) {
                tempColor.lerp(colorPath, pathMask * 0.85);
            }

            colors.setXYZ(i, tempColor.r, tempColor.g, tempColor.b);
        }

        const invTwoSpacing = 1.0 / (2.0 * vertexSpacing);

                const hR = (c < terrainRes) ? terrainHeightBuffer[idx + 1] : getWorldHeight(pos.getX(idx) + gridX + vertexSpacing, pos.getZ(idx) + gridZ);
                const hD = (r > 0) ? terrainHeightBuffer[idx - stride] : getWorldHeight(pos.getX(idx) + gridX, pos.getZ(idx) + gridZ - vertexSpacing);
                const hU = (r < terrainRes) ? terrainHeightBuffer[idx + stride] : getWorldHeight(pos.getX(idx) + gridX, pos.getZ(idx) + gridZ + vertexSpacing);

                const nz = -(hU - hD) * invTwoSpacing;
                const invLen = 1.0 / Math.sqrt(nx * nx + 1.0 + nz * nz);
                normals.setXYZ(idx, nx * invLen, invLen, nz * invLen);
            }
        }

    // =========================================================================

    // Small repeatable random number source, so the clouds look identical on every reload
    function cloudRand(seed) {
        let s = (seed | 0) >>> 0;
        return function () {
            s = (s + 0x6D2B79F5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }

    // One puff. The surface is pushed in and out at three different sizes of bump, so the
    // outline never reads as a plain ball: big billows, cauliflower lumps, then a fine crinkle.
    function createFluffyLobe(radius, segW = 36, segH = 26, squashY = 0.85, noiseAmp = 0.13, seed = 1) {
        const geo = new THREE.SphereGeometry(radius, segW, segH);
        const pos = geo.attributes.position;
        const rnd = cloudRand(seed);
        const p1 = rnd() * 6.2832, p2 = rnd() * 6.2832, p3 = rnd() * 6.2832;
        for (let i = 0; i < pos.count; i++) {
            let x = pos.getX(i);
            let y = pos.getY(i);
            let z = pos.getZ(i);
            const len = Math.sqrt(x * x + y * y + z * z) || 1.0;
            const nx = x / len;
            const ny = y / len;
            const nz = z / len;

            const b1 = Math.sin(nx * 2.1 + p1) * Math.cos(ny * 1.7 + nz * 1.4 + p2);
            const b2 = Math.sin(nx * 4.6 + nz * 4.1 + p2) * Math.cos(ny * 4.3 + nx * 3.8 + p3) * 0.55;
            const b3 = Math.sin(nx * 6.1 + ny * 5.7 + p3) * Math.cos(nz * 6.3 + p1) * 0.11;
            let bump = (b1 + b2 + b3) * noiseAmp;

            // Real cumulus have a calm, flattish underside - keep the lumps on top and around the sides
            bump *= 0.32 + 0.68 * Math.max(0.0, ny * 0.5 + 0.5);

            const r = radius * (1.0 + bump);
            pos.setXYZ(i, nx * r, ny * r * squashY, nz * r);
        }
        geo.computeVertexNormals();
        return geo;
    }

    // Grows smaller puffs out of the sides and tops of bigger puffs. This is what turns a
    // stack of balls into a knobbly cloud. Two rounds: buds, then buds on the buds.
    function growPuffBuds(parents, seed, countMin, countMax, sizeMin, sizeMax) {
        const rnd = cloudRand(seed);
        const buds = [];
        for (let i = 0; i < parents.length; i++) {
            const p = parents[i];
            const n = countMin + Math.floor(rnd() * (countMax - countMin + 1));
            for (let k = 0; k < n; k++) {
                const ang = rnd() * 6.2832;
                const up = -0.20 + rnd() * 1.10;                       // mostly upper half, never straight down
                const horiz = Math.sqrt(Math.max(0.0, 1.0 - up * up));
                const cr = p.r * (sizeMin + rnd() * (sizeMax - sizeMin));
                let d = p.r * (0.72 + rnd() * 0.22);                     // sit on the parent's shoulder
                d = Math.max(d, p.r * 1.20 - cr);                        // ...but always poke clearly out of it
                d = Math.min(d, p.r * 0.96);                             // ...while staying attached
                const psy = p.sy || 0.85;
                buds.push({
                    r: cr,
                    x: p.x + Math.cos(ang) * horiz * d,
                    y: p.y + up * d * psy,
                    z: p.z + Math.sin(ang) * horiz * d,
                    sy: Math.min(1.12, psy + 0.10),
                    noise: 0.030
                });
            }
        }
        return buds;
    }

    // Builds the main puffs plus both rounds of buds and drops them all into the lobe list.
    // Smaller puffs get fewer segments, which keeps the triangle count close to where it was.
    function addPuffLobes(puffs, lobes, seed, opts) {
        const o = opts || {};
        const segParent = o.segParent || [28, 20];
        const segBud = o.segBud || [12, 9];
        const segSub = o.segSub || [8, 6];
        const budMin = o.budMin !== undefined ? o.budMin : 2;
        const budMax = o.budMax !== undefined ? o.budMax : 4;

        let s = seed;
        puffs.forEach(p => {
            const g = createFluffyLobe(p.r, segParent[0], segParent[1], p.sy, (p.noise || 0.025) * 5.4, s++);
            g.translate(p.x, p.y, p.z);
            lobes.push(g);
        });

        const buds = growPuffBuds(puffs, seed + 101, budMin, budMax, 0.30, 0.54);
        buds.forEach(p => {
            const g = createFluffyLobe(p.r, segBud[0], segBud[1], p.sy, p.noise * 5.4, s++);
            g.translate(p.x, p.y, p.z);
            lobes.push(g);
        });

        // Only the chunkier buds are worth budding again - tiny ones add cost and no silhouette
        const bigBuds = buds.filter(b => b.r > 60);
        const subBuds = growPuffBuds(bigBuds, seed + 977, 1, 1, 0.34, 0.52);
        subBuds.forEach(p => {
            const g = createFluffyLobe(p.r, segSub[0], segSub[1], p.sy, p.noise * 5.4, s++);
            g.translate(p.x, p.y, p.z);
            lobes.push(g);
        });
    }

        const name = String(archetype);
        let h = 2166136261;
        for (let i = 0; i < name.length; i++) { h ^= name.charCodeAt(i); h = Math.imul(h, 16777619); }
        return (h >>> 0) % 100000;
    }
