    // Merges the puffs into one cloud and works out its shading. Shared by every cloud layer.
    function finishCloudGeometry(lobes) {
        const merged = BufferGeometryUtils.mergeGeometries(lobes);
        const pos = merged.attributes.position;
        let minY = Infinity, maxY = -Infinity;
        for (let i = 0; i < pos.count; i++) {
            const y = pos.getY(i);
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
        }

        const heightSpan = Math.max(1, maxY - minY);
        const localYArr = new Float32Array(pos.count);
        for (let i = 0; i < pos.count; i++) {
            localYArr[i] = Math.max(0.0, Math.min(1.0, (pos.getY(i) - minY) / heightSpan));
        }
        merged.setAttribute('aLocalY', new THREE.BufferAttribute(localYArr, 1));
        merged.computeVertexNormals();

        // Normal blending: smoothly blend outward radial direction with smooth vertex normal
        // Softens internal crevice seams into one unified, pillowy, fluffy cloud!
        // The puffs overlap, so in places two skins sit at almost the same distance from the
        // camera and the renderer flickers between them - that was the sparkly grain.
        // Fix: work out the shading normal purely from WHERE a point is, never from which puff
        // it belongs to. Both skins in an overlap then get the exact same normal, shade the
        // same, and the flicker has nothing to show. It also gives the flat, painted toon look.
        const norm = merged.attributes.normal;
        const vPos = new THREE.Vector3();
        const vNorm = new THREE.Vector3();
        const vDir = new THREE.Vector3();
        const wob = 0.011;      // size of the soft billow shading
        for (let i = 0; i < pos.count; i++) {
            vPos.set(pos.getX(i), pos.getY(i), pos.getZ(i));

            // outward from the cloud's own body, lifted so the underside still catches sky
            const dy = Math.max(0.0, vPos.y - minY) * 0.65 + heightSpan * 0.25;
            vDir.set(vPos.x, dy, vPos.z).normalize();

            // gentle position-driven billowing so it isn't one featureless blob
            const ax = Math.sin(vPos.z * wob * 1.7 + vPos.y * wob * 1.3);
            const ay = Math.sin(vPos.x * wob * 1.1 + vPos.z * wob * 0.9);
            const az = Math.sin(vPos.y * wob * 1.2 + vPos.x * wob * 0.8);

            vNorm.copy(vDir).addScaledVector(new THREE.Vector3(ax, ay, az), 0.30).normalize();
            vNorm.y = Math.max(vNorm.y, 0.20);
            vNorm.normalize();
            norm.setXYZ(i, vNorm.x, vNorm.y, vNorm.z);
        }

        return merged;
    }

    function setupToonCloudShader(mat, defaultBlur = 0.45) {
        mat.fog = false; // Distant clouds handle their own atmospheric haze to blend seamlessly with horizon!
        mat.onBeforeCompile = (shader) => {
            shader.uniforms.uSunDir = { value: new THREE.Vector3(0.4, 0.8, 0.3).normalize() };
            shader.uniforms.uSunLitColor = { value: new THREE.Color(0xeff0ea) }; // Soft sunlit white, kept just under the god-ray brightness gate
            shader.uniforms.uSkyShadowColor = { value: new THREE.Color(0x9ab4d0) }; // Soft luminous sky-blue ambient (lifted: deep slate read as grey)
            shader.uniforms.uHorizonColor = { value: new THREE.Color(0xbcdcf2) }; // Seamless horizon mist tone
            shader.uniforms.uRimColor = { value: new THREE.Color(0xffffff) };
            shader.uniforms.uCloudTint = { value: new THREE.Color(0xffffff) };
            shader.uniforms.uCloudOpacity = { value: mat.opacity !== undefined ? mat.opacity : 0.98 };
            shader.uniforms.uBottomBlur = { value: defaultBlur };
            shader.uniforms.uNearSolid = { value: params.cloudsNearSolid };   // inside this distance clouds are solid fluff
            shader.uniforms.uFarHaze = { value: params.cloudsFarHaze };       // past this they melt into horizon haze

            if (!window.cloudShaderUniformsList) window.cloudShaderUniformsList = [];
            window.cloudShaderUniformsList.push(shader.uniforms);
            mat.userData.shader = shader;

            shader.vertexShader = 'attribute float aLocalY;\nvarying float vLocalY;\nvarying vec3 vWorldNormal;\nvarying vec3 vWorldPos;\n' + shader.vertexShader;
            shader.vertexShader = shader.vertexShader.replace(
                '#include <worldpos_vertex>',
                [
                    '#include <worldpos_vertex>',
                    '#ifdef USE_INSTANCING',
                    '    mat4 _cloudM = modelMatrix * instanceMatrix;',
                    '#else',
                    '    mat4 _cloudM = modelMatrix;',
                    '#endif',
                    'vWorldPos = (_cloudM * vec4(transformed, 1.0)).xyz;',
                    'vWorldNormal = normalize(mat3(_cloudM) * normal);',
                    'vLocalY = aLocalY;'
                ].join('\n')
            );

            shader.fragmentShader = 'uniform vec3 uSunDir;\nuniform vec3 uSunLitColor;\nuniform vec3 uSkyShadowColor;\nuniform vec3 uHorizonColor;\nuniform vec3 uRimColor;\nuniform vec3 uCloudTint;\nuniform float uCloudOpacity;\nuniform float uBottomBlur;\nuniform float uNearSolid;\nuniform float uFarHaze;\nvarying float vLocalY;\nvarying vec3 vWorldNormal;\nvarying vec3 vWorldPos;\n' + shader.fragmentShader;
            shader.fragmentShader = shader.fragmentShader.replace(
                '#include <opaque_fragment>',
                [
                    'vec3 norm = normalize(vWorldNormal);',
                    'vec3 sunDir = normalize(uSunDir);',
                    'vec3 vDir = normalize(cameraPosition - vWorldPos);',
                    // Nearby clouds stay solid and white; only far banks fade into the horizon
                    'float camDist = length(cameraPosition - vWorldPos);',
                    'float nearness = 1.0 - smoothstep(uNearSolid, uFarHaze, camDist);',

                    // Soft wrapped diffuse: wide, gentle lighting gradient (not harsh cel-shaded cutoffs!)
                    'float NdotL = dot(norm, sunDir);',
                    'float lightWrap = clamp(NdotL * 0.46 + 0.56, 0.0, 1.0);',
                    'float diffuse = smoothstep(0.04, 0.82, lightWrap);',

                    // Ambient sky bounce for deep cloud shadows (Ghibli soft luminous ambient fill)
                    'float skyAmb = clamp(norm.y * 0.26 + 0.76, 0.70, 1.0);',

                    // Height gradient: base is soft atmospheric tone, crown is sunlit white
                    'vec3 deepShadow = mix(uSkyShadowColor * skyAmb, uSunLitColor, 0.40);',
                    'vec3 shadowTone = mix(uHorizonColor, deepShadow, smoothstep(0.02, 0.62, vLocalY));',
                    'vec3 litTone = uSunLitColor + vec3(smoothstep(0.55, 1.0, vLocalY) * 0.08);',
                    'vec3 col = mix(shadowTone, litTone, diffuse);',
                    // wash the whole base (lit side included) into horizon haze so the bank has no cut-off edge
                    'vec3 hazed = mix(uHorizonColor, col, smoothstep(0.0, 0.55, vLocalY));',
                    'col = mix(hazed, col, nearness);',
                    'col *= uCloudTint;',

                    // Organic Bottom Feathering & Blur (Dissolves softly into the sky/horizon with ZERO harsh cutoffs!)
                    'float bottomWave = sin(vWorldPos.x * 0.0016 + vWorldPos.z * 0.0013) * 0.10',
                    '                 + sin(vWorldPos.x * 0.0051 - vWorldPos.z * 0.0044) * 0.055',
                    '                 + sin(vWorldPos.x * 0.0123 + vWorldPos.z * 0.0109) * 0.025;',
                    'float fadeProgress = clamp((vLocalY + bottomWave) / max(uBottomBlur, 0.05), 0.0, 1.0);',
                    'float bottomDissolve = smoothstep(0.0, 1.0, fadeProgress);',

                    'float nearDissolve = mix(bottomDissolve, 1.0, nearness * 0.88);',
                    'float alpha = mix(uCloudOpacity, 1.0, nearness) * nearDissolve;',
                    'if (alpha < 0.003) discard;',

                    'outgoingLight = col;',
                    '#ifdef OPAQUE',
                    'diffuseColor.a = 1.0;',
                    '#endif',
                    'gl_FragColor = vec4(outgoingLight, alpha);'
                ].join('\n')
            );
        };
    }

    // Super High Cumulonimbus Clouds & Distant Mega Painted Clouds
    const HIGH_CLOUD_COUNT = LOW_GFX ? 0 : 48;
    const BASE_HIGH_CLOUD_COUNT = LOW_GFX ? 0 : 28;
    const highCloudGeo = buildProceduralCloud('tower');

    const highCloudMat = new THREE.MeshToonMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: params.cloudsHighOpacity,
        depthWrite: true,
        depthTest: true,
        side: THREE.FrontSide
    });
    setupToonCloudShader(highCloudMat, params.cloudsHighBottomBlur);

    const instHighClouds = new THREE.InstancedMesh(highCloudGeo, highCloudMat, HIGH_CLOUD_COUNT);
    instHighClouds.count = BASE_HIGH_CLOUD_COUNT;
    instHighClouds.frustumCulled = false;
    scene.add(instHighClouds);

    const WISPY_CLOUD_COUNT = 0;
    const instWispyClouds = new THREE.InstancedMesh(geoCloud, matWispyCloud, WISPY_CLOUD_COUNT);
    instWispyClouds.frustumCulled = false;
    scene.add(instWispyClouds);

    // Far-Distance Mega Painted Clouds (Horizon Cloud Banks)
    const MEGA_CLOUD_COUNT = LOW_GFX ? 0 : 48;
    const BASE_MEGA_CLOUD_COUNT = LOW_GFX ? 0 : 28;
    const megaCloudMat = new THREE.MeshToonMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: params.cloudsGiantOpacity,
        depthWrite: true,
        depthTest: true,
        side: THREE.FrontSide
    });
    setupToonCloudShader(megaCloudMat, params.cloudsGiantBottomBlur);

    // 4 Distinct Procedural Cloud Archetypes for Horizon Banks:
    // 0: Wide Shelf, 1: Cumulus Fortress, 2: Asymmetric Wind-Swept, 3: Undulating Double-Dome
    const megaGeos = [
        buildProceduralCloud('shelf'),
        buildProceduralCloud('fortress'),
        buildProceduralCloud('asymmetric'),
        buildProceduralCloud('undulating')
    ];

    function updateBirdsGen(data, inst, count, tX, tY, tZ, time, dt, centerPull) {
        for (let i = 0; i < count; i++) {
            let px = data[i * 6 + 0], py = data[i * 6 + 1], pz = data[i * 6 + 2];
            let vx = data[i * 6 + 3], vy = data[i * 6 + 4], vz = data[i * 6 + 5];

            let cx = 0, cy = 0, cz = 0;
            let sx = 0, sy = 0, sz = 0;
            let ax = 0, ay = 0, az = 0;
            let n = 0;

            for (let j = 0; j < count; j++) {
                if (i === j) continue;
                let dx = px - data[j * 6 + 0], dy = py - data[j * 6 + 1], dz = pz - data[j * 6 + 2];
                let distSq = dx*dx + dy*dy + dz*dz;

                if (distSq < 1200) {
                    cx += data[j * 6 + 0]; cy += data[j * 6 + 1]; cz += data[j * 6 + 2];
                    ax += data[j * 6 + 3]; ay += data[j * 6 + 4]; az += data[j * 6 + 5];
                    n++;
                }
                if (distSq < 400) {
                    sx += dx; sy += dy; sz += dz;
                }
            }

            if (n > 0) {
                cx /= n; cy /= n; cz /= n;
                ax /= n; ay /= n; az /= n;
                vx += (cx - px) * 0.4 * dt;
                vy += (cy - py) * 0.4 * dt;
                vz += (cz - pz) * 0.4 * dt;
                vx += (ax - vx) * 0.1 * dt;
                vy += (ay - vy) * 0.1 * dt;
                vz += (az - vz) * 0.1 * dt;
            }

            vx += sx * 1.8 * dt; vy += sy * 1.8 * dt; vz += sz * 1.8 * dt;

            // Give each bird an offset slot around Kiki so they soar gracefully around her rather than clumping
            let formAngle = (i / count) * Math.PI * 2.0;
            let formRadius = 22 + (i % 6) * 9;
            let targetX = tX + Math.cos(formAngle) * formRadius;
            let targetY = tY + ((i % 5) - 2) * 3.5;
            let targetZ = tZ + Math.sin(formAngle) * formRadius;

            let tx = targetX - px, ty = targetY - py, tz = targetZ - pz;
            let dToT = Math.sqrt(tx*tx + ty*ty + tz*tz);
            if (dToT > 3) {
                let pullFactor = (dToT > 100) ? centerPull * 4.0 : centerPull * 1.2;
                vx += (tx / dToT) * pullFactor * dt;
                vy += (ty / dToT) * pullFactor * dt;
                vz += (tz / dToT) * pullFactor * dt;
            }

            let maxSpd = (centerPull > 3.0 && typeof velocity !== 'undefined') ? Math.max(40, velocity * 1.2) : 35;
            let spd = Math.sqrt(vx*vx + vy*vy + vz*vz);
            if (spd > maxSpd) { vx *= maxSpd/spd; vy *= maxSpd/spd; vz *= maxSpd/spd; }
            if (spd < 15) { vx *= 15/spd; vy *= 15/spd; vz *= 15/spd; }

            px += vx * dt; py += vy * dt; pz += vz * dt;
            data[i * 6 + 0] = px; data[i * 6 + 1] = py; data[i * 6 + 2] = pz;
            data[i * 6 + 3] = vx; data[i * 6 + 4] = vy; data[i * 6 + 5] = vz;

            dummy.updateMatrix();
            inst.setMatrixAt(i, dummy.matrix);
        }
        inst.instanceMatrix.needsUpdate = true;

    // ==========================================

    const _scratchVec3 = new THREE.Vector3();

    class HierarchicalOctreeNode {
        constructor(minX, minY, minZ, maxX, maxY, maxZ, depth = 0, maxDepth = 3) {
            this.depth = depth;
            this.maxDepth = maxDepth;
            this.box = new THREE.Box3(
                new THREE.Vector3(minX, minY, minZ),
                new THREE.Vector3(maxX, maxY, maxZ)
            );
            this.sphere = new THREE.Sphere();
            this.box.getBoundingSphere(this.sphere);

            this.children = null;
            this.isVisible = false;

            if (depth < maxDepth) {
                this.subdivide();
            }
        }

        subdivide() {
            const min = this.box.min;
            const max = this.box.max;
            const midX = (min.x + max.x) * 0.5;
            const midY = (min.y + max.y) * 0.5;
            const midZ = (min.z + max.z) * 0.5;

            this.children = [
                new HierarchicalOctreeNode(min.x, min.y, min.z, midX, midY, midZ, this.depth + 1, this.maxDepth),
                new HierarchicalOctreeNode(midX, min.y, min.z, max.x, midY, midZ, this.depth + 1, this.maxDepth),
                new HierarchicalOctreeNode(min.x, midY, min.z, midX, max.y, midZ, this.depth + 1, this.maxDepth),
                new HierarchicalOctreeNode(midX, midY, min.z, max.x, max.y, midZ, this.depth + 1, this.maxDepth),
                new HierarchicalOctreeNode(min.x, min.y, midZ, midX, midY, max.z, this.depth + 1, this.maxDepth),
                new HierarchicalOctreeNode(midX, min.y, midZ, max.x, midY, max.z, this.depth + 1, this.maxDepth),
                new HierarchicalOctreeNode(min.x, midY, midZ, midX, max.y, max.z, this.depth + 1, this.maxDepth),
                new HierarchicalOctreeNode(midX, midY, midZ, max.x, max.y, max.z, this.depth + 1, this.maxDepth)
            ];
        }

        updateBounds(minX, minY, minZ, maxX, maxY, maxZ) {
            this.box.min.set(minX, minY, minZ);
            this.box.max.set(maxX, maxY, maxZ);
            this.box.getBoundingSphere(this.sphere);

            if (this.children) {
                const midX = (minX + maxX) * 0.5;
                const midY = (minY + maxY) * 0.5;
                const midZ = (minZ + maxZ) * 0.5;

                this.children[0].updateBounds(minX, minY, minZ, midX, midY, midZ);
                this.children[1].updateBounds(midX, minY, minZ, maxX, midY, midZ);
                this.children[2].updateBounds(minX, midY, minZ, midX, maxY, midZ);
                this.children[3].updateBounds(midX, midY, minZ, maxX, maxY, midZ);
                this.children[4].updateBounds(minX, minY, midZ, midX, midY, maxZ);
                this.children[5].updateBounds(midX, minY, midZ, maxX, midY, maxZ);
                this.children[6].updateBounds(minX, midY, midZ, midX, maxY, maxZ);
                this.children[7].updateBounds(midX, midY, midZ, maxX, maxY, maxZ);
            }
        }

        cullWithFrustum(frustum) {
            // Fast bounding sphere rejection prunes entire subtree immediately
            if (!frustum.intersectsSphere(this.sphere)) {
                this.markHidden();
                return;
            }
            if (!frustum.intersectsBox(this.box)) {
                this.markHidden();
                return;
            }

            this.isVisible = true;
            if (this.children) {
                for (let i = 0; i < 8; i++) {
                    this.children[i].cullWithFrustum(frustum);
                }
            }
        }

        markHidden() {
            this.isVisible = false;
            if (this.children) {
                for (let i = 0; i < 8; i++) {
                    this.children[i].markHidden();
                }
            }
        }

        isPointInFrustum(x, y, z) {
            if (!this.isVisible) return false;
            if (!this.box.containsPoint(_scratchVec3.set(x, y, z))) return false;
            if (!this.children) return this.isVisible;

            for (let i = 0; i < 8; i++) {
                if (this.children[i].isPointInFrustum(x, y, z)) {
                    return true;
                }
            }
            return false;
        }
    }

    class VegetationHierarchicalOctree {
        constructor() {
            this.root = new HierarchicalOctreeNode(-900, -30, -900, 900, 250, 900, 0, 3);
            this.cameraFrustum = new THREE.Frustum();
            this.projMatrix = new THREE.Matrix4();
            this.lastRootX = -99999;
            this.lastRootZ = -99999;
        }

        update(cam, playerX, playerZ, maxDist = treeDist) {
            if (!cam) return;
            this.projMatrix.multiplyMatrices(cam.projectionMatrix, cam.matrixWorldInverse);
            this.cameraFrustum.setFromProjectionMatrix(this.projMatrix);

            const step = 80;
            const rx = Math.floor(playerX / step) * step;
            const rz = Math.floor(playerZ / step) * step;

            if (Math.abs(rx - this.lastRootX) >= step || Math.abs(rz - this.lastRootZ) >= step) {
                this.root.updateBounds(rx - maxDist, -30, rz - maxDist, rx + maxDist, 220, rz + maxDist);
                this.lastRootX = rx;
                this.lastRootZ = rz;
            }

            // Hierarchical frustum traversal
            this.root.cullWithFrustum(this.cameraFrustum);
        }

        isPointInViewFrustum(x, y, z) {
            return this.root.isPointInFrustum(x, y, z);
        }
    }

    // GLB Pine Tree Loader — Merged Single Draw Call

    // Merges Bark + Leaves primitives into ONE geometry with vertex colors.
    // 1 InstancedMesh = 1 draw call per tree slot (not 2).

    function applyGLBPineTree(gltf, targetInstancedMeshes, targetHeight) {
        // GLTFLoader creates separate THREE.Mesh per primitive
        const childMeshes = [];
        gltf.scene.traverse((child) => {
            if (child.isMesh) childMeshes.push(child);
        });
        if (childMeshes.length === 0) return;

        // Compute overall bounding box for uniform scaling
        const bbox = new THREE.Box3();
        childMeshes.forEach(m => {
            m.geometry.computeBoundingBox();
            bbox.expandByObject(m);
        });
        const modelHeight = bbox.max.y - bbox.min.y;
        const sc = modelHeight > 0 ? (targetHeight / modelHeight) : 1.0;
        const offsetY = -bbox.min.y;

        // Colors for each primitive
        const partColors = [
            new THREE.Color(0x8B6B4A),  // [0] Bark — warm brown
            new THREE.Color(0x4CAF50),  // [1] Leaves — bright green
        ];

        // Scale each geometry and stamp vertex colors
        const coloredGeos = childMeshes.map((m, idx) => {
            const g = m.geometry.clone();
            g.translate(0, offsetY, 0);
            g.scale(sc, sc, sc);

            // Remove any existing COLOR_0 attribute from GLB
            if (g.attributes.color) g.deleteAttribute('color');

            // Stamp solid vertex color for this part
            const vertCount = g.attributes.position.count;
            const colors = new Float32Array(vertCount * 3);
            const c = partColors[Math.min(idx, partColors.length - 1)];
            for (let i = 0; i < vertCount; i++) {
                colors[i * 3]     = c.r;
                colors[i * 3 + 1] = c.g;
                colors[i * 3 + 2] = c.b;
            }
            g.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // Ensure indexed geometry for merge compatibility
            if (!g.index) {
                const indices = new Uint32Array(vertCount);
                for (let i = 0; i < vertCount; i++) indices[i] = i;
                g.setIndex(new THREE.BufferAttribute(indices, 1));
            }

            g.computeBoundingBox();
            g.computeBoundingSphere();
            return g;
        });

        // Merge all primitives into a single geometry
        const mergedGeom = BufferGeometryUtils.mergeGeometries(coloredGeos, false);
        if (!mergedGeom) return;
        mergedGeom.computeBoundingBox();
        mergedGeom.computeBoundingSphere();

        // Light model for distant trees: bark/branches (most of the triangles) replaced by a 5-sided trunk
        const trunk = new THREE.CylinderGeometry(targetHeight * 0.022, targetHeight * 0.035, targetHeight * 0.5, 5, 1, true);
        trunk.translate(0, targetHeight * 0.25, 0);
        const trunkColors = new Float32Array(trunk.attributes.position.count * 3);
        for (let i = 0; i < trunkColors.length; i += 3) {
            trunkColors[i] = partColors[0].r; trunkColors[i + 1] = partColors[0].g; trunkColors[i + 2] = partColors[0].b;
        }
        trunk.setAttribute('color', new THREE.BufferAttribute(trunkColors, 3));
        const liteGeom = coloredGeos.length > 1
            ? BufferGeometryUtils.mergeGeometries([trunk, ...coloredGeos.slice(1)], false)
            : null;
        if (liteGeom) { liteGeom.computeBoundingBox(); liteGeom.computeBoundingSphere(); }

        targetInstancedMeshes.forEach(instMesh => {
            instMesh.geometry = liteGeom || mergedGeom;
            instMesh.material = matTree;
            if (instMesh.userData.near) instMesh.userData.near.geometry = mergedGeom;
            instMesh.instanceColor = null;
        });
    }

            if (this.audioCtx.state === 'suspended' && shouldPlay) this.audioCtx.resume().catch(() => {});
            this.clock += dt;
            const fadeRate = shouldPlay ? 1.5 : 2.5;
            this.currentFade += (this.targetFade - this.currentFade) * Math.min(dt * fadeRate, 1.0);
            if (!this.isRunning && this.currentFade > 0.01) this._startNodes();
            let targetRpm = 0.35;
            if (isPaused || isBraking) { targetRpm = 0.05; }
            else if (isBoosting) { targetRpm = 1.0; }
            else if (speed !== undefined) { targetRpm = 0.15 + Math.max(0, Math.min(1, (speed - 5) / 25)) * 0.4; }
            const rpmLerp = isBoosting ? 4.5 : 2.5;
            this.currentRpm += (targetRpm - this.currentRpm) * Math.min(dt * rpmLerp, 1.0);
            if (!this.isRunning) return;
            const t = this.audioCtx.currentTime, sm = 0.06;
            const distRatio = Math.max(4.0, camDist) / 12.0;
            const distGain = Math.min(1.85, Math.max(0.12, 1.0 / Math.pow(distRatio, 0.65)));
            const distFS   = Math.min(1.4,  Math.max(0.38, 1.0 / Math.pow(distRatio, 0.38)));
            const rpmJitter = Math.sin(this.clock * 0.9) * 0.022 + Math.sin(this.clock * 2.8) * 0.014 + Math.sin(this.clock * 6.3) * 0.007;
            const maneuverLoad = Math.min(0.18, (Math.abs(turnRate) + Math.abs(pitchRate)) * 0.12);
            const rpm = Math.max(0.02, Math.min(1.0, this.currentRpm + rpmJitter + maneuverLoad));
            const engineFreq = 45 + rpm * 54;
            const pulseFreq  = 19 + rpm * 25 + Math.sin(this.clock * 1.7) * 1.5;
            const detune = 0.4 + Math.sin(this.clock * 0.5) * 0.6;
            const airTurb = Math.sin(this.clock * 2.1) * 22 + Math.sin(this.clock * 5.4) * 14;
            const cutoff  = Math.max(80,  (175 + rpm * 125) * distFS);
            const nCutoff = Math.max(100, (215 + rpm * 120 + airTurb) * distFS);
            if (this.osc1) this.osc1.frequency.setTargetAtTime(engineFreq, t, sm);
            if (this.osc2) this.osc2.frequency.setTargetAtTime(engineFreq * 1.018 + detune, t, sm);
            if (this.subOsc) this.subOsc.frequency.setTargetAtTime(engineFreq * 0.5, t, sm);
            if (this.lfoOsc) this.lfoOsc.frequency.setTargetAtTime(pulseFreq, t, sm);
            if (this.cylinderFilter) this.cylinderFilter.frequency.setTargetAtTime(cutoff, t, sm);
            if (this.noiseFilter) this.noiseFilter.frequency.setTargetAtTime(nCutoff, t, sm);
            const pauseMul = isPaused ? 0.15 : 1.0;
            const dynGain  = (0.026 + rpm * 0.022) * (this.volume / 0.038) * distGain;
            if (this.masterGain) this.masterGain.gain.setTargetAtTime(dynGain * this.currentFade * pauseMul, t, sm);
        }
        destroy() {
            this.setActive(false); this._stopNodes();
            if (this.masterGain) { try { this.masterGain.disconnect(); } catch(e) {} }
        }
    }

    function createReverb() {
        const length = audioCtx.sampleRate * (LOW_GFX ? 0.5 : 4);
        const impulse = audioCtx.createBuffer(2, length, audioCtx.sampleRate);
        for (let i = 0; i < 2; i++) {
            const channel = impulse.getChannelData(i);
            for (let j = 0; j < length; j++) {
                channel[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / length, 3);
            }
        }
        const convolver = audioCtx.createConvolver();
        convolver.buffer = impulse;
        return convolver;
    }

    function playNote(freq, time, duration, oscType, isPad = false) {
        const osc = audioCtx.createOscillator();
        const env = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();

        osc.type = oscType;
        osc.frequency.value = freq;

        filter.type = 'lowpass';

        if (isPad) {
            filter.frequency.value = 600;
            env.gain.setValueAtTime(0, time);
            env.gain.linearRampToValueAtTime(0.04, time + duration * 0.4);
            env.gain.linearRampToValueAtTime(0.001, time + duration);
        } else {
            filter.frequency.setValueAtTime(1200, time);
            filter.frequency.exponentialRampToValueAtTime(400, time + duration);
            env.gain.setValueAtTime(0, time);
            env.gain.linearRampToValueAtTime(0.1, time + 0.05); // Quick attack
            env.gain.exponentialRampToValueAtTime(0.001, time + duration);
        }

        osc.connect(filter);
        filter.connect(env);
        env.connect(musicGain);

        osc.start(time);
        osc.stop(time + duration);
    }

    function scheduleNotes() {
        if (!isMusicPlaying || !audioCtx) return;
        const track = tracks[currentTrack];

        // Prevent massive scheduling clump if tab was inactive
        if (nextNoteTime < audioCtx.currentTime - 0.5) {
            nextNoteTime = audioCtx.currentTime + 0.1;
        }

        while (nextNoteTime < audioCtx.currentTime + 0.2) {

            // On chord change
            if (sequenceTime % track.speed === 0) {
                const chord = track.chords[chordIndex % track.chords.length];

                // Play pad for the chord
                chord.forEach(freq => {
                    playNote(freq / 2, nextNoteTime, track.speed / 1000 * 1.5, track.padOsc, true);
                });
            }

            const chord = track.chords[chordIndex % track.chords.length];
            const pattern = arpPatterns[chordIndex % arpPatterns.length];

            // Music box arpeggio step
            if (sequenceTime % track.stepSpeed === 0) {
                const arpFreq = chord[pattern[arpIndex % pattern.length]] * 2; // Up one octave
                playNote(arpFreq, nextNoteTime, track.stepSpeed / 1000 * 2.0, track.leadOsc, false);
                arpIndex++;

                // Occasional slow melody note
                if (Math.random() > 0.7) {
                    const melFreq = chord[Math.floor(Math.random() * chord.length)] * 4; // Up two octaves
                    playNote(melFreq, nextNoteTime, track.speed / 1000 * 0.8, track.leadOsc, false);
                }
            }

            // Timing
            nextNoteTime += track.stepSpeed / 1000;
            sequenceTime += track.stepSpeed;

            if (sequenceTime >= track.speed) {
                sequenceTime = 0;
                chordIndex++;
                arpIndex = 0;
            }
        }
        musicTimerID = setTimeout(scheduleNotes, 50);
    }

                return;
            }
            const ratio = newDist / lastCloudDistance;
            lastCloudDistance = newDist;
            const m = new THREE.Matrix4(), p = new THREE.Vector3(), q = new THREE.Quaternion(), sc = new THREE.Vector3();
            const px = typeof playerGrp !== 'undefined' ? playerGrp.position.x : 0;
            const pz = typeof playerGrp !== 'undefined' ? playerGrp.position.z : 0;
            const totalCloudSlots = (instClouds.instanceMatrix ? instClouds.instanceMatrix.count : instClouds.count);
            for (let i = 0; i < totalCloudSlots; i++) {
                instClouds.getMatrixAt(i, m);
                m.decompose(p, q, sc);
                if (p.y > -4000) {
                    p.x = px + (p.x - px) * ratio;
                    p.z = pz + (p.z - pz) * ratio;
                    m.compose(p, q, sc);
                    instClouds.setMatrixAt(i, m);
                }
            }
            instClouds.instanceMatrix.needsUpdate = true;
            if (typeof instWispyClouds !== 'undefined') {
                const totalWispySlots = (instWispyClouds.instanceMatrix ? instWispyClouds.instanceMatrix.count : instWispyClouds.count);
                for (let i = 0; i < totalWispySlots; i++) {
                    instWispyClouds.getMatrixAt(i, m);
                    m.decompose(p, q, sc);
                    if (p.y > -4000) {
                        p.x = px + (p.x - px) * ratio;
                        p.z = pz + (p.z - pz) * ratio;
                        m.compose(p, q, sc);
                        instWispyClouds.setMatrixAt(i, m);
                    }
                }
                instWispyClouds.instanceMatrix.needsUpdate = true;
            }
        }

        function updateLowCloudAltitude(newAlt) {
            const m = new THREE.Matrix4(), p = new THREE.Vector3(), q = new THREE.Quaternion(), sc = new THREE.Vector3();
            const totalCloudSlots = (instClouds.instanceMatrix ? instClouds.instanceMatrix.count : instClouds.count);
            for (let i = 0; i < totalCloudSlots; i++) {
                instClouds.getMatrixAt(i, m);
                m.decompose(p, q, sc);
                if (p.y > -4000) {
                    p.y = newAlt + (lowAltitudeOffsets[i] || 0);
                    m.compose(p, q, sc);
                    instClouds.setMatrixAt(i, m);
                }
            }
            instClouds.instanceMatrix.needsUpdate = true;
            if (typeof instWispyClouds !== 'undefined') {
                const totalWispySlots = (instWispyClouds.instanceMatrix ? instWispyClouds.instanceMatrix.count : instWispyClouds.count);
                for (let i = 0; i < totalWispySlots; i++) {
                    instWispyClouds.getMatrixAt(i, m);
                    m.decompose(p, q, sc);
                    if (p.y > -4000) {
                        p.y = (newAlt - 40) + (lowAltitudeOffsets[i % CLOUD_COUNT] || 0);
                        m.compose(p, q, sc);
                        instWispyClouds.setMatrixAt(i, m);
                    }
                }
                instWispyClouds.instanceMatrix.needsUpdate = true;
            }
        }

        let lastHighCloudDistance = params.cloudsHighDistance || 3600;
        function updateHighCloudDistance(newDist) {
            if (!lastHighCloudDistance || lastHighCloudDistance === newDist) {
                lastHighCloudDistance = newDist;
                return;
            }
            const ratio = newDist / lastHighCloudDistance;
            lastHighCloudDistance = newDist;
            const m = new THREE.Matrix4(), p = new THREE.Vector3(), q = new THREE.Quaternion(), sc = new THREE.Vector3();
            const px = typeof playerGrp !== 'undefined' ? playerGrp.position.x : 0;
            const pz = typeof playerGrp !== 'undefined' ? playerGrp.position.z : 0;
            const totalSlots = (instHighClouds.instanceMatrix ? instHighClouds.instanceMatrix.count : instHighClouds.count);
            for (let i = 0; i < totalSlots; i++) {
                instHighClouds.getMatrixAt(i, m);
                m.decompose(p, q, sc);
                p.x = px + (p.x - px) * ratio;
                p.z = pz + (p.z - pz) * ratio;
                m.compose(p, q, sc);
                instHighClouds.setMatrixAt(i, m);
            }
            instHighClouds.instanceMatrix.needsUpdate = true;
        }

        let lastGiantCloudDistance = params.cloudsGiantDistance || 4200;
        function updateGiantCloudDistance(newDist) {
            if (!lastGiantCloudDistance || lastGiantCloudDistance === newDist) {
                lastGiantCloudDistance = newDist;
                return;
            }
            const ratio = newDist / lastGiantCloudDistance;
            lastGiantCloudDistance = newDist;
            const m = new THREE.Matrix4(), p = new THREE.Vector3(), q = new THREE.Quaternion(), sc = new THREE.Vector3();
            const px = typeof playerGrp !== 'undefined' ? playerGrp.position.x : 0;
            const pz = typeof playerGrp !== 'undefined' ? playerGrp.position.z : 0;
            megaMeshes.forEach(mesh => {
                const totalSlots = (mesh.instanceMatrix ? mesh.instanceMatrix.count : mesh.count);
                for (let i = 0; i < totalSlots; i++) {
                    mesh.getMatrixAt(i, m);
                    m.decompose(p, q, sc);
                    p.x = px + (p.x - px) * ratio;
                    p.z = pz + (p.z - pz) * ratio;
                    m.compose(p, q, sc);
                    mesh.setMatrixAt(i, m);
                }
                mesh.instanceMatrix.needsUpdate = true;
            });
        }

        const cloudFolder = gui.addFolder('Clouds');

        // 1. Low Nearby Clouds
        const lowFolder = cloudFolder.addFolder('Low Clouds (Nearby)');
        lowFolder.add(params, 'cloudsLow').name('Show Low Clouds').onChange(v => { instClouds.visible = v; });
        lowFolder.add(params, 'cloudsLowCount', 0, 250, 1).name('How Many').onChange(v => setCloudCount(instClouds, v));
        lowFolder.add(params, 'cloudsLowSize', 0.2, 3, 0.05).name('Scale / Size').onChange(v => setCloudSize(instClouds, v));
        lowFolder.add(params, 'cloudsLowAltitude', -300, 2000, 5).name('Height (from Ground)').onChange(v => {
            updateLowCloudAltitude(v);
        }).listen();
        lowFolder.add(params, 'cloudsLowDistance', 100, 4000, 25).name('Distance from Camera').onChange(v => {
            updateLowCloudDistance(v);
        }).listen();
        lowFolder.add(params, 'cloudsLowOpacity', 0.1, 1.0, 0.02).name('Opacity').onChange(v => {
            matCloud.opacity = v;
            if (matCloud.userData.shader) matCloud.userData.shader.uniforms.uCloudOpacity.value = v;
        });
        lowFolder.add(params, 'cloudsLowBottomBlur', 0.0, 0.9, 0.01).name('Bottom Blur / Feather').onChange(v => {
            if (matCloud.userData.shader) matCloud.userData.shader.uniforms.uBottomBlur.value = v;
        });
        lowFolder.addColor(params, 'cloudsLowColor').name('Color Tint');

        // 2. Distant Cumulus Towers
        const highFolder = cloudFolder.addFolder('Distant Cumulus Towers');
        highFolder.add(params, 'cloudsHigh').name('Show Towers').onChange(v => { instHighClouds.visible = v; });
        highFolder.add(params, 'cloudsHighCount', 0, 28, 1).name('How Many').onChange(v => setCloudCount(instHighClouds, v));
        highFolder.add(params, 'cloudsHighSize', 0.2, 3, 0.05).name('Scale / Size').onChange(v => setCloudSize(instHighClouds, v));
        highFolder.add(params, 'cloudsHighAltitude', -500, 500, 2).name('Altitude / Height').onChange(v => {
            const m = new THREE.Matrix4(), p = new THREE.Vector3(), q = new THREE.Quaternion(), sc = new THREE.Vector3();
            const totalSlots = instHighClouds.instanceMatrix ? instHighClouds.instanceMatrix.count : instHighClouds.count;
            for (let i = 0; i < totalSlots; i++) {
                instHighClouds.getMatrixAt(i, m);
                m.decompose(p, q, sc);
                p.y = v + (highAltitudeOffsets[i] || 0);
                m.compose(p, q, sc);
                instHighClouds.setMatrixAt(i, m);
            }
            instHighClouds.instanceMatrix.needsUpdate = true;
        });
        highFolder.add(params, 'cloudsHighDistance', 800, 8000, 25).name('Distance from Camera').onChange(v => {
            updateHighCloudDistance(v);
        }).listen();
        highFolder.add(params, 'cloudsHighOpacity', 0.1, 1.0, 0.02).name('Opacity').onChange(v => {
            highCloudMat.opacity = v;
            if (highCloudMat.userData && highCloudMat.userData.shader && highCloudMat.userData.shader.uniforms.uCloudOpacity) {
                highCloudMat.userData.shader.uniforms.uCloudOpacity.value = v;
            }
        });
        highFolder.add(params, 'cloudsHighBottomBlur', 0.05, 0.8, 0.02).name('Bottom Blur / Feather').onChange(v => {
            if (highCloudMat.userData && highCloudMat.userData.shader && highCloudMat.userData.shader.uniforms.uBottomBlur) {
                highCloudMat.userData.shader.uniforms.uBottomBlur.value = v;
            }
        });
        highFolder.addColor(params, 'cloudsHighColor').name('Color Tint');

        // 3. Distant Horizon Banks
        const giantFolder = cloudFolder.addFolder('Distant Horizon Banks');
        giantFolder.add(params, 'cloudsGiant').name('Show Horizon Banks').onChange(v => { instMegaClouds.visible = v; });
        giantFolder.add(params, 'cloudsGiantCount', 0, 28, 1).name('How Many').onChange(v => setCloudCount(instMegaClouds, v));
        giantFolder.add(params, 'cloudsGiantSize', 0.2, 3, 0.05).name('Scale / Size').onChange(v => setCloudSize(instMegaClouds, v));
        giantFolder.add(params, 'cloudsGiantAltitude', -500, 500, 2).name('Altitude / Height').onChange(v => {
            const m = new THREE.Matrix4(), p = new THREE.Vector3(), q = new THREE.Quaternion(), sc = new THREE.Vector3();
            megaMeshes.forEach((mesh, vIdx) => {
                const totalSlots = mesh.instanceMatrix ? mesh.instanceMatrix.count : mesh.count;
                for (let i = 0; i < totalSlots; i++) {
                    mesh.getMatrixAt(i, m);
                    m.decompose(p, q, sc);
                    const cloudIdx = vIdx * MEGA_PER_VARIANT + i;
                    p.y = v + (cloudAltitudeOffsets[cloudIdx] || 0);
                    m.compose(p, q, sc);
                    mesh.setMatrixAt(i, m);
                }
                mesh.instanceMatrix.needsUpdate = true;
            });
        });
        giantFolder.add(params, 'cloudsGiantDistance', 1000, 10000, 25).name('Distance from Camera').onChange(v => {
            updateGiantCloudDistance(v);
        }).listen();
        giantFolder.add(params, 'cloudsGiantOpacity', 0.1, 1.0, 0.02).name('Opacity').onChange(v => {
            megaCloudMat.opacity = v;
            if (megaCloudMat.userData && megaCloudMat.userData.shader && megaCloudMat.userData.shader.uniforms.uCloudOpacity) {
                megaCloudMat.userData.shader.uniforms.uCloudOpacity.value = v;
            }
        });
        giantFolder.add(params, 'cloudsGiantBottomBlur', 0.05, 0.8, 0.02).name('Bottom Blur / Feather').onChange(v => {
            if (megaCloudMat.userData && megaCloudMat.userData.shader && megaCloudMat.userData.shader.uniforms.uBottomBlur) {
                megaCloudMat.userData.shader.uniforms.uBottomBlur.value = v;
            }
        });
        giantFolder.addColor(params, 'cloudsGiantColor').name('Color Tint');

        // 4. Lighting & Ghibli Shading Colors
        const lightFolder = cloudFolder.addFolder('Lighting & Shading');
        lightFolder.addColor(params, 'cloudsDayLitColor').name('Day Sunlit Tops');
        lightFolder.addColor(params, 'cloudsDayShadowColor').name('Day Sky Shadows');
        lightFolder.addColor(params, 'cloudsNightLitColor').name('Night Moonlit Tops');
        lightFolder.addColor(params, 'cloudsNightShadowColor').name('Night Sky Shadows');

        // Tree Editor
        let oldTreeColors = [...treeGreenVariations];
        function updateTreeColorForIndex(idx, newHex) {
            const oldHex = oldTreeColors[idx];
            const newHexVal = parseInt(newHex.replace('#',''), 16);
            if (oldHex === newHexVal) return;
            treeGreenVariations[idx] = newHexVal;
            const oldColor = new THREE.Color(oldHex);
            const newColor = new THREE.Color(newHexVal);
            const temp = new THREE.Color();

            treeMeshes.forEach(mesh => {
                const count = mesh.maxCount || mesh.count;
                for (let i = 0; i < count; i++) {
                    mesh.getColorAt(i, temp);
                    if (Math.abs(temp.r - oldColor.r) < 0.01 && Math.abs(temp.g - oldColor.g) < 0.01 && Math.abs(temp.b - oldColor.b) < 0.01) {
                        mesh.setColorAt(i, newColor);
                    }
                }
                if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
            });
            oldTreeColors[idx] = newHexVal;
        }

        const treeFolder = gui.addFolder('Trees');
        window.treeFolder = treeFolder;
        treeFolder.add(params, 'treeScale', 0.5, 8.0).name('Tree Scale').onChange(v => {
            treeUniforms.uTreeScale.value = v;
            if (matTree.userData.shader && matTree.userData.shader.uniforms.uTreeScale) {
                matTree.userData.shader.uniforms.uTreeScale.value = v;
            }
        });
        treeFolder.addColor(params, 'treeColor0').name('Color 1').onChange(v => updateTreeColorForIndex(0, v));
        treeFolder.addColor(params, 'treeColor1').name('Color 2').onChange(v => updateTreeColorForIndex(1, v));
        treeFolder.addColor(params, 'treeColor2').name('Color 3').onChange(v => updateTreeColorForIndex(2, v));
        treeFolder.addColor(params, 'treeColor3').name('Color 4').onChange(v => updateTreeColorForIndex(3, v));
        treeFolder.addColor(params, 'treeColor4').name('Color 5').onChange(v => updateTreeColorForIndex(4, v));
        treeFolder.addColor(params, 'treeColor5').name('Color 6').onChange(v => updateTreeColorForIndex(5, v));
        treeFolder.addColor(params, 'treeColor6').name('Color 7').onChange(v => updateTreeColorForIndex(6, v));

        // ==========================================
        // DEV & SYSTEM
        // ==========================================
        const sysFolder = gui.addFolder('Dev & System');

        // Editor launchers (moved from old "Editor" folder)
        sysFolder.add({ openTerrainEditor: () => {
            const btn = document.getElementById('editor-toggle');
            if (btn) btn.click();
        }}, 'openTerrainEditor').name('Terrain Editor');
        sysFolder.add({ openCrystalEditor: () => {
            const crystalEditor = document.getElementById('crystal-editor');
            if (crystalEditor) crystalEditor.style.display = crystalEditor.style.display === 'none' ? 'block' : 'none';
        }}, 'openCrystalEditor').name('Crystal Editor');

        // 20-seed acceptance test (moved from World folder)
        sysFolder.add(worldParams, 'runAcceptanceTests').name('Run 20-Seed Tests');

        // Show / Hide toggles (moved from old "Debug Render" folder)
        const debugFolder = sysFolder.addFolder('Show / Hide');
        debugFolder.add(params, 'showTerrain').name('Terrain').onChange(v => { terrain.visible = v; });
        debugFolder.add(params, 'showWater').name('Water').onChange(v => { waterMesh.visible = v; });
        debugFolder.add(params, 'showTrees').name('Trees').onChange(v => { [...treeMeshes, ...treeNearMeshes].forEach(m => m.visible = v); });
        debugFolder.add(params, 'showClouds').name('Clouds').onChange(v => { instClouds.visible = v; if(typeof instHighClouds !== 'undefined') instHighClouds.visible = v; if(typeof instMegaClouds !== 'undefined') instMegaClouds.visible = v; });
        debugFolder.add(params, 'showBirds').name('Birds').onChange(v => { if(typeof instBirds !== 'undefined') instBirds.visible = v; if(typeof flockGrp !== 'undefined') flockGrp.visible = v; });
        debugFolder.add(params, 'showFogPlanes').name('Fog Planes').onChange(v => { if(typeof window.fogGroup !== 'undefined') window.fogGroup.visible = v; });
        debugFolder.add(params, 'showCrystals').name('Crystals').onChange(v => { instCrystals.visible = v; });
        debugFolder.add(params, 'showMap').name('World Map').onChange(v => { const f = document.getElementById('map-frame'); if(f) f.style.display = v ? '' : 'none'; const el = document.getElementById('world-map'); if(el) el.classList.toggle('map-no-compass', !v); });
        debugFolder.add(params, 'showGUI').name('Hide Panel').onChange(v => toggleGUI(v));

        // Save & Reset
        sysFolder.add({
            saveSettings: () => {
                const data = gui.save();
                localStorage.setItem('flightSettings', JSON.stringify(data));
                const prevTitle = 'Dev & System';
                sysFolder.title('Saved!');
                setTimeout(() => sysFolder.title(prevTitle), 1500);
            }
        }, 'saveSettings').name('Save All Settings');

        sysFolder.add({
            resetSettings: () => {
                localStorage.removeItem('flightSettings');
                localStorage.removeItem('gfxQuality');
                location.reload();
            }
        }, 'resetSettings').name('Reset to Default');

        // Load settings if they exist
        try {
            const savedData = localStorage.getItem('flightSettings');
            if (savedData) gui.load(JSON.parse(savedData));
        } catch(e) {
            console.error('Failed to load settings', e);
        }

        // Top-Left Save Menu (Wanderlust-II per-biome and global scene saves)
        const saveGui = new GUI({
            title: 'Per-Biome Saves',
            autoPlace: false,
            width: 250
        });
        document.body.appendChild(saveGui.domElement);
        saveGui.domElement.classList.add('save-gui-menu');
        saveGui.domElement.id = 'top-save-menu';
        saveGui.domElement.style.display = 'none';

        function showVisualToast(msg) {
            let toast = document.getElementById('visual-toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'visual-toast';
                toast.style.cssText = 'position:fixed;top:68px;left:50%;transform:translateX(-50%);background:rgba(15,20,28,0.94);color:#38bdf8;border:1px solid rgba(56,189,248,0.4);padding:8px 18px;border-radius:20px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,0.5);z-index:9999;pointer-events:none;transition:opacity 0.25s ease, transform 0.25s ease;';
                document.body.appendChild(toast);
            }
            toast.textContent = msg;
            toast.style.opacity = '1';
            toast.style.transform = 'translateX(-50%) translateY(0)';
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) translateY(-8px)';
            }, 2200);
        }

        function positionSaveGui() {
            const btn = document.getElementById('top-save-setting-btn');
            if (btn && saveGui && saveGui.domElement) {
                const rect = btn.getBoundingClientRect();
                saveGui.domElement.style.left = `${Math.max(10, Math.round(rect.left))}px`;
                saveGui.domElement.style.top = `${Math.round(rect.bottom + 8)}px`;
            }
        }
        window.addEventListener('resize', positionSaveGui);

        const saveActions = {
            saveActive: () => {
                const data = gui.save();
                const curB = (typeof currentBiome !== 'undefined' && currentBiome) ? currentBiome.name : 'Current';
                localStorage.setItem('flight_biome_' + curB, JSON.stringify(data));
                showVisualToast('Saved preset for: ' + curB);
                saveGui.domElement.style.display = 'none';
            },
            resetActive: () => {
                const curB = (typeof currentBiome !== 'undefined' && currentBiome) ? currentBiome.name : 'Current';
                localStorage.removeItem('flight_biome_' + curB);
                showVisualToast('Reset preset for: ' + curB);
                saveGui.domElement.style.display = 'none';
            },
            saveAll: () => {
                const data = gui.save();
                localStorage.setItem('flightSettings', JSON.stringify(data));
                showVisualToast('All settings saved to disk');
                saveGui.domElement.style.display = 'none';
            },
            resetAll: () => {
                if (confirm('Are you sure you want to reset all settings to default?')) {
                    localStorage.removeItem('flightSettings');
                    localStorage.removeItem('gfxQuality');
                    location.reload();
                }
                saveGui.domElement.style.display = 'none';
            },
            saveGlobal: () => {
                const data = gui.save();
                localStorage.setItem('flightSettings', JSON.stringify(data));
                showVisualToast('Global preset saved');
                saveGui.domElement.style.display = 'none';
            },
            loadFile: () => {
                try {
                    const saved = localStorage.getItem('flightSettings');
                    if (saved) {
                        gui.load(JSON.parse(saved));
                        showVisualToast('Settings loaded from disk');
                    } else {
                        showVisualToast('No saved preset found');
                    }
                } catch(e) {
                    console.error(e);
                }
                saveGui.domElement.style.display = 'none';
            }
        };

        saveGui.add(saveActions, 'saveActive').name('Save Current Biome');
        saveGui.add(saveActions, 'resetActive').name('Reset Current Biome');
        saveGui.add(saveActions, 'saveAll').name('Save All Biomes');
        saveGui.add(saveActions, 'resetAll').name('Reset All Biomes');

        const globalFolder = saveGui.addFolder('Global Scene Saves');
        globalFolder.add(saveActions, 'saveGlobal').name('Save Global Preset');
        globalFolder.add(saveActions, 'loadFile').name('Load File from Disk');
        globalFolder.open();

        const topSaveBtn = document.getElementById('top-save-setting-btn');
        if (topSaveBtn) {
            topSaveBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const isOpen = saveGui.domElement.style.display !== 'none';
                if (isOpen) {
                    saveGui.domElement.style.display = 'none';
                } else {
                    positionSaveGui();
                    saveGui.domElement.style.display = '';
                }
            });

            document.addEventListener('click', (e) => {
                if (!e.target.closest('#top-save-setting-btn') && !e.target.closest('.save-gui-menu')) {
                    saveGui.domElement.style.display = 'none';
                }
            });
        }

        const topSaveAllBtn = document.getElementById('top-save-all-btn');
        if (topSaveAllBtn) {
            topSaveAllBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                saveActions.saveAll();
            });
        }

        const topTreeBtn = document.getElementById('top-tree-btn');
        if (topTreeBtn) {
            topTreeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (typeof toggleGUI === 'function') toggleGUI(true);
                if (window.treeFolder) {
                    gui.foldersRecursive().forEach(f => f.close());
                    window.treeFolder.open();
                    window.treeFolder.domElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            });
        }

        window.addEventListener('keydown', (e) => {
            if (e.target && ['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
            if (e.code === 'KeyT') {
                const btn = document.getElementById('top-tree-btn');
                if (btn) btn.click();
            }
        });

        isInitializingGui = false;
        gui.close();
    }

    animate();
  </script>
</body>
</html>
