<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Low-Poly Terrain Sandbox</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #14141d;
      font-family: monospace;
      color: #e2e8f0;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #ui-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(18, 19, 27, 0.95);
      border: 1px solid #4a5568;
      padding: 12px;
      font-size: 12px;
      z-index: 10;
      width: 330px;
      max-height: 94vh;
      overflow-y: auto;
    }
    h2 {
      margin: 0 0 4px 0;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #f6ad55;
    }
    .subtitle {
      font-size: 11px;
      color: #a0aec0;
      margin-bottom: 8px;
    }
    .section-title {
      margin: 10px 0 4px 0;
      padding-bottom: 2px;
      border-bottom: 1px solid #2d3748;
      font-weight: bold;
      color: #90cdf4;
      font-size: 11px;
      text-transform: uppercase;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 4px 0;
    }
    .row label {
      font-size: 11px;
    }
    input[type="range"] {
      width: 125px;
    }
    button {
      background: #2d3748;
      color: #f7fafc;
      border: 1px solid #4a5568;
      padding: 5px 8px;
      font-family: monospace;
      font-size: 11px;
      cursor: pointer;
      margin: 2px 0;
      width: 100%;
    }
    button:hover {
      background: #4a5568;
    }
    button.active {
      background: #3182ce;
      border-color: #63b3ed;
      font-weight: bold;
    }
    .btn-group {
      display: flex;
      gap: 4px;
      margin: 4px 0;
    }
    .btn-group button {
      width: 50%;
    }
    .preset-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin: 4px 0;
    }
    .preset-grid button {
      margin: 0;
      padding: 4px;
      font-size: 10px;
    }
    #status-bar {
      margin-top: 8px;
      padding: 6px;
      background: #101118;
      border: 1px solid #2d3748;
      font-size: 11px;
      color: #cbd5e0;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <div id="ui-panel">
    <h2>Low-Poly Terrain Sandbox</h2>
    <div class="subtitle">E:\X Flight\Surgery\Trees Terrains</div>

    <div class="section-title">View Mode (Instant A/B Compare)</div>
    <div class="btn-group">
      <button id="btn-show-model">3D Model (Reference)</button>
      <button id="btn-show-procedural" class="active">Procedural Mesh</button>
    </div>

    <div class="section-title">Camera Angles (From Screenshots)</div>
    <div class="preset-grid">
      <button id="cam-view-1">1: Right Towers</button>
      <button id="cam-view-2">2: Front Valley</button>
      <button id="cam-view-3">3: Bird's Eye</button>
      <button id="cam-view-4">4: Left Bank & Gravel</button>
    </div>
    <button id="btn-auto-rotate">Toggle Auto-Rotate</button>

    <div class="section-title">Display Options</div>
    <div class="row">
      <label>Wireframe:</label>
      <input type="checkbox" id="chk-wireframe">
    </div>
    <div class="row">
      <label>Flat Shading:</label>
      <input type="checkbox" id="chk-flat" checked>
    </div>

    <div class="section-title">Sunset Lighting</div>
    <div class="row">
      <label>Sun Azimuth:</label>
      <input type="range" id="sl-sun-azimuth" min="0" max="360" value="65">
    </div>
    <div class="row">
      <label>Sun Elevation:</label>
      <input type="range" id="sl-sun-elev" min="5" max="85" value="38">
    </div>
    <div class="row">
      <label>Sun Intensity:</label>
      <input type="range" id="sl-sun-intensity" min="0.5" max="6.0" step="0.1" value="3.6">
    </div>
    <div class="row">
      <label>Twilight Fill Level:</label>
      <input type="range" id="sl-amb-intensity" min="0.5" max="4.0" step="0.1" value="2.8">
    </div>

    <div class="section-title">Procedural Seed & Scale</div>
    <div class="row">
      <label>Mountain Scale:</label>
      <input type="range" id="sl-mtn-scale" min="0.7" max="1.4" step="0.05" value="1.0">
    </div>
    <button id="btn-regen-proc">Regenerate Procedural Terrain</button>

    <div id="status-bar">Starting 3D viewer...</div>
  </div>

  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    window.THREE = THREE;

    const container = document.getElementById('canvas-container');
    const statusBar = document.getElementById('status-bar');

    // 1. Scene setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x13131c);
    window.scene = scene;

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    // Default to Front Valley matching Image 2 & 5
    camera.position.set(0.5, 9.0, 28);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0.2, 4.2, -4.0);

    window.camera = camera;
    window.controls = controls;

    // 2. Sunset Lighting setup
    const ambientLight = new THREE.HemisphereLight(0x6b638a, 0x30293b, 2.8);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xff9a38, 3.6);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 1;
    sunLight.shadow.camera.far = 250;
    const shadowDist = 32;
    sunLight.shadow.camera.left = -shadowDist;
    sunLight.shadow.camera.right = shadowDist;
    sunLight.shadow.camera.top = shadowDist;
    sunLight.shadow.camera.bottom = -shadowDist;
    sunLight.shadow.bias = -0.0003;
    scene.add(sunLight);

    const frontFill = new THREE.DirectionalLight(0x635e82, 1.5);
    frontFill.position.set(-25, 20, 25);
    scene.add(frontFill);

    function updateSunPosition() {
      const az = parseFloat(document.getElementById('sl-sun-azimuth').value) * Math.PI / 180;
      const el = parseFloat(document.getElementById('sl-sun-elev').value) * Math.PI / 180;
      const dist = 65;
      sunLight.position.set(
        Math.cos(el) * Math.sin(az) * dist,
        Math.sin(el) * dist,
        Math.cos(el) * Math.cos(az) * dist
      );
    }
    updateSunPosition();

    // 3. Groups for switching views
    const modelGroup = new THREE.Group();
    const proceduralGroup = new THREE.Group();
    scene.add(modelGroup);
    scene.add(proceduralGroup);
    modelGroup.visible = false;
    proceduralGroup.visible = true;
    window.modelGroup = modelGroup;
    window.proceduralGroup = proceduralGroup;

    // 4. Load Reference GLB Model (Normalized to width ~30 to match world coordinate space)
    const gltfLoader = new GLTFLoader();
    gltfLoader.load(
      'models/village_sunset.glb',
      (gltf) => {
        const loadedRoot = gltf.scene;

        const pivot = new THREE.Group();
        pivot.add(loadedRoot);
        loadedRoot.rotation.y = Math.PI;

        const rawBox = new THREE.Box3().setFromObject(loadedRoot);
        const rawSize = rawBox.getSize(new THREE.Vector3());
        const scaleFactor = 30.0 / rawSize.x;
        loadedRoot.scale.setScalar(scaleFactor);

        const box = new THREE.Box3().setFromObject(loadedRoot);
        const center = box.getCenter(new THREE.Vector3());

        loadedRoot.position.x = -center.x;
        loadedRoot.position.y = -box.min.y;
        loadedRoot.position.z = -center.z;

        pivot.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            if (child.material) {
              if (child.geometry.attributes.color) {
                child.material.vertexColors = true;
                if (child.material.color) child.material.color.setRGB(1, 1, 1);
              }
              child.material.flatShading = true;
              child.material.roughness = 0.88;
              child.material.metalness = 0.05;
              child.material.needsUpdate = true;
            }
          }
        });

        modelGroup.add(pivot);
      }
    );

    // =========================================================================
    // 5. TRUE POLYHEDRAL CHISELED LOW-POLY DIORAMA GENERATOR
    // (Precision match to village_sunset.glb reference model)
    // =========================================================================
    const PALETTE = {
      rockBase: new THREE.Color(0x6b67a0),     // Authentic reference slate-purple rock
      rockSun: new THREE.Color(0xdca584),      // Sunlit warm peach-terracotta
      rockMid: new THREE.Color(0x8a7ea3),      // Mid-tone mauve rock
      capCream: new THREE.Color(0xfbe8d3),     // Sunlit ivory peach snowcap
      capShade: new THREE.Color(0xc7b5bd),     // Shaded stone/snow cap
      terraceGrass: new THREE.Color(0xb58e52), // Warm sandstone plate
      terraceGold: new THREE.Color(0xdfa54a),  // Warm ochre yellow terrace plate
      terraceMauve: new THREE.Color(0x7e7099), // Mauve stepping stone plate
      terraceTan: new THREE.Color(0xcca062),   // Sandy tan bank plate
      pebbleGold: new THREE.Color(0xf6c348),   // Glowing golden yellow river pebbles
      pebbleOchre: new THREE.Color(0xdda738),  // Ochre river pebbles
      waterLake: new THREE.Color(0xbcd5e6),    // Reference pale glacial sky-blue water
      waterFoam: new THREE.Color(0xf6faff),    // Pure white waterfall foam
      woodHut: new THREE.Color(0xc49a75),      // Low-poly village hut wood
      roofHut: new THREE.Color(0x8a6358),      // Village hut roof
      treeGreen: new THREE.Color(0x457c86),    // Pine needle teal/green
      pedestal: new THREE.Color(0x383245)      // Soft under-cliff bedrock
    };

    const matSharedRock = new THREE.MeshStandardMaterial({
      vertexColors: true,
      flatShading: true,
      roughness: 0.88,
      metalness: 0.04
    });

    const matWater = new THREE.MeshStandardMaterial({
      color: 0xb5d0e2,
      emissive: new THREE.Color(0x354d60),
      emissiveIntensity: 0.45,
      roughness: 0.12,
      metalness: 0.08,
      flatShading: true
    });

    const matFoam = new THREE.MeshStandardMaterial({
      color: PALETTE.waterFoam,
      roughness: 0.45,
      flatShading: true
    });

    const matHut = new THREE.MeshStandardMaterial({
      vertexColors: true,
      flatShading: true,
      roughness: 0.85
    });

    // Helper: Build a sharp polyhedral chiseled spire with custom planar facets
    function createChiseledSpire(opts) {
      const {
        base = [0, 0, 0],
        height = 10,
        rBase = 3.5,
        rTop = 1.6,
        sides = 6,
        lean = [0, 0],            // [dx, dz] displacement at top
        chiselAngle = [0.3, 0.1],  // [slopeX, slopeZ] tilt of the top chisel cut
        capHeight = 2.0,          // Height of cream snow/stone cap
        capTaper = 0.25,          // How narrow the cap peak is
        bodyColor = PALETTE.rockBase,
        capColor = PALETTE.capCream,
        jitterSeed = 1.0
      } = opts;

      const verts = [];
      const colors = [];

      const angles = [];
      const radRatios = [];
      for (let i = 0; i < sides; i++) {
        const baseAngle = (i / sides) * Math.PI * 2;
        const jitA = Math.sin(baseAngle * 3.0 + jitterSeed) * 0.18;
        angles.push(baseAngle + jitA);
        const jitR = 1.0 + Math.cos(baseAngle * 2.0 + jitterSeed * 1.5) * 0.2;
        radRatios.push(jitR);
      }

      // Level 0: Base ring (at y = base[1])
      const ring0 = [];
      for (let i = 0; i < sides; i++) {
        ring0.push([
          base[0] + rBase * radRatios[i] * Math.cos(angles[i]),
          base[1],
          base[2] + rBase * radRatios[i] * Math.sin(angles[i])
        ]);
      }

      // Level 1: Mid ring (at 0.45 height for natural blocky waist)
      const ring1 = [];
      const rMid = (rBase + rTop) * 0.52;
      for (let i = 0; i < sides; i++) {
        ring1.push([
          base[0] + lean[0] * 0.45 + rMid * radRatios[i] * Math.cos(angles[i]),
          base[1] + height * 0.45,
          base[2] + lean[1] * 0.45 + rMid * radRatios[i] * Math.sin(angles[i])
        ]);
      }

      // Level 2: Top cut ring (sliced by chisel plane)
      const ring2 = [];
      for (let i = 0; i < sides; i++) {
        const xRel = rTop * radRatios[i] * Math.cos(angles[i]);
        const zRel = rTop * radRatios[i] * Math.sin(angles[i]);
        const yCut = base[1] + height + chiselAngle[0] * xRel + chiselAngle[1] * zRel;
        ring2.push([
          base[0] + lean[0] + xRel,
          yCut,
          base[2] + lean[1] + zRel
        ]);
      }

      // Level 3: Cap peak ring
      const ring3 = [];
      for (let i = 0; i < sides; i++) {
        const xRel = rTop * capTaper * radRatios[i] * Math.cos(angles[i]);
        const zRel = rTop * capTaper * radRatios[i] * Math.sin(angles[i]);
        ring3.push([
          base[0] + lean[0] * 1.05 + xRel,
          ring2[i][1] + capHeight,
          base[2] + lean[1] * 1.05 + zRel
        ]);
      }

      function addTri(v0, v1, v2, c0, c1, c2) {
        verts.push(...v0, ...v1, ...v2);
        colors.push(c0.r, c0.g, c0.b, c1.r, c1.g, c1.b, c2.r, c2.g, c2.b);
      }

      function addQuad(v0, v1, v2, v3, c0, c1, c2, c3) {
        // Outward winding: v0 -> v3 -> v2 and v0 -> v2 -> v1
        addTri(v0, v3, v2, c0, c3, c2);
        addTri(v0, v2, v1, c0, c2, c1);
      }

      const cRockBase = bodyColor;
      const cRockMid = PALETTE.rockMid;
      const cRockTop = PALETTE.rockSun;
      const cCap = capColor;

      for (let i = 0; i < sides; i++) {
        const next = (i + 1) % sides;
        // Level 0 -> 1 (Lower column facets)
        addQuad(ring0[i], ring0[next], ring1[next], ring1[i], cRockBase, cRockBase, cRockMid, cRockMid);
        // Level 1 -> 2 (Upper column facets)
        addQuad(ring1[i], ring1[next], ring2[next], ring2[i], cRockMid, cRockMid, cRockTop, cRockTop);
        // Level 2 -> 3 (Snow/Cream Cap facets)
        if (capHeight > 0) {
          addQuad(ring2[i], ring2[next], ring3[next], ring3[i], cCap, cCap, cCap, cCap);
        }
      }

      // Cap roof closure (Outward upward normal)
      if (capHeight > 0) {
        let avgY = 0;
        ring3.forEach(v => avgY += v[1]);
        avgY /= sides;
        const topApex = [base[0] + lean[0] * 1.05, avgY + capHeight * 0.15, base[2] + lean[1] * 1.05];
        for (let i = 0; i < sides; i++) {
          const next = (i + 1) % sides;
          addTri(ring3[next], ring3[i], topApex, cCap, cCap, cCap);
        }
      } else {
        // Flat top closure
        let avgY = 0;
        ring2.forEach(v => avgY += v[1]);
        avgY /= sides;
        const topApex = [base[0] + lean[0], avgY, base[2] + lean[1]];
        for (let i = 0; i < sides; i++) {
          const next = (i + 1) % sides;
          addTri(ring2[next], ring2[i], topApex, cRockTop, cRockTop, cRockTop);
        }
      }

      // Base bottom closure
      const baseCenter = [base[0], base[1], base[2]];
      for (let i = 0; i < sides; i++) {
        const next = (i + 1) % sides;
        addTri(ring0[i], ring0[next], baseCenter, cRockBase, cRockBase, cRockBase);
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geo.computeVertexNormals();
      return geo;
    }

    // Helper: Build an irregular low-poly faceted rock boulder / plateau slab
    function createFacetedBlock(opts) {
      const {
        pos = [0, 0, 0],
        scale = [2, 1, 2],
        sides = 6,
        color = PALETTE.rockBase,
        colorTop = PALETTE.rockSun,
        jitter = 0.22,
        bevel = 0.3
      } = opts;

      const verts = [];
      const colors = [];

      const angles = [];
      const rads = [];
      for (let i = 0; i < sides; i++) {
        angles.push((i / sides) * Math.PI * 2);
        rads.push(1.0 + Math.sin(i * 2.3) * jitter);
      }

      const ringBot = [];
      const ringTop = [];
      const yBot = pos[1] - scale[1] * 0.5;
      const yTop = pos[1] + scale[1] * 0.5;

      for (let i = 0; i < sides; i++) {
        const cos = Math.cos(angles[i]) * rads[i];
        const sin = Math.sin(angles[i]) * rads[i];
        ringBot.push([pos[0] + cos * scale[0] * 0.5, yBot, pos[2] + sin * scale[2] * 0.5]);
        ringTop.push([pos[0] + cos * scale[0] * 0.5 * (1.0 - bevel), yTop, pos[2] + sin * scale[2] * 0.5 * (1.0 - bevel)]);
      }

      function addTri(v0, v1, v2, c0, c1, c2) {
        verts.push(...v0, ...v1, ...v2);
        colors.push(c0.r, c0.g, c0.b, c1.r, c1.g, c1.b, c2.r, c2.g, c2.b);
      }

      for (let i = 0; i < sides; i++) {
        const next = (i + 1) % sides;
        // Outward side quads
        addTri(ringBot[i], ringTop[i], ringTop[next], color, colorTop, colorTop);
        addTri(ringBot[i], ringTop[next], ringBot[next], color, colorTop, color);
      }

      // Top cap (Outward upward normal)
      const topCenter = [pos[0], yTop, pos[2]];
      for (let i = 0; i < sides; i++) {
        const next = (i + 1) % sides;
        addTri(ringTop[next], ringTop[i], topCenter, colorTop, colorTop, colorTop);
      }

      // Bottom cap (Outward downward normal)
      const botCenter = [pos[0], yBot, pos[2]];
      for (let i = 0; i < sides; i++) {
        const next = (i + 1) % sides;
        addTri(ringBot[i], ringBot[next], botCenter, color, color, color);
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geo.computeVertexNormals();
      return geo;
    }

    function buildProceduralTerrain() {
      while (proceduralGroup.children.length > 0) {
        const child = proceduralGroup.children[0];
        proceduralGroup.remove(child);
        if (child.geometry) child.geometry.dispose();
      }

      const mtnScale = parseFloat(document.getElementById('sl-mtn-scale').value);

      // =======================================================================
      // 1. SOLID AMPHITHEATER BACKDROP WALL (Eliminating All Voids)
      // =======================================================================
      const mtnGroup = new THREE.Group();
      proceduralGroup.add(mtnGroup);

      const backdropMassifs = [
        { base: [-14.5, 0, -14.0], h: 10.5 * mtnScale, rB: 5.5, rT: 2.8, sides: 6, lean: [0.5, 0.8],  chisel: [0.2, 0.2],  capH: 2.2 },
        { base: [ -8.5, 0, -18.5], h: 13.0 * mtnScale, rB: 6.0, rT: 2.6, sides: 7, lean: [0.3, 0.5],  chisel: [0.3, 0.1],  capH: 2.6 },
        { base: [ -2.0, 0, -20.5], h: 11.8 * mtnScale, rB: 5.8, rT: 2.5, sides: 6, lean: [0.0, 0.4],  chisel: [-0.1, 0.3], capH: 2.0 },
        { base: [  4.5, 0, -19.5], h: 12.5 * mtnScale, rB: 6.2, rT: 2.8, sides: 7, lean: [-0.4, 0.4], chisel: [-0.3, 0.1], capH: 2.5 },
        { base: [ 10.0, 0, -16.0], h: 13.5 * mtnScale, rB: 6.5, rT: 3.2, sides: 8, lean: [-0.6, 0.2], chisel: [-0.2, -0.2],capH: 3.0 }, // Big Dome Peak
        { base: [ 14.5, 0, -11.0], h: 9.8 * mtnScale,  rB: 5.2, rT: 2.2, sides: 6, lean: [-0.5, -0.2],chisel: [-0.3, 0.1], capH: 2.0 }
      ];

      backdropMassifs.forEach(bm => {
        const geo = createChiseledSpire({
          base: bm.base,
          height: bm.h,
          rBase: bm.rB,
          rTop: bm.rT,
          sides: bm.sides,
          lean: bm.lean,
          chiselAngle: bm.chisel,
          capHeight: bm.capH,
          capTaper: 0.35,
          bodyColor: PALETTE.rockBase,
          capColor: PALETTE.capCream,
          jitterSeed: bm.base[0]
        });
        const mesh = new THREE.Mesh(geo, matSharedRock);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        mtnGroup.add(mesh);
      });

      // =======================================================================
      // 2. THE ICONIC FLAT-TOPPED ANVIL MESA (Framing Gorge Right)
      // =======================================================================
      const mesaBaseH = 9.2 * mtnScale;
      // Main Mesa Column
      const mesaBaseGeo = createChiseledSpire({
        base: [2.5, 0, -13.0],
        height: mesaBaseH,
        rBase: 4.8,
        rTop: 3.6,
        sides: 6,
        lean: [-0.3, 0.5],
        chiselAngle: [0.05, 0.0],
        capHeight: 0, // No peak, it holds the anvil shelf!
        bodyColor: PALETTE.rockBase,
        jitterSeed: 3.14
      });

      // =======================================================================

      // =======================================================================

      // Deep canyon floor boulders stepping down
      const gorgeBoulders = [
        { x: -0.8, y: 7.2, z: -17.5, s: 2.2 },

        { x:  0.8, y: 2.2, z:  -5.5, s: 1.6 },

        { x: -0.2, y: 1.2, z:  -1.0, s: 1.4 }
      ];

      gorgeBoulders.forEach((gb, idx) => {
        const bGeo = createFacetedBlock({
          pos: [gb.x, gb.y, gb.z],
          scale: [gb.s * 1.2, gb.s * 0.8, gb.s * 1.1],

        });

        bMesh.castShadow = true;
        bMesh.receiveShadow = true;
        gorgeGroup.add(bMesh);
      });

      // Cascading Stream Ribbon
      const streamGeo = new THREE.PlaneGeometry(1.8, 19.0, 3, 20);
      streamGeo.rotateX(-Math.PI / 2);
      const sPos = streamGeo.attributes.position;
      for (let si = 0; si < sPos.count; si++) {
        const sz = sPos.getZ(si);
        const curve = Math.sin(sz * 0.4) * 0.75 + Math.cos(sz * 0.22) * 0.35;
        sPos.setX(si, sPos.getX(si) + curve);
        const t = (sz + 9.5) / 19.0;
        sPos.setY(si, THREE.MathUtils.lerp(7.8, 1.85, t));
      }
      streamGeo.computeVertexNormals();
      const streamMesh = new THREE.Mesh(streamGeo, matWater);
      streamMesh.position.set(0, 0, -8.5);
      streamMesh.receiveShadow = true;
      gorgeGroup.add(streamMesh);

      // Waterfall white foam cascades
      const waterfalls = [
        { x:  0.2, y: 6.0, z: -15.0, w: 1.8, h: 1.5, rotY: 0.1 },

        wfMesh.rotation.y = wf.rotY;

        color: PALETTE.rockSun,

      const bridgeMesh = new THREE.Mesh(bridgeGeo, matSharedRock);

      // =======================================================================

      // =======================================================================
      const leftTerraceGroup = new THREE.Group();

      // Sweeping golden upper plateau
      const mainPlateauGeo = createFacetedBlock({
        pos: [-9.5, 3.8, 3.5],

      });
      const pebbleCount = 280;
      const instPebbles = new THREE.InstancedMesh(pebbleGeo, pebbleMat, pebbleCount);
      const dummy = new THREE.Object3D();

      let pIdx = 0;
      for (let i = 0; i < pebbleCount; i++) {
        const t = i / pebbleCount;
        // Ribbon curving along the sunlit front-left terrace crest
        const cx = -12.5 + t * 7.0 + Math.sin(t * 5.0) * 0.4;
        const cz =   1.2 + t * 5.2 + Math.cos(t * 4.5) * 0.5;
        const spreadX = (Math.random() - 0.5) * 1.5;
        const spreadZ = (Math.random() - 0.5) * 1.3;
        const px = cx + spreadX;
        const pz = cz + spreadZ;
        const py = 4.75 + Math.random() * 0.25 - (t * 0.12);
        const scale = 0.6 + Math.random() * 0.65;

        dummy.position.set(px, py, pz);
        dummy.scale.set(scale, scale * 0.7, scale);
        dummy.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
        dummy.updateMatrix();
        instPebbles.setMatrixAt(pIdx, dummy.matrix);

        const col = Math.random() > 0.3 ? PALETTE.pebbleGold : PALETTE.pebbleOchre;
        instPebbles.setColorAt(pIdx, col);
        pIdx++;
      }
      instPebbles.instanceMatrix.needsUpdate = true;

        new THREE.Vector2( 3.5, -4.0),
        new THREE.Vector2( 8.5, -1.0),
        new THREE.Vector2(14.0,  4.5),

      // =======================================================================
      // 9. VILLAGE HUTS & PINE TREES (The Signature Finishing Touch!)
      // =======================================================================
      const villageGroup = new THREE.Group();

      const hutPositions = [
        { x: 5.2, y: 2.8, z: 5.2, rot: 0.3 },

      // Procedural Low-Poly Pine Trees
      const treePositions = [
        { x: 7.5, y: 2.3, z: 2.8, h: 1.8 },
        { x: 8.5, y: 2.1, z: 4.5, h: 2.2 },
        { x: 7.2, y: 2.0, z: 8.8, h: 1.9 },
        { x: 9.0, y: 1.9, z: 6.5, h: 2.4 }

      treePositions.forEach(tp => {
        const trunkGeo = new THREE.CylinderGeometry(0.08, 0.12, tp.h * 0.4, 4);

          const coneH = tp.h * 0.4;

          coneMesh.castShadow = true;
          villageGroup.add(coneMesh);
        }
      });

      // =======================================================================
      // 10. UNDER-ISLAND FACETED BEDROCK BASE (Tapering inward underneath)
      // =======================================================================
      const underBedrockGeo = createFacetedBlock({
        pos: [0.5, -0.6, 0.0],
        scale: [26.0, 3.2, 30.0],
        sides: 8,
        color: PALETTE.pedestal,
        colorTop: PALETTE.rockBase,
        bevel: 0.45,
        jitter: 0.22
      });
      const underBedrockMesh = new THREE.Mesh(underBedrockGeo, matSharedRock);
      underBedrockMesh.receiveShadow = true;
      proceduralGroup.add(underBedrockMesh);

      statusBar.textContent = "Compound Low-Poly Diorama (Precision Matched!)\n• Chiseled Polyhedral Spire Monoliths with Angled Cream Caps\n• Centerpiece Butte Mesa with Overhanging Anvil Tabletop Shelf\n• Amphitheater Backdrop Mountain Massifs (Zero Voids)\n• Cascading Canyon Ravine, Tumbled Boulders & Ribbon Stream\n• Sunlit Golden Pebble Bed on Left Terrace Plateau\n• Stepped Flagstone Slabs, Village Huts & Alpine Trees";
    }

    });

    document.getElementById('cam-view-4').addEventListener('click', () => {
      // Close-up on left bank & gravel bed (Screenshot 4)
      camera.position.set(-15, 8, 16);
      controls.target.set(-5, 2, 4);
      controls.update();
    });

    const btnModel = document.getElementById('btn-show-model');
    const btnProc = document.getElementById('btn-show-procedural');

    btnModel.addEventListener('click', () => {
      modelGroup.visible = true;
      proceduralGroup.visible = false;
      btnModel.classList.add('active');
      btnProc.classList.remove('active');
      statusBar.textContent = "Viewing 3D Model: village_sunset.glb (Reference)";
    });

    btnProc.addEventListener('click', () => {
      modelGroup.visible = false;
      proceduralGroup.visible = true;
      btnProc.classList.add('active');
      btnModel.classList.remove('active');
      statusBar.textContent = "Viewing Compound Low-Poly Procedural Diorama";
    });

    document.getElementById('chk-wireframe').addEventListener('change', (e) => {
      const wf = e.target.checked;
      modelGroup.traverse((c) => {
        if (c.isMesh && c.material) c.material.wireframe = wf;
      });
      proceduralGroup.traverse((c) => {
        if (c.isMesh && c.material) c.material.wireframe = wf;
      });
    });

    document.getElementById('chk-flat').addEventListener('change', (e) => {
      const flat = e.target.checked;
      modelGroup.traverse((c) => {
        if (c.isMesh && c.material) {
          c.material.flatShading = flat;
          c.material.needsUpdate = true;
        }
      });
      proceduralGroup.traverse((c) => {
        if (c.isMesh && c.material) {
          c.material.flatShading = flat;
          c.material.needsUpdate = true;
        }
      });
    });

    let autoRotate = false;
    document.getElementById('btn-auto-rotate').addEventListener('click', () => {
      autoRotate = !autoRotate;
      controls.autoRotate = autoRotate;
      controls.autoRotateSpeed = 1.2;
    });

    document.getElementById('sl-sun-azimuth').addEventListener('input', updateSunPosition);
    document.getElementById('sl-sun-elev').addEventListener('input', updateSunPosition);

    document.getElementById('sl-sun-intensity').addEventListener('input', (e) => {
      sunLight.intensity = parseFloat(e.target.value);
    });

    document.getElementById('sl-amb-intensity').addEventListener('input', (e) => {
      ambientLight.intensity = parseFloat(e.target.value);
    });

    document.getElementById('btn-regen-proc').addEventListener('click', () => {
      buildProceduralTerrain();
    });

    document.getElementById('sl-mtn-scale').addEventListener('input', () => {
      buildProceduralTerrain();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
