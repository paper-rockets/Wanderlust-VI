<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Low-Poly Terrain Sandbox</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #171822;
      font-family: monospace;
      color: #e2e8f0;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #ui-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(18, 20, 28, 0.95);
      border: 1px solid #4a5568;
      padding: 12px;
      font-size: 12px;
      z-index: 10;
      width: 320px;
      max-height: 94vh;
      overflow-y: auto;
    }
    h2 {
      margin: 0 0 4px 0;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #f6ad55;
    }
    .subtitle {
      font-size: 11px;
      color: #a0aec0;
      margin-bottom: 8px;
    }
    .section-title {
      margin: 10px 0 4px 0;
      padding-bottom: 2px;
      border-bottom: 1px solid #2d3748;
      font-weight: bold;
      color: #90cdf4;
      font-size: 11px;
      text-transform: uppercase;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 4px 0;
    }
    .row label {
      font-size: 11px;
    }
    input[type="range"] {
      width: 125px;
    }
    input[type="color"] {
      width: 40px;
      height: 20px;
      border: none;
      padding: 0;
      cursor: pointer;
    }
    button {
      background: #2d3748;
      color: #f7fafc;
      border: 1px solid #4a5568;
      padding: 5px 8px;
      font-family: monospace;
      font-size: 11px;
      cursor: pointer;
      margin: 2px 0;
      width: 100%;
    }
    button:hover {
      background: #4a5568;
    }
    button.active {
      background: #3182ce;
      border-color: #63b3ed;
      font-weight: bold;
    }
    .btn-group {
      display: flex;
      gap: 4px;
      margin: 4px 0;
    }
    .btn-group button {
      width: 50%;
    }
    .preset-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin: 4px 0;
    }
    .preset-grid button {
      margin: 0;
      padding: 4px;
      font-size: 10px;
    }
    #status-bar {
      margin-top: 8px;
      padding: 6px;
      background: #11131a;
      border: 1px solid #2d3748;
      font-size: 11px;
      color: #cbd5e0;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <div id="ui-panel">
    <h2>Low-Poly Terrain Sandbox</h2>
    <div class="subtitle">E:\X Flight\Surgery\Trees Terrains</div>

    <div class="section-title">View Mode</div>
    <div class="btn-group">
      <button id="btn-show-model" class="active">3D Model (GLB)</button>
      <button id="btn-show-procedural">Procedural Mesh</button>
    </div>

    <div class="section-title">Camera Angles (From Screenshots)</div>
    <div class="preset-grid">
      <button id="cam-view-1">1: Overview</button>
      <button id="cam-view-2">2: Front Valley</button>
      <button id="cam-view-3">3: Bird's Eye</button>
      <button id="cam-view-4">4: Canyon Angle</button>
    </div>
    <button id="btn-auto-rotate">Toggle Auto-Rotate</button>

    <div class="section-title">Display Options</div>
    <div class="row">
      <label>Wireframe:</label>
      <input type="checkbox" id="chk-wireframe">
    </div>
    <div class="row">
      <label>Flat Shading:</label>
      <input type="checkbox" id="chk-flat" checked>
    </div>

    <div class="section-title">Sunset Lighting</div>
    <div class="row">
      <label>Sun Azimuth:</label>
      <input type="range" id="sl-sun-azimuth" min="0" max="360" value="130">
    </div>
    <div class="row">
      <label>Sun Elevation:</label>
      <input type="range" id="sl-sun-elev" min="5" max="85" value="28">
    </div>
    <div class="row">
      <label>Sun Intensity:</label>
      <input type="range" id="sl-sun-intensity" min="0.5" max="6.0" step="0.1" value="3.4">
    </div>
    <div class="row">
      <label>Sun Color:</label>
      <input type="color" id="col-sun" value="#ff9238">
    </div>
    <div class="row">
      <label>Twilight Sky Fill:</label>
      <input type="color" id="col-ambient" value="#484f7a">
    </div>
    <div class="row">
      <label>Ambient Fill Level:</label>
      <input type="range" id="sl-amb-intensity" min="0.2" max="3.0" step="0.1" value="1.6">
    </div>

    <div class="section-title">Procedural Generator Tuning</div>
    <div class="row">
      <label>Spire Height:</label>
      <input type="range" id="sl-proc-height" min="15" max="60" value="34">
    </div>
    <div class="row">
      <label>Cap Height:</label>
      <input type="range" id="sl-proc-snow" min="0.5" max="0.9" step="0.02" value="0.70">
    </div>
    <button id="btn-regen-proc">Regenerate Procedural Terrain</button>

    <div id="status-bar">Starting 3D viewer...</div>
  </div>

  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const container = document.getElementById('canvas-container');
    const statusBar = document.getElementById('status-bar');

    // 1. Scene setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a24);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    // Position to view the model from the front lake facing the mountain spires
    camera.position.set(0, 22, 54);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 5, 0);

    // 2. Sunset Lighting setup
    // Rich twilight blue ambient fill light to give shadows their slate/purple tone
    const ambientLight = new THREE.HemisphereLight(0x484f7a, 0x222230, 1.6);
    scene.add(ambientLight);

    // Warm golden-orange sunset sun
    const sunLight = new THREE.DirectionalLight(0xff9238, 3.4);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 1;
    sunLight.shadow.camera.far = 250;
    const shadowDist = 45;
    sunLight.shadow.camera.left = -shadowDist;
    sunLight.shadow.camera.right = shadowDist;
    sunLight.shadow.camera.top = shadowDist;
    sunLight.shadow.camera.bottom = -shadowDist;
    scene.add(sunLight);

    // Secondary subtle warm bounce light
    const bounceLight = new THREE.DirectionalLight(0x735a42, 0.7);
    bounceLight.position.set(-30, 10, 30);
    scene.add(bounceLight);

    function updateSunPosition() {
      const az = parseFloat(document.getElementById('sl-sun-azimuth').value) * Math.PI / 180;
      const el = parseFloat(document.getElementById('sl-sun-elev').value) * Math.PI / 180;
      const dist = 70;
      sunLight.position.set(
        Math.cos(el) * Math.sin(az) * dist,
        Math.sin(el) * dist,
        Math.cos(el) * Math.cos(az) * dist
      );
    }
    updateSunPosition();

    // 3. Groups for switching views
    const modelGroup = new THREE.Group();
    const proceduralGroup = new THREE.Group();
    scene.add(modelGroup);
    scene.add(proceduralGroup);
    proceduralGroup.visible = false;

    // 4. Load GLB Model
    const gltfLoader = new GLTFLoader();
    let loadedRoot = null;

    statusBar.textContent = "Loading village_sunset.glb (56.5 MB)...";

    gltfLoader.load(
      'models/village_sunset.glb',
      (gltf) => {
        loadedRoot = gltf.scene;

        // Auto-center and normalize size
        const box = new THREE.Box3().setFromObject(loadedRoot);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        const targetScale = 45 / maxDim;

        loadedRoot.position.x = -center.x * targetScale;
        loadedRoot.position.y = -box.min.y * targetScale;
        loadedRoot.position.z = -center.z * targetScale;
        loadedRoot.scale.setScalar(targetScale);

        // Rotate 180 degrees so the lake & valley entrance face front towards default camera
        loadedRoot.rotation.y = Math.PI;

        let meshCount = 0;
        let vertCount = 0;

        loadedRoot.traverse((child) => {
          if (child.isMesh) {
            meshCount++;
            child.castShadow = true;
            child.receiveShadow = true;
            if (child.geometry.attributes.position) {
              vertCount += child.geometry.attributes.position.count;
            }

            if (child.material) {
              // Ensure vertex colors show clearly without being tinted dark
              if (child.geometry.attributes.color) {
                child.material.vertexColors = true;
                if (child.material.color) {
                  child.material.color.setRGB(1, 1, 1);
                }
              }
              child.material.flatShading = true;
              child.material.roughness = 0.88;
              child.material.metalness = 0.05;
              child.material.needsUpdate = true;
            }
          }
        });

        modelGroup.add(loadedRoot);
        statusBar.textContent = `Model loaded successfully!\nMeshes: ${meshCount} | Vertices: ${vertCount.toLocaleString()}\nShowing low-poly faceted shading.`;
      },
      (xhr) => {
        if (xhr.total > 0) {
          const pct = Math.round((xhr.loaded / xhr.total) * 100);
          statusBar.textContent = `Downloading model: ${pct}% (${(xhr.loaded / 1048576).toFixed(1)} / ${(xhr.total / 1048576).toFixed(1)} MB)...`;
        } else {
          statusBar.textContent = `Downloading model: ${(xhr.loaded / 1048576).toFixed(1)} MB...`;
        }
      },
      (err) => {
        console.error("Failed to load model:", err);
        statusBar.textContent = "Error loading models/village_sunset.glb:\n" + err.message;
      }
    );

    // 5. Procedural Low-Poly Terrain Generator
    // Procedurally creates broad spires, capped tips, canyon gorge, and lake
    function buildProceduralTerrain() {
      while (proceduralGroup.children.length > 0) {
        const obj = proceduralGroup.children[0];
        proceduralGroup.remove(obj);
        if (obj.geometry) obj.geometry.dispose();
      }

      const maxHeight = parseFloat(document.getElementById('sl-proc-height').value);
      const capThreshold = parseFloat(document.getElementById('sl-proc-snow').value);

      const gridW = 44;
      const gridD = 44;
      const segs = 60;

      let planeGeo = new THREE.PlaneGeometry(gridW, gridD, segs, segs);
      planeGeo.rotateX(-Math.PI / 2);
      planeGeo = planeGeo.toNonIndexed();

      const pos = planeGeo.attributes.position;
      const colors = new Float32Array(pos.count * 3);

      // Colors matching the screenshots
      const colCap = new THREE.Color(0xd7dad6);       // Creamy white/stone cap
      const colRockLight = new THREE.Color(0x6e6884); // Upper rock
      const colRockDark = new THREE.Color(0x383552);  // Deep slate purple-blue rock
      const colGrass = new THREE.Color(0x56773a);     // Meadow green
      const colOchre = new THREE.Color(0xb28f3c);     // Golden/ochre grass terrace
      const colDirt = new THREE.Color(0x825447);      // Earthy reddish dirt terrace
      const colRiverBed = new THREE.Color(0x272635);  // Deep canyon bed
      const tempCol = new THREE.Color();

      // Define 7 distinct spire pillars around the horseshoe rim
      const spires = [
        { x: -12, z: -10, r: 6.5, h: 1.0 },
        { x:  -7, z: -14, r: 6.0, h: 0.95 },
        { x:   0, z: -16, r: 5.5, h: 0.9 },
        { x:   8, z: -14, r: 6.2, h: 1.0 },
        { x:  13, z: -9,  r: 7.0, h: 0.88 },
        { x: -14, z:  -2, r: 5.5, h: 0.75 },
        { x:  14, z:  -1, r: 5.5, h: 0.78 }
      ];

      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const z = pos.getZ(i);

        const distCenter = Math.sqrt(x * x + z * z);

        // Sum contributions from each rock spire
        let spireHeight = 0;
        for (const sp of spires) {
          const dx = x - sp.x;
          const dz = z - sp.z;
          const d = Math.sqrt(dx * dx + dz * dz);
          if (d < sp.r) {
            const factor = 1.0 - (d / sp.r);
            // Steep faceted dropoff
            const hPart = Math.pow(factor, 1.4) * (sp.h * maxHeight);
            if (hPart > spireHeight) spireHeight = hPart;
          }
        }

        // Stepped terraced meadows
        let baseTerrace = (Math.sin(x * 0.25) * Math.cos(z * 0.25) + 1.0) * 3.5;
        // Step quantization for terrace look
        baseTerrace = Math.floor(baseTerrace * 1.4) / 1.4;

        // River canyon carve down the center
        const riverX = Math.sin(z * 0.15) * 2.5;
        const canyonDist = Math.abs(x - riverX);
        const canyonCarve = Math.exp(-Math.pow(canyonDist / 3.0, 2.0));

        // Front lake depression (z > 2)
        const lakeFactor = Math.max(0, z - 2.0) / 18.0;
        const lakeDepression = Math.min(1.0, lakeFactor) * Math.max(0, 1.0 - Math.abs(x) / 14.0) * 6.0;

        let totalH = spireHeight + baseTerrace;
        // Carve gorge
        totalH = totalH * (1.0 - canyonCarve * 0.85) - canyonCarve * 2.5;
        // Carve lake
        totalH -= lakeDepression;

        // Cut out boundary
        if (distCenter > 18.0) {
          const drop = Math.pow(distCenter - 18.0, 2.0) * 0.4;
          totalH -= drop;
        }

        // Cap height flat-top flattening
        const capCutoff = maxHeight * capThreshold;
        let isCap = false;
        if (totalH > capCutoff) {
          isCap = true;
          totalH = capCutoff + (totalH - capCutoff) * 0.25; // Chamfer/flatten top
        }

        pos.setY(i, Math.max(-3.5, totalH));

        // Vertex colors
        if (isCap) {
          tempCol.copy(colCap);
        } else if (totalH > maxHeight * 0.35) {
          const t = (totalH - maxHeight * 0.35) / (maxHeight * (capThreshold - 0.35));
          tempCol.lerpColors(colRockDark, colRockLight, Math.min(1, Math.max(0, t)));
        } else if (totalH > 4.5) {
          // Mixed ochre and green terraces
          const patch = (Math.sin(x * 0.8) + Math.cos(z * 0.8)) * 0.5 + 0.5;
          tempCol.lerpColors(colOchre, colGrass, patch);
        } else if (totalH > 1.0) {
          // Terraces near water
          const patch2 = Math.sin(x * 1.5) * 0.5 + 0.5;
          tempCol.lerpColors(colGrass, colDirt, patch2 * 0.6);
        } else {
          // Riverbed
          tempCol.copy(colRiverBed);
        }

        colors[i * 3 + 0] = tempCol.r;
        colors[i * 3 + 1] = tempCol.g;
        colors[i * 3 + 2] = tempCol.b;
      }

      planeGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      planeGeo.computeVertexNormals();

      const terrainMat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        flatShading: true,
        roughness: 0.85,
        metalness: 0.05
      });
      const terrainMesh = new THREE.Mesh(planeGeo, terrainMat);
      terrainMesh.castShadow = true;
      terrainMesh.receiveShadow = true;
      proceduralGroup.add(terrainMesh);

      // Pale blue water surface for canyon river and lake
      const waterGeo = new THREE.PlaneGeometry(28, 34, 12, 12);
      waterGeo.rotateX(-Math.PI / 2);
      const waterMat = new THREE.MeshStandardMaterial({
        color: 0x98bde6,
        roughness: 0.2,
        metalness: 0.08,
        transparent: true,
        opacity: 0.94,
        flatShading: true
      });
      const waterMesh = new THREE.Mesh(waterGeo, waterMat);
      waterMesh.position.set(0, 0.4, 4);
      waterMesh.receiveShadow = true;
      proceduralGroup.add(waterMesh);

      // Shrubbery cluster on left terrace
      const bushGeo = new THREE.DodecahedronGeometry(0.5, 0);
      const bushMat = new THREE.MeshStandardMaterial({
        color: 0x486429,
        flatShading: true,
        roughness: 0.9
      });
      const bushCount = 55;
      const instBushes = new THREE.InstancedMesh(bushGeo, bushMat, bushCount);
      const dummy = new THREE.Object3D();

      for (let b = 0; b < bushCount; b++) {
        const bx = -8.5 + (Math.random() - 0.5) * 5.0;
        const bz = 2.0 + (Math.random() - 0.5) * 5.0;
        const by = 2.8 + Math.random() * 1.2;
        const s = 0.5 + Math.random() * 0.8;
        dummy.position.set(bx, by, bz);
        dummy.scale.set(s, s * 0.8, s);
        dummy.rotation.set(Math.random(), Math.random(), Math.random());
        dummy.updateMatrix();
        instBushes.setMatrixAt(b, dummy.matrix);
      }
      instBushes.instanceMatrix.needsUpdate = true;
      instBushes.castShadow = true;
      instBushes.receiveShadow = true;
      proceduralGroup.add(instBushes);
    }

    buildProceduralTerrain();

    // 6. Camera angle presets matching screenshots
    document.getElementById('cam-view-1').addEventListener('click', () => {
      // Perspective overview
      camera.position.set(-28, 22, 38);
      controls.target.set(0, 5, 0);
      controls.update();
    });

    document.getElementById('cam-view-2').addEventListener('click', () => {
      // Front valley view looking into canyon
      camera.position.set(0, 15, 46);
      controls.target.set(0, 6, -4);
      controls.update();
    });

    document.getElementById('cam-view-3').addEventListener('click', () => {
      // High bird's eye view
      camera.position.set(-36, 42, 40);
      controls.target.set(0, 4, 0);
      controls.update();
    });

    document.getElementById('cam-view-4').addEventListener('click', () => {
      // Canyon close-up angle
      camera.position.set(-12, 14, 28);
      controls.target.set(0, 7, -2);
      controls.update();
    });

    // 7. UI Controls
    const btnModel = document.getElementById('btn-show-model');
    const btnProc = document.getElementById('btn-show-procedural');

    btnModel.addEventListener('click', () => {
      modelGroup.visible = true;
      proceduralGroup.visible = false;
      btnModel.classList.add('active');
      btnProc.classList.remove('active');
      statusBar.textContent = "Viewing 3D Model: village_sunset.glb";
    });

    btnProc.addEventListener('click', () => {
      modelGroup.visible = false;
      proceduralGroup.visible = true;
      btnProc.classList.add('active');
      btnModel.classList.remove('active');
      statusBar.textContent = "Viewing Procedural Low-Poly Terrain Generator";
    });

    document.getElementById('chk-wireframe').addEventListener('change', (e) => {
      const wf = e.target.checked;
      modelGroup.traverse((c) => {
        if (c.isMesh && c.material) c.material.wireframe = wf;
      });
      proceduralGroup.traverse((c) => {
        if (c.isMesh && c.material) c.material.wireframe = wf;
      });
    });

    document.getElementById('chk-flat').addEventListener('change', (e) => {
      const flat = e.target.checked;
      modelGroup.traverse((c) => {
        if (c.isMesh && c.material) {
          c.material.flatShading = flat;
          c.material.needsUpdate = true;
        }
      });
    });

    let autoRotate = false;
    document.getElementById('btn-auto-rotate').addEventListener('click', () => {
      autoRotate = !autoRotate;
      controls.autoRotate = autoRotate;
      controls.autoRotateSpeed = 1.2;
    });

    // Lighting event listeners
    document.getElementById('sl-sun-azimuth').addEventListener('input', updateSunPosition);
    document.getElementById('sl-sun-elev').addEventListener('input', updateSunPosition);

    document.getElementById('sl-sun-intensity').addEventListener('input', (e) => {
      sunLight.intensity = parseFloat(e.target.value);
    });

    document.getElementById('col-sun').addEventListener('input', (e) => {
      sunLight.color.set(e.target.value);
    });

    document.getElementById('col-ambient').addEventListener('input', (e) => {
      ambientLight.color.set(e.target.value);
    });

    document.getElementById('sl-amb-intensity').addEventListener('input', (e) => {
      ambientLight.intensity = parseFloat(e.target.value);
    });

    document.getElementById('btn-regen-proc').addEventListener('click', () => {
      buildProceduralTerrain();
      statusBar.textContent = "Regenerated procedural terrain!";
    });

    // Window resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 8. Render loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
