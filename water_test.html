<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stylized Water Test Sandbox</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      background: #87ceeb;
      font-family: monospace;
      color: #111;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #ui-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #ffffff;
      border: 2px solid #000;
      padding: 10px;
      max-width: 320px;
      font-size: 12px;
      z-index: 100;
    }
    #ui-panel h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
    }
    .control-row {
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .control-row label {
      font-weight: bold;
    }
    .control-row input[type="range"] {
      width: 130px;
    }
    #instructions {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed #666;
      font-size: 11px;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <div id="ui-panel">
    <h3>Stylized Water Sandbox</h3>
    <div class="control-row">
      <label for="slider-disp">Wave Height:</label>
      <input id="slider-disp" type="range" min="0" max="1.5" step="0.05" value="0.3" />
    </div>
    <div class="control-row">
      <label for="slider-foam">Foam Thickness:</label>
      <input id="slider-foam" type="range" min="0.05" max="2.0" step="0.05" value="0.4" />
    </div>
    <div class="control-row">
      <label for="slider-refract">Refraction:</label>
      <input id="slider-refract" type="range" min="0" max="3.0" step="0.1" value="1.2" />
    </div>
    <div class="control-row">
      <label for="slider-caustics">Caustics:</label>
      <input id="slider-caustics" type="range" min="0" max="0.3" step="0.01" value="0.1" />
    </div>
    <div class="control-row">
      <label for="slider-beer">Deep Absorption:</label>
      <input id="slider-beer" type="range" min="0.5" max="10.0" step="0.5" value="4.5" />
    </div>
    <div class="control-row">
      <label for="toggle-ssr">SSR (Reflection):</label>
      <input id="toggle-ssr" type="checkbox" />
    </div>
    <div id="instructions">
      Left Drag: Orbit camera<br>
      Right Drag: Pan<br>
      Scroll: Zoom in/out<br>
      WASD: Move floating beacon
    </div>
  </div>

  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { StylizedWater } from './StylizedWater.js';

    // 1. Scene setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.005);

    const camera = new THREE.PerspectiveCamera(
      55,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(0, 15, 30);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    container.appendChild(renderer.domElement);

    window.__three = { scene, camera, renderer };

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0, 0);
    controls.maxPolarAngle = Math.PI / 2 + 0.3; // Allow looking slightly under water

    // 2. Lighting
    const ambientLight = new THREE.AmbientLight(0xdff0ff, 0.9);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfffaed, 1.8);
    sunLight.position.set(40, 60, 30);
    scene.add(sunLight);

    // 3. Submerged underwater objects & shoreline terrain to test depth, refraction & foam
    const sandGeo = new THREE.PlaneGeometry(200, 200, 64, 64);
    sandGeo.rotateX(-Math.PI / 2);
    // Create sloped seabed with center trough
    const pos = sandGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const z = pos.getZ(i);
      const dist = Math.hypot(x, z);
      const depth = -12 + Math.sin(x * 0.1) * 1.5 + Math.cos(z * 0.1) * 1.5;
      pos.setY(i, depth);
    }
    sandGeo.computeVertexNormals();
    const sandMat = new THREE.MeshStandardMaterial({
      color: 0xdfc999,
      roughness: 0.85
    });
    const seabed = new THREE.Mesh(sandGeo, sandMat);
    scene.add(seabed);

    // Center rocky island that emerges from deep underwater and pierces water surface
    const islandGeo = new THREE.CylinderGeometry(2, 14, 16, 24, 8);
    const islandMat = new THREE.MeshStandardMaterial({
      color: 0x5a7550,
      roughness: 0.75,
      flatShading: true
    });
    const island = new THREE.Mesh(islandGeo, islandMat);
    island.position.set(0, -2, 0);
    scene.add(island);

    // Submerged columns at different depths to test Beer-Lambert absorption
    const colMat1 = new THREE.MeshStandardMaterial({ color: 0xdd4433, roughness: 0.4 });
    const colMat2 = new THREE.MeshStandardMaterial({ color: 0x33aa55, roughness: 0.4 });
    const colMat3 = new THREE.MeshStandardMaterial({ color: 0xffcc00, roughness: 0.4 });

    const createCol = (x, z, h, mat) => {
      const geo = new THREE.CylinderGeometry(1.2, 1.2, h, 16);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, -12 + h / 2, z);
      scene.add(mesh);
      return mesh;
    };
    createCol(-12, -8, 14, colMat1); // pierces water
    createCol(-6, 12, 10, colMat2);  // just under surface (-2)
    createCol(14, 4, 6, colMat3);    // deep under surface (-6)
    createCol(10, -12, 4, colMat1);  // very deep under surface (-8)

    // Floating player boat/beacon to test ripples
    const beaconGeo = new THREE.SphereGeometry(1.2, 24, 24);
    const beaconMat = new THREE.MeshStandardMaterial({ color: 0xff2266, roughness: 0.2 });
    const beacon = new THREE.Mesh(beaconGeo, beaconMat);
    beacon.position.set(5, 0, 5);
    scene.add(beacon);

    // 4. Stylized Water Instance
    const water = new StylizedWater({
      renderer,
      scene,
      camera,
      size: 400,
      segments: 128,
      caustics: true,
      fresnel: true,
      playerWaves: true,
      displacement: true,
      ssr: false
    });
    water.mesh.position.y = 0;
    scene.add(water.mesh);
    window.__three.water = water;

    // Keyboard inputs for beacon
    const keys = {};
    window.addEventListener('keydown', (e) => { keys[e.code] = true; });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });

    // UI event listeners
    document.getElementById('slider-disp').addEventListener('input', (e) => {
      water.material.uniforms.uDisplacementStrength.value = parseFloat(e.target.value);
    });
    document.getElementById('slider-foam').addEventListener('input', (e) => {
      water.material.uniforms.uEdgeThickness.value = parseFloat(e.target.value);
    });
    document.getElementById('slider-refract').addEventListener('input', (e) => {
      water.material.uniforms.uRefractionStrength.value = parseFloat(e.target.value);
    });
    document.getElementById('slider-caustics').addEventListener('input', (e) => {
      water.material.uniforms.uCausticStrength.value = parseFloat(e.target.value);
    });
    document.getElementById('slider-beer').addEventListener('input', (e) => {
      water.material.uniforms.uBeersLaw.value = parseFloat(e.target.value);
    });
    document.getElementById('toggle-ssr').addEventListener('change', (e) => {
      if (e.target.checked) {
        water.material.defines.USE_SSR = 1;
      } else {
        delete water.material.defines.USE_SSR;
      }
      water.material.needsUpdate = true;
    });

    // Resize handling
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      water.resize();
    });

    // 5. Animation loop
    let lastTime = performance.now() * 0.001;

    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now() * 0.001;
      const delta = Math.min(now - lastTime, 0.1);
      lastTime = now;
      const time = now;

      // Keyboard control for beacon
      const speed = 8.0 * delta;
      if (keys['KeyW'] || keys['ArrowUp']) beacon.position.z -= speed;
      if (keys['KeyS'] || keys['ArrowDown']) beacon.position.z += speed;
      if (keys['KeyA'] || keys['ArrowLeft']) beacon.position.x -= speed;
      if (keys['KeyD'] || keys['ArrowRight']) beacon.position.x += speed;

      // Gentle automatic bobbing when idle
      if (!keys['KeyW'] && !keys['KeyS'] && !keys['KeyA'] && !keys['KeyD']) {
        beacon.position.x = 8 * Math.cos(time * 0.6);
        beacon.position.z = 8 * Math.sin(time * 0.6);
      }
      beacon.position.y = Math.sin(time * 2.5) * 0.15;

      controls.update();

      // Update water uniforms & player ripple position
      water.update(time);
      water.setPlayerPosition(beacon.position);

      // Pass 1: Render scene without water into color & depth textures
      water.captureBackground();

      // Pass 2: Render full scene with water
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
