<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codrops Stylized Water (Thalles Lopes)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      background: #fcffdc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      color: #222;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #ui-panel {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(255, 255, 255, 0.94);
      border: 1.5px solid #334155;
      border-radius: 8px;
      padding: 12px 14px;
      max-width: 320px;
      font-size: 12px;
      z-index: 100;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }
    #ui-panel h3 {
      margin: 0 0 6px 0;
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
    }
    #ui-panel .sub {
      margin: 0 0 10px 0;
      font-size: 11px;
      color: #64748b;
    }
    .control-row {
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .control-row label {
      font-weight: 600;
      color: #475569;
    }
    .control-row input[type="range"] {
      width: 130px;
      cursor: pointer;
    }
    .color-row {
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .color-row input[type="color"] {
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      width: 44px;
      height: 22px;
      cursor: pointer;
      padding: 0;
      background: none;
    }
    #instructions {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed #cbd5e1;
      font-size: 11px;
      color: #64748b;
      line-height: 1.4;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <div id="ui-panel">
    <h3>Codrops Stylized Water</h3>
    <div class="sub">By Thalles Lopes (Codrops 2025)</div>

    <div class="control-row">
      <label for="slider-level">Water Level:</label>
      <input id="slider-level" type="range" min="0.2" max="3.0" step="0.05" value="1.0" />
    </div>
    <div class="control-row">
      <label for="slider-speed">Wave Speed:</label>
      <input id="slider-speed" type="range" min="0.5" max="3.0" step="0.1" value="1.2" />
    </div>
    <div class="control-row">
      <label for="slider-amp">Wave Height:</label>
      <input id="slider-amp" type="range" min="0.05" max="0.8" step="0.02" value="0.28" />
    </div>
    <div class="control-row">
      <label for="slider-tex">Texture Size:</label>
      <input id="slider-tex" type="range" min="10" max="80" step="1" value="45" />
    </div>
    <div class="control-row">
      <label for="slider-foam">Shore Foam:</label>
      <input id="slider-foam" type="range" min="0.02" max="0.5" step="0.02" value="0.14" />
    </div>

    <div class="color-row">
      <label for="col-near">Water Near:</label>
      <input id="col-near" type="color" value="#00fccd" />
    </div>
    <div class="color-row">
      <label for="col-far">Water Far:</label>
      <input id="col-far" type="color" value="#1ceeff" />
    </div>
    <div class="color-row">
      <label for="col-sand">Sand:</label>
      <input id="col-sand" type="color" value="#ff9900" />
    </div>
    <div class="color-row">
      <label for="col-grass">Grass:</label>
      <input id="col-grass" type="color" value="#85a02b" />
    </div>
    <div class="color-row">
      <label for="col-under">Underwater:</label>
      <input id="col-under" type="color" value="#118a4f" />
    </div>

    <div id="instructions">
      • Left Drag: Orbit | Right Drag: Pan<br>
      • Scroll: Zoom in / out<br>
      • Wet sand & shoreline foam stay in sync with wave height
    </div>
  </div>

  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    // ------------------------------------------------------------
    // 1. Scene & Lighting (Soft cream background & fog from Codrops demo)
    // ------------------------------------------------------------
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const bgColor = new THREE.Color('#fcffdc');
    scene.background = bgColor;
    scene.fog = new THREE.Fog('#fcffdc', 80, 140);

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(0, 14, 25);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance',
      preserveDrawingBuffer: true
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 1.5, 0);
    controls.maxPolarAngle = Math.PI / 2.2;
    controls.minDistance = 6;
    controls.maxDistance = 60;

    window.__three = { scene, camera, controls, renderer };

    // Ambient & Sunlight from tutorial
    const ambientLight = new THREE.AmbientLight(0xfff8ee, 1.2);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfffae6, 2.5);
    sunLight.position.set(13, 18, 12);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 1;
    sunLight.shadow.camera.far = 70;
    sunLight.shadow.camera.left = -20;
    sunLight.shadow.camera.right = 20;
    sunLight.shadow.camera.top = 20;
    sunLight.shadow.camera.bottom = -20;
    sunLight.shadow.bias = -0.0003;
    scene.add(sunLight);

    // ------------------------------------------------------------
    // 2. State & Uniforms
    // ------------------------------------------------------------
    const params = {
      waterLevel: 1.0,
      waveSpeed: 1.2,
      waveAmplitude: 0.28,
      foamDepth: 0.14,
      textureSize: 45,
      colorNear: new THREE.Color('#00fccd'),
      colorFar: new THREE.Color('#1ceeff'),
      sandColor: new THREE.Color('#ff9900'),
      grassColor: new THREE.Color('#85a02b'),
      underwaterColor: new THREE.Color('#118a4f')
    };

    const commonUniforms = {
      uTime: { value: 0 },
      uWaterLevel: { value: params.waterLevel },
      uWaveSpeed: { value: params.waveSpeed },
      uWaveAmplitude: { value: params.waveAmplitude },
      uFoamDepth: { value: params.foamDepth }
    };

    // ------------------------------------------------------------
    // 3. Simplex Noise GLSL (Ported directly from Codrops fragment shader)
    // ------------------------------------------------------------
    const simplexNoiseGLSL = /* glsl */ `
    vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
    vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
    vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

    float snoise(vec2 v) {
        const vec4 C = vec4(0.211324865405187,
                            0.366025403784439,
                            -0.577350269189626,
                            0.024390243902439);
        vec2 i  = floor(v + dot(v, C.yy) );
        vec2 x0 = v -   i + dot(i, C.xx);
        vec2 i1;
        i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
        vec4 x12 = x0.xyxy + C.xxzz;
        x12.xy -= i1;
        i = mod289(i);
        vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 ))
            + i.x + vec3(0.0, i1.x, 1.0 ));

        vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
        m = m*m ;
        m = m*m ;
        vec3 x = 2.0 * fract(p * C.www) - 1.0;
        vec3 h = abs(x) - 0.5;
        vec3 ox = floor(x + 0.5);
        vec3 a0 = x - ox;
        m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
        vec3 g;
        g.x  = a0.x  * x0.x  + h.x  * x0.y;
        g.yz = a0.yz * x12.xz + h.yz * x12.yw;
        return 130.0 * dot(m, g);
    }
    `;

    // ------------------------------------------------------------
    // 4. Codrops Water Material
    // ------------------------------------------------------------
    const waterUniforms = {
      ...commonUniforms,
      uColorNear: { value: params.colorNear },
      uColorFar: { value: params.colorFar },
      uTextureSize: { value: params.textureSize }
    };

    const waterMat = new THREE.MeshStandardMaterial({
      color: params.colorNear,
      roughness: 0.15,
      metalness: 0.05,
      transparent: true,
      side: THREE.DoubleSide
    });

    waterMat.onBeforeCompile = (shader) => {
      shader.uniforms.uTime = waterUniforms.uTime;
      shader.uniforms.uWaveSpeed = waterUniforms.uWaveSpeed;
      shader.uniforms.uWaveAmplitude = waterUniforms.uWaveAmplitude;
      shader.uniforms.uColorNear = waterUniforms.uColorNear;
      shader.uniforms.uColorFar = waterUniforms.uColorFar;
      shader.uniforms.uTextureSize = waterUniforms.uTextureSize;

      // Vertex shader: sine vertical oscillation
      shader.vertexShader = `
        uniform float uTime;
        uniform float uWaveSpeed;
        uniform float uWaveAmplitude;
        varying vec2 vWaterUv;
      ` + shader.vertexShader;

      shader.vertexShader = shader.vertexShader.replace(
        `#include <begin_vertex>`,
        `#include <begin_vertex>
        vWaterUv = uv;

        // 3D rolling wave crests across the water plane (vertical displacement on Y)
        float w1 = sin(position.x * 0.28 + position.z * 0.18 + uTime * uWaveSpeed) * uWaveAmplitude;
        float w2 = cos(position.x * 0.45 - position.z * 0.32 + uTime * (uWaveSpeed * 1.3)) * (uWaveAmplitude * 0.55);
        float w3 = sin((position.x + position.z) * 0.14 + uTime * (uWaveSpeed * 0.8)) * (uWaveAmplitude * 0.35);
        float waveOffset = w1 + w2 + w3;

        transformed.y += waveOffset;
        `
      );

      // Fragment shader: cartoon simplex waves, foam threshold, vignette
      shader.fragmentShader = `
        uniform float uTime;
        uniform vec3 uColorNear;
        uniform vec3 uColorFar;
        uniform float uTextureSize;
        varying vec2 vWaterUv;
        ${simplexNoiseGLSL}
      ` + shader.fragmentShader;

      shader.fragmentShader = shader.fragmentShader.replace(
        `#include <color_fragment>`,
        `#include <color_fragment>
        float textureSize = 100.0 - uTextureSize;

        // Base foam noise
        float noiseBase = snoise(vWaterUv * (textureSize * 2.8) + sin(uTime * 0.3));
        noiseBase = noiseBase * 0.5 + 0.5;
        vec3 colorBase = vec3(noiseBase);

        vec3 foam = smoothstep(0.08, 0.001, colorBase);
        foam = step(0.5, foam);

        // Moving wave ridges
        float noiseWaves = snoise(vWaterUv * textureSize + sin(uTime * -0.1));
        noiseWaves = noiseWaves * 0.5 + 0.5;
        vec3 colorWaves = vec3(noiseWaves);

        float threshold = 0.6 + 0.01 * sin(uTime * 2.0);
        vec3 waveEffect = 1.0 - (smoothstep(threshold + 0.03, threshold + 0.032, colorWaves) +
                                smoothstep(threshold, threshold - 0.01, colorWaves));
        waveEffect = step(0.5, waveEffect);

        vec3 combinedEffect = min(waveEffect + foam, 1.0);

        // Distance gradient
        float vignette = length(vWaterUv - 0.5) * 1.5;
        vec3 baseEffect = smoothstep(0.1, 0.3, vec3(vignette));
        vec3 baseColor = mix(uColorNear, uColorFar, baseEffect);

        combinedEffect = min(waveEffect + foam, 1.0);
        combinedEffect = mix(combinedEffect, vec3(0.0), baseEffect);

        vec3 foamEffect = mix(foam, vec3(0.0), baseEffect);

        diffuseColor.rgb = (1.0 - combinedEffect) * baseColor + combinedEffect;

        // Alpha calculation
        float alphaVal = mix(0.35, 1.0, foamEffect.r);
        alphaVal = mix(alphaVal, 1.0, clamp(vignette * 0.7, 0.0, 1.0));
        diffuseColor.a = alphaVal;
        `
      );
    };

    const waterGeo = new THREE.PlaneGeometry(160, 160, 128, 128);
    waterGeo.rotateX(-Math.PI / 2);
    const waterMesh = new THREE.Mesh(waterGeo, waterMat);
    waterMesh.position.y = params.waterLevel;
    scene.add(waterMesh);

    // ------------------------------------------------------------
    // 5. Codrops Terrain Material (Wet Sand, Grass, Shoreline Foam Stripe)
    // ------------------------------------------------------------
    const terrainUniforms = {
      ...commonUniforms,
      uGrassColor: { value: params.grassColor },
      uUnderwaterColor: { value: params.underwaterColor }
    };

    const terrainMat = new THREE.MeshStandardMaterial({
      color: params.sandColor,
      roughness: 0.85,
      metalness: 0.02
    });

    terrainMat.onBeforeCompile = (shader) => {
      shader.uniforms.uTime = terrainUniforms.uTime;
      shader.uniforms.uWaterLevel = terrainUniforms.uWaterLevel;
      shader.uniforms.uWaveSpeed = terrainUniforms.uWaveSpeed;
      shader.uniforms.uWaveAmplitude = terrainUniforms.uWaveAmplitude;
      shader.uniforms.uFoamDepth = terrainUniforms.uFoamDepth;
      shader.uniforms.uGrassColor = terrainUniforms.uGrassColor;
      shader.uniforms.uUnderwaterColor = terrainUniforms.uUnderwaterColor;

      shader.vertexShader = `
        varying vec3 vWorldPos;
      ` + shader.vertexShader;

      shader.vertexShader = shader.vertexShader.replace(
        `#include <begin_vertex>`,
        `#include <begin_vertex>
        vWorldPos = (modelMatrix * vec4(position, 1.0)).xyz;
        `
      );

      shader.fragmentShader = `
        uniform float uTime;
        uniform float uWaterLevel;
        uniform float uWaveSpeed;
        uniform float uWaveAmplitude;
        uniform float uFoamDepth;
        uniform vec3 uGrassColor;
        uniform vec3 uUnderwaterColor;
        varying vec3 vWorldPos;
      ` + shader.fragmentShader;

      shader.fragmentShader = shader.fragmentShader.replace(
        `#include <color_fragment>`,
        `#include <color_fragment>
        vec3 baseColor = diffuseColor.rgb;

        // Darken sand near water level for wet sand effect
        float heightFactor = smoothstep(uWaterLevel + 1.0, uWaterLevel, vWorldPos.y);
        baseColor = mix(baseColor, baseColor * 0.52, heightFactor);

        // Blend underwater deep bottom color
        float oceanFactor = smoothstep(min(uWaterLevel - 0.4, 0.2), 0.0, vWorldPos.y);
        baseColor = mix(baseColor, uUnderwaterColor, oceanFactor);

        // Add grass to higher elevations
        float grassFactor = smoothstep(uWaterLevel + 0.8, max(uWaterLevel + 1.8, 3.2), vWorldPos.y);
        baseColor = mix(baseColor, uGrassColor, grassFactor);

        // Synchronized animated 3D shore foam stripe
        float waveAtShore =
            sin(vWorldPos.x * 0.28 + vWorldPos.z * 0.18 + uTime * uWaveSpeed) * uWaveAmplitude +
            cos(vWorldPos.x * 0.45 - vWorldPos.z * 0.32 + uTime * (uWaveSpeed * 1.3)) * (uWaveAmplitude * 0.55) +
            sin((vWorldPos.x + vWorldPos.z) * 0.14 + uTime * (uWaveSpeed * 0.8)) * (uWaveAmplitude * 0.35);

        float currentWaterHeight = uWaterLevel + waveAtShore;
        float stripe = smoothstep(currentWaterHeight + 0.02, currentWaterHeight - 0.02, vWorldPos.y)
                     - smoothstep(currentWaterHeight + uFoamDepth + 0.02, currentWaterHeight + uFoamDepth - 0.02, vWorldPos.y);

        diffuseColor.rgb = mix(baseColor - stripe * 0.5, vec3(1.0), stripe);
        `
      );
    };

    // ------------------------------------------------------------
    // 6. Load 3D Models (Terrain & Stylized Rocks from Codrops tutorial)
    // ------------------------------------------------------------
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');

    const gltfLoader = new GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);

    gltfLoader.load(
      '/public/models/codrops_terrain.glb',
      (gltf) => {
        const model = gltf.scene;
        model.traverse((child) => {
          if (child.isMesh) {
            child.material = terrainMat;
            child.receiveShadow = true;
            child.castShadow = true;
          }
        });
        model.scale.set(1, 1, 1);
        model.position.set(0, 0, 0);
        scene.add(model);
      },
      undefined,
      (err) => {
        console.warn('Using procedural terrain fallback:', err);
      }
    );

    gltfLoader.load(
      '/public/models/codrops_rocks.glb',
      (gltf) => {
        const rocks = gltf.scene;
        const rockMat = new THREE.MeshStandardMaterial({
          color: 0x718096,
          roughness: 0.8
        });
        rocks.traverse((child) => {
          if (child.isMesh) {
            child.material = rockMat;
            child.receiveShadow = true;
            child.castShadow = true;
          }
        });
        rocks.scale.set(1, 1, 1);
        scene.add(rocks);
      }
    );

    // Deep seabed plane
    const seabedGeo = new THREE.PlaneGeometry(256, 256);
    seabedGeo.rotateX(-Math.PI / 2);
    const seabedMat = new THREE.MeshStandardMaterial({ color: params.underwaterColor, roughness: 0.9 });
    const seabedMesh = new THREE.Mesh(seabedGeo, seabedMat);
    seabedMesh.position.y = -0.05;
    seabedMesh.receiveShadow = true;
    scene.add(seabedMesh);

    // ------------------------------------------------------------
    // 7. Interactive Controls UI Event Listeners
    // ------------------------------------------------------------
    document.getElementById('slider-level').addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      params.waterLevel = v;
      commonUniforms.uWaterLevel.value = v;
      waterMesh.position.y = v;
    });
    document.getElementById('slider-speed').addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      commonUniforms.uWaveSpeed.value = v;
    });
    document.getElementById('slider-amp').addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      commonUniforms.uWaveAmplitude.value = v;
    });
    document.getElementById('slider-tex').addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      waterUniforms.uTextureSize.value = v;
    });
    document.getElementById('slider-foam').addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      commonUniforms.uFoamDepth.value = v;
    });

    document.getElementById('col-near').addEventListener('input', (e) => {
      params.colorNear.set(e.target.value);
      waterUniforms.uColorNear.value.set(e.target.value);
      waterMat.color.set(e.target.value);
    });
    document.getElementById('col-far').addEventListener('input', (e) => {
      params.colorFar.set(e.target.value);
      waterUniforms.uColorFar.value.set(e.target.value);
    });
    document.getElementById('col-sand').addEventListener('input', (e) => {
      params.sandColor.set(e.target.value);
      terrainMat.color.set(e.target.value);
    });
    document.getElementById('col-grass').addEventListener('input', (e) => {
      params.grassColor.set(e.target.value);
      terrainUniforms.uGrassColor.value.set(e.target.value);
    });
    document.getElementById('col-under').addEventListener('input', (e) => {
      params.underwaterColor.set(e.target.value);
      terrainUniforms.uUnderwaterColor.value.set(e.target.value);
      seabedMat.color.set(e.target.value);
    });

    // Resize handling
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ------------------------------------------------------------
    // 8. Animation Loop
    // ------------------------------------------------------------
    function animate() {
      requestAnimationFrame(animate);

      const time = performance.now() * 0.001;
      commonUniforms.uTime.value = time;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
