<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stylized Voronoi Water Sandbox</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      background: #7bd5f5;
      font-family: monospace;
      color: #1a202c;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #ui-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #333;
      padding: 10px 14px;
      font-size: 11px;
      z-index: 10;
      max-height: 90vh;
      overflow-y: auto;
      width: 260px;
    }
    #ui-panel h3 { margin: 0 0 8px 0; font-size: 13px; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .row label { font-size: 11px; }
    .row input[type="range"] { width: 110px; }
    .row input[type="color"] { width: 40px; height: 20px; padding: 0; border: none; }
    button { width: 100%; padding: 6px; margin-top: 6px; font-weight: bold; cursor: pointer; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="ui-panel">
    <h3>Voronoi Water Sandbox</h3>
    <div class="row"><label>Scale:</label><input id="p-scale" type="range" min="0.01" max="0.3" step="0.005" value="0.06"></div>
    <div class="row"><label>Smoothness:</label><input id="p-smooth" type="range" min="0.05" max="1.5" step="0.02" value="0.46"></div>
    <div class="row"><label>Edge Threshold:</label><input id="p-thresh" type="range" min="0.01" max="0.3" step="0.005" value="0.09"></div>
    <div class="row"><label>Edge Softness:</label><input id="p-soft" type="range" min="0.01" max="0.2" step="0.01" value="0.10"></div>
    <div class="row"><label>Cell Speed:</label><input id="p-cspeed" type="range" min="0.0" max="2.0" step="0.05" value="0.45"></div>
    <div class="row"><label>Distortion:</label><input id="p-distort" type="range" min="0.0" max="1.0" step="0.02" value="0.26"></div>
    <div class="row"><label>Opacity:</label><input id="p-opac" type="range" min="0.1" max="1.0" step="0.05" value="1.0"></div>
    <div class="row"><label>Deep Opacity:</label><input id="p-deep-opac" type="range" min="0.1" max="1.0" step="0.05" value="0.88"></div>
    <div class="row"><label>Deep Color:</label><input id="p-deep-col" type="color" value="#1a4075"></div>
    <div class="row"><label>Mid Color:</label><input id="p-mid-col" type="color" value="#4da9e8"></div>
    <div class="row"><label>Highlight:</label><input id="p-hi-col" type="color" value="#ffffff"></div>
    <button id="btn-ripple">Click to Trigger Ripple</button>
  </div>
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { createStylizedWaterMaterial, addStylizedWaterRipple, syncStylizedWaterRipples } from './js/water-stylized.js';

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x8ae0fc);
    scene.fog = new THREE.Fog(0x8ae0fc, 100, 800);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 30, 60);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0, 0);

    const light = new THREE.DirectionalLight(0xffffff, 1.2);
    light.position.set(50, 100, 50);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xd8eefa, 0.8));

    // Simple test ground underwater
    const islandGeo = new THREE.ConeGeometry(25, 12, 32);
    const islandMat = new THREE.MeshLambertMaterial({ color: 0x228b22 });
    const island = new THREE.Mesh(islandGeo, islandMat);
    island.position.y = 2;
    scene.add(island);

    // Water
    const waterGeo = new THREE.PlaneGeometry(800, 800, 32, 32);
    waterGeo.rotateX(-Math.PI / 2);
    const { mat: waterMat, uniforms } = createStylizedWaterMaterial({
      uScale: 0.06,
      fadeDistance: 600
    });
    const waterMesh = new THREE.Mesh(waterGeo, waterMat);
    waterMesh.position.y = 0;
    scene.add(waterMesh);

    // Bind UI
    const el = id => document.getElementById(id);
    el('p-scale').oninput = e => uniforms.uScale.value = parseFloat(e.target.value);
    el('p-smooth').oninput = e => uniforms.uSmoothness.value = parseFloat(e.target.value);
    el('p-thresh').oninput = e => uniforms.uEdgeThreshold.value = parseFloat(e.target.value);
    el('p-soft').oninput = e => uniforms.uEdgeSoftness.value = parseFloat(e.target.value);
    el('p-cspeed').oninput = e => uniforms.uCellSpeed.value = parseFloat(e.target.value);
    el('p-distort').oninput = e => uniforms.uDistortAmount.value = parseFloat(e.target.value);
    el('p-opac').oninput = e => uniforms.uOpacity.value = parseFloat(e.target.value);
    el('p-deep-opac').oninput = e => uniforms.uDeepOpacity.value = parseFloat(e.target.value);
    el('p-deep-col').oninput = e => uniforms.uDeepColor.value.set(e.target.value);
    el('p-mid-col').oninput = e => uniforms.uMidColor.value.set(e.target.value);
    el('p-hi-col').oninput = e => uniforms.uHighlight.value.set(e.target.value);

    let curTime = 0;
    el('btn-ripple').onclick = () => {
      addStylizedWaterRipple(0, 0, curTime);
    };

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      curTime = clock.getElapsedTime();
      uniforms.uTime.value = curTime;
      uniforms.uCamXZ.value.set(camera.position.x, camera.position.z);
      syncStylizedWaterRipples(uniforms);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
